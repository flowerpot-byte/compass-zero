<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1140" viewBox="0 0 900 1140">
  <!-- Zum Tipp "Krampfanfall: nichts festhalten, nichts in den Mund".
       Dieser Tipp ist der beste Fall fuer ein Bild aus VERBOTEN. Die beiden
       Fehler sind nicht Unwissen, sondern Reflex: Man will den Mund
       freimachen und man will die Zuckungen anhalten. Beides steht deshalb
       gross und durchgestrichen ganz oben, VOR allem, was man tun soll.
       Die Leitlinie fuehrt beides ausdruecklich als eigene Regel und sagt
       dazu, dass es die Person verletzen kann.
       Danach erst die Reihenfolge. Der dritte Schritt ist der, den man ohne
       Grund vergisst: auf die Uhr sehen. Der Grund steht direkt darunter und
       rot, sonst bleibt der Schritt beliebig: fuenf Minuten am Stueck sind
       die Grenze, ab der der Notruf gewaehlt wird.
       Der Absatz zur Wuerde steht mit im Bild, weil die Leitlinie ihm einen
       eigenen Absatz gegeben hat und weil er beim Ueberfliegen als Erstes
       untergeht. Er kostet nichts und er ist das, was von dem Vorfall bei
       der betroffenen Person haengen bleibt.
       Ebenso die Verwirrtheit danach: Wer nicht damit rechnet, haelt sie fuer
       Boeswilligkeit und fasst genau dann wieder an. -->
  <rect width="900" height="1140" fill="#faf9f6"/>
  <text x="40" y="46" font-family="Georgia, serif" font-size="28" fill="#111">Krampfanfall: nichts festhalten, nichts in den Mund</text>

  <!-- ============ A: die zwei Verbote ============ -->
  <text x="40" y="96" font-family="Georgia, serif" font-size="23" fill="#a3231a">Zwei Dinge, zu denen der erste Reflex drängt — beide falsch</text>

  <!-- 1: nichts zwischen die Zaehne -->
  <circle cx="170" cy="212" r="52" fill="#f2ece2" stroke="#111" stroke-width="4"/>
  <circle cx="190" cy="196" r="4" fill="#111"/>
  <path d="M 218 204 L 236 214 L 218 224 Z" fill="#f2ece2" stroke="#111" stroke-width="3"/>
  <line x1="194" y1="240" x2="220" y2="240" stroke="#111" stroke-width="6"/>
  <line x1="288" y1="232" x2="352" y2="232" stroke="#111" stroke-width="7"/>
  <ellipse cx="270" cy="232" rx="19" ry="12" fill="#c9c4b4" stroke="#111" stroke-width="3"/>
  <rect x="350" y="214" width="36" height="36" rx="13" fill="#f2ece2" stroke="#111" stroke-width="3"/>
  <g stroke="#111" stroke-width="2">
    <line x1="358" y1="222" x2="378" y2="222"/>
    <line x1="358" y1="232" x2="378" y2="232"/>
    <line x1="358" y1="242" x2="378" y2="242"/>
  </g>
  <g stroke="#a3231a" stroke-width="7" fill="none">
    <circle cx="272" cy="230" r="62"/>
    <line x1="228" y1="186" x2="316" y2="274"/>
  </g>

  <!-- 2: nicht festhalten -->
  <circle cx="540" cy="230" r="26" fill="#f2ece2" stroke="#111" stroke-width="4"/>
  <rect x="566" y="206" width="140" height="48" rx="20" fill="#e8eef2" stroke="#111" stroke-width="4"/>
  <g stroke="#111" stroke-width="12" stroke-linecap="round" fill="none">
    <path d="M 706 220 L 780 214"/>
    <path d="M 706 242 L 780 250"/>
  </g>
  <rect x="596" y="166" width="36" height="30" rx="10" fill="#f2ece2" stroke="#111" stroke-width="3"/>
  <rect x="656" y="166" width="36" height="30" rx="10" fill="#f2ece2" stroke="#111" stroke-width="3"/>
  <g stroke="#111" stroke-width="3" fill="none">
    <path d="M 614 196 L 614 204 M 614 208 l -5 -8 M 614 208 l 5 -8"/>
    <path d="M 674 196 L 674 204 M 674 208 l -5 -8 M 674 208 l 5 -8"/>
  </g>
  <g stroke="#a3231a" stroke-width="7" fill="none">
    <circle cx="640" cy="212" r="76"/>
    <line x1="586" y1="158" x2="694" y2="266"/>
  </g>

  <text x="60" y="340" font-family="Georgia, serif" font-size="23" fill="#a3231a">NICHTS ZWISCHEN DIE ZÄHNE</text>
  <text x="60" y="372" font-family="Georgia, serif" font-size="21" fill="#111">Kein Löffel, kein Stück Holz, kein</text>
  <text x="60" y="398" font-family="Georgia, serif" font-size="21" fill="#111">Finger, kein Tuch — nichts. Das</text>
  <text x="60" y="424" font-family="Georgia, serif" font-size="21" fill="#111">steht in der Leitlinie nicht als</text>
  <text x="60" y="450" font-family="Georgia, serif" font-size="21" fill="#111">Rat, sondern als eigene Regel.</text>

  <text x="470" y="340" font-family="Georgia, serif" font-size="23" fill="#a3231a">NICHT FESTHALTEN</text>
  <text x="470" y="372" font-family="Georgia, serif" font-size="21" fill="#111">Nicht niederdrücken, nicht die Arme</text>
  <text x="470" y="398" font-family="Georgia, serif" font-size="21" fill="#111">halten. Beides kann die Person</text>
  <text x="470" y="424" font-family="Georgia, serif" font-size="21" fill="#111">verletzen. Der Anfall soll seinen</text>
  <text x="470" y="450" font-family="Georgia, serif" font-size="21" fill="#111">Lauf nehmen.</text>

  <line x1="40" y1="486" x2="860" y2="486" stroke="#c9c4b4" stroke-width="3"/>

  <!-- ============ B: was stattdessen, in dieser Reihenfolge ============ -->
  <text x="40" y="526" font-family="Georgia, serif" font-size="23" fill="#1d6b3a">Was stattdessen zu tun ist — in dieser Reihenfolge</text>

  <g fill="#1d6b3a">
    <circle cx="60" cy="563" r="17"/><circle cx="60" cy="629" r="17"/><circle cx="60" cy="669" r="17"/>
  </g>
  <g font-family="Georgia, serif" font-size="19" fill="#faf9f6" text-anchor="middle">
    <text x="60" y="570">1</text><text x="60" y="636">2</text><text x="60" y="676">3</text>
  </g>
  <text x="88" y="570" font-family="Georgia, serif" font-size="21" fill="#111">Alles wegräumen, woran sich die Person stoßen könnte. Die Person selbst NICHT</text>
  <text x="88" y="596" font-family="Georgia, serif" font-size="21" fill="#111">wegziehen — nur, wenn sie unmittelbar in Gefahr liegt, etwa im Verkehr.</text>
  <text x="88" y="636" font-family="Georgia, serif" font-size="21" fill="#111">Etwas Weiches unter den Kopf. Brille abnehmen, enge Kleidung am Hals lockern.</text>
  <text x="88" y="676" font-family="Georgia, serif" font-size="21" fill="#111">Auf die Uhr sehen: wann es anfing, wann es aufhörte, ob es sich wiederholt.</text>

  <circle cx="66" cy="716" r="18" fill="none" stroke="#a3231a" stroke-width="3"/>
  <g stroke="#a3231a" stroke-width="3" stroke-linecap="round">
    <line x1="66" y1="716" x2="66" y2="704"/>
    <line x1="66" y1="716" x2="75" y2="721"/>
  </g>
  <text x="98" y="724" font-family="Georgia, serif" font-size="23" fill="#a3231a">Dauert er länger als fünf Minuten am Stück: Notruf 112.</text>

  <line x1="40" y1="760" x2="860" y2="760" stroke="#c9c4b4" stroke-width="3"/>

  <!-- ============ C: danach ============ -->
  <text x="40" y="800" font-family="Georgia, serif" font-size="23" fill="#1d6b3a">Wenn er vorbei ist</text>
  <text x="40" y="838" font-family="Georgia, serif" font-size="21" fill="#111">Atmung prüfen und im Auge behalten. Das Weiche unter dem Kopf wieder wegnehmen,</text>
  <text x="40" y="864" font-family="Georgia, serif" font-size="21" fill="#111">falls es die Atmung behindert. Atmet die Person normal: auf die Seite drehen.</text>

  <text x="40" y="906" font-family="Georgia, serif" font-size="23" fill="#a3231a">Sie kann verwirrt oder aggressiv sein.</text>
  <text x="40" y="940" font-family="Georgia, serif" font-size="21" fill="#111">Das ist keine Böswilligkeit, sondern gehört zum Aufwachen dazu. Auf die eigene</text>
  <text x="40" y="966" font-family="Georgia, serif" font-size="21" fill="#111">Sicherheit achten und die Person nicht anfassen.</text>

  <line x1="40" y1="1002" x2="860" y2="1002" stroke="#c9c4b4" stroke-width="3"/>

  <!-- ============ D: die Wuerde ============ -->
  <text x="40" y="1042" font-family="Georgia, serif" font-size="23" fill="#1d6b3a">Und der Punkt, der leicht untergeht: die Würde schützen</text>
  <text x="40" y="1078" font-family="Georgia, serif" font-size="21" fill="#111">Zuschauer wegschicken. Ist Urin abgegangen, das zudecken. Wer einen Anfall</text>
  <text x="40" y="1104" font-family="Georgia, serif" font-size="21" fill="#111">hatte, muss nicht auch damit aufwachen, dass ein Dutzend Leute zugesehen hat.</text>
</svg>
