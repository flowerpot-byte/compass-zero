<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580">
  <!-- Zum Tipp nahrung-voegel-eier ("Eier aus dem Nest: die Nahrung, die nachwaechst").

       AUSSAGE: Der eigentliche Kniff des Tipps - "Nimm alle Eier bis auf zwei
       oder drei, und markiere die, die du liegen laesst" - ist ein Ablauf
       ueber mehrere Besuche hinweg. In Worten liest sich das umstaendlich
       (markierte Eier bleiben liegen, neue kommen dazu, nur die frischen
       werden mitgenommen). Im Bild reicht der Vergleich zweier Besuche: im
       zweiten Bild sitzen dieselben drei markierten Eier unveraendert im
       Nest, dazu neue unmarkierte - der Vogel hat nachgelegt. Genau das
       macht aus dem Nest eine Nahrungsquelle, die WOCHENLANG nachliefert.

       REGEL gross: "nur die Frischen mitnehmen" - die groessere Eiergruppe,
       der groessere Text, Farbe #111.
       AUSNAHME klein: "zwei oder drei bleiben liegen, markiert" - die
       kleinere Eiergruppe, kleinerer Text in #5b7f96.

       SIGNALFARBE genau einmal: an der Stelle, an der der Tipp selbst am
       lautesten wird - "NIMM ALLE EIER BIS AUF ZWEI ODER DREI - UND
       MARKIERE DIE, DIE DU LIEGEN LAESST" - sitzt beim ersten Besuch ein
       kleines Warndreieck mit Ausrufezeichen genau bei den Eiern, die
       markiert werden. Beim zweiten Besuch fehlt es bewusst: dort wird
       nicht neu markiert, nur wieder genommen.

       Nicht gezeichnet, weil es eigene Aussagen waeren: die Brutzeiten-Tafel
       (Fruehjahr/Fruehsommer, Eulen im Winter) und der Hinweis zum
       Durchgaren. -->

  <rect width="900" height="580" fill="#faf9f6"/>

  <!-- Kopf -->
  <text x="40" y="46" font-family="Georgia, serif" font-size="25" fill="#111">Eier aus dem Nest: die Nahrung, die nachwächst</text>
  <text x="40" y="72" font-family="Georgia, serif" font-size="17" fill="#111">Ein leeres Nest gibt der Vogel auf, ein halbvolles bestückt er weiter.</text>
  <line x1="40" y1="86" x2="860" y2="86" stroke="#5b7f96" stroke-width="1.5"/>

  <!-- Legende -->
  <defs>
    <path id="ei" d="M 0,-18 C 5,-18 8,-11 8,-3 C 8,9 5,19 0,19 C -5,19 -8,9 -8,-3 C -8,-11 -5,-18 0,-18 Z"/>
  </defs>

  <use href="#ei" transform="translate(60,110)" fill="#e6e2d6" stroke="#111" stroke-width="1.6"/>
  <text x="84" y="115" font-family="Georgia, serif" font-size="15" fill="#111">unmarkiert — nimmst du mit</text>

  <use href="#ei" transform="translate(500,110)" fill="#d9c98a" stroke="#111" stroke-width="1.6"/>
  <line x1="496" y1="106" x2="504" y2="113" stroke="#111" stroke-width="2.2" stroke-linecap="round"/>
  <text x="524" y="115" font-family="Georgia, serif" font-size="15" fill="#111">markiert — bleibt liegen</text>

  <line x1="40" y1="134" x2="860" y2="134" stroke="#e6e2d6" stroke-width="1.5"/>

  <!-- ===================== Panel A: erster Besuch ===================== -->
  <g transform="translate(40,145)" font-family="Georgia, serif">
    <rect width="390" height="300" rx="10" fill="none" stroke="#111" stroke-width="2"/>
    <text x="22" y="34" font-size="20" fill="#111">ERSTER BESUCH</text>

    <!-- Warndreieck: einzige Stelle mit der Signalfarbe -->
    <g transform="translate(115,95)">
      <path d="M 0,-16 L 16,14 L -16,14 Z" fill="#7a5a3e" stroke="#111" stroke-width="1.3"/>
      <text x="0" y="10" font-size="15" fill="#faf9f6" text-anchor="middle">!</text>
    </g>
    <line x1="115" y1="109" x2="115" y2="130" stroke="#5b7f96" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="136" y="100" font-size="14" fill="#111">markieren</text>

    <!-- Nest -->
    <path transform="translate(115,160)" d="M -62,6 C -64,-22 -37,-37 0,-37 C 37,-37 64,-22 62,6 C 62,19 43,24 22,20 C 7,26 -7,26 -22,20 C -43,24 -62,19 -62,6 Z" fill="#7a5a3e" stroke="#111" stroke-width="3"/>

    <!-- drei markierte Eier bleiben liegen (Ausnahme, klein) -->
    <use href="#ei" transform="translate(85,156)" fill="#d9c98a" stroke="#111" stroke-width="1.6"/>
    <line x1="81" y1="152" x2="89" y2="159" stroke="#111" stroke-width="2.2" stroke-linecap="round"/>
    <use href="#ei" transform="translate(115,150)" fill="#d9c98a" stroke="#111" stroke-width="1.6"/>
    <line x1="111" y1="146" x2="119" y2="153" stroke="#111" stroke-width="2.2" stroke-linecap="round"/>
    <use href="#ei" transform="translate(145,156)" fill="#d9c98a" stroke="#111" stroke-width="1.6"/>
    <line x1="141" y1="152" x2="149" y2="159" stroke="#111" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Pfeil zum Korb -->
    <line x1="185" y1="160" x2="255" y2="160" stroke="#111" stroke-width="3"/>
    <polygon points="255,160 244,154 244,166" fill="#111"/>

    <!-- Korb mit vier frischen Eiern (Regel, gross) -->
    <path transform="translate(300,160)" d="M -34,-6 L 34,-6 L 27,34 L -27,34 Z" fill="#faf9f6" stroke="#111" stroke-width="3"/>
    <path transform="translate(300,160)" d="M -20,-6 C -20,-28 20,-28 20,-6" fill="none" stroke="#111" stroke-width="3.5"/>
    <use href="#ei" transform="translate(282,166)" fill="#e6e2d6" stroke="#111" stroke-width="1.6"/>
    <use href="#ei" transform="translate(294,158)" fill="#e6e2d6" stroke="#111" stroke-width="1.6"/>
    <use href="#ei" transform="translate(306,158)" fill="#e6e2d6" stroke="#111" stroke-width="1.6"/>
    <use href="#ei" transform="translate(318,166)" fill="#e6e2d6" stroke="#111" stroke-width="1.6"/>

    <!-- Beschriftungen -->
    <text x="115" y="238" font-size="14" fill="#5b7f96" text-anchor="middle">zwei oder drei</text>
    <text x="115" y="256" font-size="14" fill="#5b7f96" text-anchor="middle">bleiben liegen — markiert</text>

    <text x="300" y="238" font-size="17" fill="#111" text-anchor="middle">NUR DIE FRISCHEN</text>
    <text x="300" y="260" font-size="19" fill="#111" text-anchor="middle">nimmst du mit</text>

    <text x="195" y="284" font-size="14" fill="#5b7f96" text-anchor="middle">erster Fund — schon nutzbar</text>
  </g>

  <!-- ===================== Panel B: Tage später ===================== -->
  <g transform="translate(470,145)" font-family="Georgia, serif">
    <rect width="390" height="300" rx="10" fill="none" stroke="#111" stroke-width="2"/>
    <text x="22" y="34" font-size="20" fill="#111">TAGE SPÄTER</text>
    <text x="22" y="54" font-size="14" fill="#111">der Vogel hat nachgelegt</text>

    <text x="195" y="100" font-size="14" fill="#111" text-anchor="middle">die markierten von neulich liegen noch da</text>

    <!-- Nest, dieselben drei markierten Eier wie im ersten Besuch -->
    <path transform="translate(115,160)" d="M -62,6 C -64,-22 -37,-37 0,-37 C 37,-37 64,-22 62,6 C 62,19 43,24 22,20 C 7,26 -7,26 -22,20 C -43,24 -62,19 -62,6 Z" fill="#7a5a3e" stroke="#111" stroke-width="3"/>

    <use href="#ei" transform="translate(85,156)" fill="#d9c98a" stroke="#111" stroke-width="1.6"/>
    <line x1="81" y1="152" x2="89" y2="159" stroke="#111" stroke-width="2.2" stroke-linecap="round"/>
    <use href="#ei" transform="translate(115,150)" fill="#d9c98a" stroke="#111" stroke-width="1.6"/>
    <line x1="111" y1="146" x2="119" y2="153" stroke="#111" stroke-width="2.2" stroke-linecap="round"/>
    <use href="#ei" transform="translate(145,156)" fill="#d9c98a" stroke="#111" stroke-width="1.6"/>
    <use href="#ei" transform="translate(70,142)" fill="#e6e2d6" stroke="#111" stroke-width="1.6"/>
    <use href="#ei" transform="translate(100,136)" fill="#e6e2d6" stroke="#111" stroke-width="1.6"/>
    <use href="#ei" transform="translate(130,136)" fill="#e6e2d6" stroke="#111" stroke-width="1.6"/>
    <use href="#ei" transform="translate(160,142)" fill="#e6e2d6" stroke="#111" stroke-width="1.6"/>
    <line x1="141" y1="152" x2="149" y2="159" stroke="#111" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Pfeil zum Korb -->
    <line x1="185" y1="160" x2="255" y2="160" stroke="#111" stroke-width="3"/>
    <polygon points="255,160 244,154 244,166" fill="#111"/>

    <!-- Korb mit den neuen frischen Eiern (Regel, gross) -->
    <path transform="translate(300,160)" d="M -34,-6 L 34,-6 L 27,34 L -27,34 Z" fill="#faf9f6" stroke="#111" stroke-width="3"/>
    <path transform="translate(300,160)" d="M -20,-6 C -20,-28 20,-28 20,-6" fill="none" stroke="#111" stroke-width="3.5"/>
    <use href="#ei" transform="translate(282,166)" fill="#e6e2d6" stroke="#111" stroke-width="1.6"/>
    <use href="#ei" transform="translate(294,158)" fill="#e6e2d6" stroke="#111" stroke-width="1.6"/>
    <use href="#ei" transform="translate(306,158)" fill="#e6e2d6" stroke="#111" stroke-width="1.6"/>
    <use href="#ei" transform="translate(318,166)" fill="#e6e2d6" stroke="#111" stroke-width="1.6"/>

    <!-- Beschriftungen -->
    <text x="115" y="238" font-size="14" fill="#5b7f96" text-anchor="middle">zwei oder drei</text>
    <text x="115" y="256" font-size="14" fill="#5b7f96" text-anchor="middle">bleiben weiterhin liegen</text>

    <text x="300" y="238" font-size="17" fill="#111" text-anchor="middle">NUR DIE FRISCHEN</text>
    <text x="300" y="260" font-size="19" fill="#111" text-anchor="middle">nimmst du mit</text>

    <text x="195" y="284" font-size="14" fill="#5b7f96" text-anchor="middle">das Nest liefert weiter</text>
  </g>

  <!-- Fuss -->
  <text x="40" y="470" font-family="Georgia, serif" font-size="16" fill="#5b7f96">So liefert ein Nest WOCHENLANG nach — ein leeres Nest gibt der Vogel auf,</text>
  <text x="40" y="492" font-family="Georgia, serif" font-size="16" fill="#5b7f96">ein halbvolles bestückt er weiter, solange ein paar Eier liegen bleiben.</text>
  <text x="40" y="546" font-family="Georgia, serif" font-size="18" fill="#d65a1a">Eier werden durchgegart — hart gekocht oder durchgebraten. Ein Ei, das beim Öffnen</text>
  <text x="40" y="568" font-family="Georgia, serif" font-size="18" fill="#d65a1a">streng riecht, kommt weg.</text>
</svg>
