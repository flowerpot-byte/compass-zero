<svg xmlns="http://www.w3.org/2000/svg" width="900" height="680" viewBox="0 0 900 680">
  <!-- Zum Tipp "Wann eine Lungenentzuendung kippt".
       Der Tipp sagt, was man hoert. Diese Zeichnung sagt, WO man hinhoert und
       warum die Reihenfolge zaehlt: Es geht nicht darum, ein Geraeusch zu
       erkennen, sondern darum, zwei Seiten in GLEICHER HOEHE zu vergleichen.
       Eine Seite, die leiser oder dumpfer klingt als die andere, ist auch fuer
       ein ungeuebtes Ohr zu hoeren; ein einzelnes Geraeusch zu benennen ist es
       nicht. -->
  <rect width="900" height="640" fill="#faf9f6"/>
  <text x="40" y="52" font-family="Georgia, serif" font-size="30" fill="#111">Abhorchen ohne Gerät: immer im Seitenvergleich</text>

  <!-- Ruecken -->
  <text x="60" y="106" font-family="Georgia, serif" font-size="24" fill="#111">Von hinten, Oberkörper frei</text>

  <!-- Kopf -->
  <circle cx="330" cy="176" r="46" fill="#faf9f6" stroke="#111" stroke-width="5"/>
  <!-- Schultern und Rumpf -->
  <path d="M 330 222 L 250 250 Q 206 264 200 316 L 210 486 Q 260 508 330 508
           Q 400 508 450 486 L 460 316 Q 454 264 410 250 Z"
        fill="#e6e2d6" stroke="#111" stroke-width="5" stroke-linejoin="round"/>
  <!-- Wirbelsaeule als Mittellinie -->
  <line x1="330" y1="250" x2="330" y2="500" stroke="#111" stroke-width="3" stroke-dasharray="8 8" opacity="0.6"/>

  <!-- Hoerpunkte, drei Paare in gleicher Hoehe -->
  <g fill="#d65a1a">
    <circle cx="272" cy="304" r="15"/><circle cx="388" cy="304" r="15"/>
    <circle cx="264" cy="376" r="15"/><circle cx="396" cy="376" r="15"/>
    <circle cx="262" cy="448" r="15"/><circle cx="398" cy="448" r="15"/>
  </g>
  <!-- Verbindungslinien: was miteinander verglichen wird -->
  <g stroke="#d65a1a" stroke-width="2.5" stroke-dasharray="7 6">
    <line x1="272" y1="304" x2="388" y2="304"/>
    <line x1="264" y1="376" x2="396" y2="376"/>
    <line x1="262" y1="448" x2="398" y2="448"/>
  </g>
  <g font-family="Georgia, serif" font-size="21" fill="#111">
    <text x="500" y="312">oben — bei Tuberkulose</text>
    <text x="500" y="338">typischerweise hier</text>
    <text x="500" y="384">Mitte</text>
    <text x="500" y="454">unten</text>
  </g>
  <g stroke="#111" stroke-width="1.5">
    <line x1="412" y1="304" x2="492" y2="304"/>
    <line x1="420" y1="376" x2="492" y2="376"/>
    <line x1="422" y1="448" x2="492" y2="448"/>
  </g>

  <text x="40" y="556" font-family="Georgia, serif" font-size="22" fill="#111">Ohr fest auflegen. Die Person atmet tief durch den OFFENEN Mund.</text>
  <text x="40" y="586" font-family="Georgia, serif" font-size="22" fill="#111">Jedes Paar direkt nacheinander: links, rechts, gleiche Höhe. Alle drei Paare —</text>
  <text x="40" y="616" font-family="Georgia, serif" font-size="22" fill="#111">eine Lungenentzündung kann in jeder Höhe sitzen.</text>
  <text x="40" y="646" font-family="Georgia, serif" font-size="22" fill="#d65a1a">Eine Seite leiser oder dumpfer als die andere ist der Befund.</text>
</svg>
