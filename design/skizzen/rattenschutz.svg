<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580">
  <!-- Zum Tipp "Ratten und Maeuse von den Vorraeten fernhalten".
       Die Quelle sagt zwei Dinge, die man nicht errät und die beide an der
       FORM haengen: Ein Schutzblech muss mindestens einen Meter ueber dem
       Boden sitzen, und es muss kegelfoermig sein. Schlauchfoermige
       Manschetten um das Bein herum haben sich als wirkungslos erwiesen.
       Wer nur den Text liest, baut sehr wahrscheinlich die Manschette:
       Sie ist die naheliegendere Bauform. Deshalb hier beide nebeneinander. -->
  <rect width="900" height="580" fill="#faf9f6"/>
  <text x="30" y="44" font-family="Georgia, serif" font-size="25" fill="#111">Rattenschutz am Vorratsbau: die Form entscheidet</text>

  <!-- ===================== LINKS: Manschette, wirkungslos ===================== -->
  <text x="66" y="92" font-family="Georgia, serif" font-size="20" fill="#111">Manschette um das Bein</text>

  <line x1="50" y1="500" x2="420" y2="500" stroke="#111" stroke-width="3"/>
  <g stroke="#111" stroke-width="2" opacity="0.4">
    <line x1="62" y1="500" x2="50" y2="514"/><line x1="112" y1="500" x2="100" y2="514"/>
    <line x1="162" y1="500" x2="150" y2="514"/><line x1="212" y1="500" x2="200" y2="514"/>
    <line x1="262" y1="500" x2="250" y2="514"/><line x1="312" y1="500" x2="300" y2="514"/>
    <line x1="362" y1="500" x2="350" y2="514"/><line x1="412" y1="500" x2="400" y2="514"/>
  </g>
  <rect x="86" y="118" width="290" height="30" fill="#e6e2d6" stroke="#111" stroke-width="4"/>
  <rect x="216" y="148" width="26" height="352" fill="#e6e2d6" stroke="#111" stroke-width="4"/>
  <!-- Manschette: schlauchfoermig um das Bein gelegt -->
  <rect x="192" y="320" width="74" height="58" fill="#c9c4b4" stroke="#111" stroke-width="4"/>

  <!-- Sprungbogen: vom Boden ueber die Manschette hinweg -->
  <path d="M 138 486 Q 118 268 250 268" fill="none" stroke="#d65a1a" stroke-width="3"
        stroke-dasharray="9 7"/>
  <path d="M 250 268 l -13 -6 M 250 268 l -13 7" fill="none" stroke="#d65a1a" stroke-width="3"/>

  <!-- Ratte oberhalb der Manschette: sie ist schon vorbei -->
  <g transform="translate(300 272)">
    <ellipse cx="0" cy="0" rx="30" ry="16" fill="#c9c4b4" stroke="#111" stroke-width="3.5"/>
    <path d="M 24 -8 Q 42 -6 52 1 Q 42 9 24 9 Z" fill="#c9c4b4" stroke="#111" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="22" cy="-14" r="8" fill="#faf9f6" stroke="#111" stroke-width="3"/>
    <circle cx="40" cy="0" r="2.5" fill="#111"/>
    <path d="M -28 2 Q -56 6 -62 -14" fill="none" stroke="#111" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-10" y1="14" x2="-12" y2="26" stroke="#111" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="12" y1="14" x2="14" y2="26" stroke="#111" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <g stroke="#d65a1a" stroke-width="6" stroke-linecap="round">
    <line x1="288" y1="332" x2="330" y2="374"/>
    <line x1="330" y1="332" x2="288" y2="374"/>
  </g>
  <text x="60" y="548" font-family="Georgia, serif" font-size="18" fill="#d65a1a">Ratten springen darüber. Wirkungslos.</text>

  <!-- ===================== RECHTS: Kegel, wirksam ===================== -->
  <text x="520" y="92" font-family="Georgia, serif" font-size="20" fill="#111">Kegel, nach unten weiter</text>

  <line x1="490" y1="500" x2="866" y2="500" stroke="#111" stroke-width="3"/>
  <g stroke="#111" stroke-width="2" opacity="0.4">
    <line x1="502" y1="500" x2="490" y2="514"/><line x1="552" y1="500" x2="540" y2="514"/>
    <line x1="602" y1="500" x2="590" y2="514"/><line x1="652" y1="500" x2="640" y2="514"/>
    <line x1="702" y1="500" x2="690" y2="514"/><line x1="752" y1="500" x2="740" y2="514"/>
    <line x1="802" y1="500" x2="790" y2="514"/><line x1="852" y1="500" x2="840" y2="514"/>
  </g>
  <rect x="530" y="118" width="290" height="30" fill="#e6e2d6" stroke="#111" stroke-width="4"/>
  <rect x="662" y="148" width="26" height="352" fill="#e6e2d6" stroke="#111" stroke-width="4"/>
  <!-- Kegel: oben schmal am Bein, unten weit -->
  <path d="M 660 316 L 690 316 L 754 380 L 596 380 Z"
        fill="#c9c4b4" stroke="#111" stroke-width="4" stroke-linejoin="round"/>

  <!-- Ratte darunter, neben dem Bein: kommt nicht weiter -->
  <g transform="translate(590 452)">
    <ellipse cx="0" cy="0" rx="30" ry="16" fill="#c9c4b4" stroke="#111" stroke-width="3.5"/>
    <path d="M 24 -8 Q 42 -6 52 1 Q 42 9 24 9 Z" fill="#c9c4b4" stroke="#111" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="22" cy="-14" r="8" fill="#faf9f6" stroke="#111" stroke-width="3"/>
    <circle cx="40" cy="0" r="2.5" fill="#111"/>
    <path d="M -28 2 Q -56 6 -62 -14" fill="none" stroke="#111" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-10" y1="14" x2="-12" y2="26" stroke="#111" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="12" y1="14" x2="14" y2="26" stroke="#111" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <!-- Prallpfeil: stoesst unten an den Kegel -->
  <g stroke="#d65a1a" stroke-width="3" fill="none">
    <line x1="618" y1="424" x2="618" y2="392"/>
    <path d="M 618 392 l -7 13 M 618 392 l 7 13"/>
  </g>
  <text x="700" y="428" font-family="Georgia, serif" font-size="18" fill="#111">kein Halt an</text>
  <text x="700" y="452" font-family="Georgia, serif" font-size="18" fill="#111">der Unterseite</text>

  <!-- Hoehenmass: vom Boden bis zur Unterkante des Blechs -->
  <g stroke="#111" stroke-width="2">
    <line x1="530" y1="380" x2="530" y2="500"/>
    <path d="M 530 380 l -6 12 M 530 380 l 6 12"/>
    <path d="M 530 500 l -6 -12 M 530 500 l 6 -12"/>
  </g>
  <text x="418" y="432" font-family="Georgia, serif" font-size="18" fill="#111">mindestens</text>
  <text x="438" y="456" font-family="Georgia, serif" font-size="18" fill="#111">1 Meter</text>

  <text x="520" y="548" font-family="Georgia, serif" font-size="18" fill="#111">Blechkanister oder Blech reichen als Material.</text>
</svg>
