<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640">
  <!-- Zum Tipp taktisch-sturm-vorbereiten.

       GEZEIGTE AUSSAGE: Ein Sturm ist die Katastrophe mit Vorwarnzeit
       (Text: "Ein Sturm ist die Katastrophe mit Vorwarnzeit ... aber ein
       Orkantief steht Stunden bis Tage vorher in der Warnung"), und diese
       Stunden muessen in der richtigen Reihenfolge genutzt werden, weil der
       Text selbst sagt: "und zwar in dieser Reihenfolge, weil das
       Draussenarbeiten zuerst unmoeglich wird". Das ist in Worten eine
       trockene Begruendung, als Bild aber sofort einleuchtend: zwei
       unterschiedlich lange Zeitfenster auf derselben Zeitachse. Das kurze
       Fenster (draussen) schliesst frueh, das lange (drinnen) reicht fast
       bis zum Sturm.

       Die Regel gross: der Satz zur Vorwarnzeit steht fett, ueber die volle
       Breite, oben. Die Ausnahme klein: der Tornado, den der Text
       ausdruecklich abgrenzt ("Tornados und Gewitterboeen kommen in
       Minuten"), steht darunter als kleiner, duenn umrandeter Kasten mit
       normaler Schriftgroesse.

       Die sieben Punkte sind aus dem Text uebernommen, in seiner eigenen
       Reihenfolge (1 bis 7), nur gekuerzt auf ein bis zwei Woerter je
       Gegenstand. Keine Zahl aus dem Text wird gezeigt, weil in dieser
       Aussage keine gebraucht wird — die Kernaussage ist die Reihenfolge,
       nicht ein Messwert.

       Die Signalfarbe wird nicht verwendet: der Tipp setzt an keiner Stelle
       dieser Aussage ein eigenes Ausrufezeichen (kein hervorgehobener
       Einzelsatz, keine Warnung vor einer falschen Handlung an genau einem
       Punkt). Eine erfundene Stelle waere schlimmer als keine.

       NEUBAU-HINWEIS: Erste Fassung liess die fette Regelzeile neben den
       Tornado-Kasten laufen. Im echten Chromium-Screenshot (nicht nur die
       Breitenschaetzung) lief der fette Text sichtbar in den Kasten hinein.
       Deshalb steht die Regel jetzt allein auf voller Breite, der Tornado
       darunter als eigene kleine Zeile. -->

  <rect width="900" height="640" fill="#faf9f6"/>

  <text x="40" y="46" font-family="Georgia, serif" font-size="26" fill="#111">Sturm mit Vorwarnzeit: die Stunden davor</text>
  <text x="40" y="72" font-family="Georgia, serif" font-size="17" fill="#111">Diese Stunden sind der ganze Unterschied — und sie werden regelmäßig verschenkt.</text>
  <line x1="40" y1="88" x2="860" y2="88" stroke="#5b7f96" stroke-width="1.5"/>

  <!-- ============ Regel gross, volle Breite ============ -->
  <text x="40" y="116" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#111">Ein Orkantief steht Stunden bis Tage vorher in der Warnung.</text>
  <text x="40" y="144" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#111">Das macht ihn zur Katastrophe mit Vorwarnzeit.</text>

  <!-- ============ Ausnahme klein, darunter ============ -->
  <rect x="40" y="162" width="420" height="60" rx="6" fill="none" stroke="#5b7f96" stroke-width="1.2"/>
  <path d="M 50,168 L 90,168 L 83,182 L 57,182 Z" fill="#e6e2d6" stroke="#111" stroke-width="1.8"/>
  <path d="M 59,186 L 81,186 L 75,198 L 65,198 Z" fill="#e6e2d6" stroke="#111" stroke-width="1.8"/>
  <path d="M 67,202 L 73,202 L 70,214 L 68,214 Z" fill="#e6e2d6" stroke="#111" stroke-width="1.8"/>
  <text x="102" y="182" font-family="Georgia, serif" font-size="16" fill="#111">Tornado: in Minuten da —</text>
  <text x="102" y="204" font-family="Georgia, serif" font-size="16" fill="#111">keine Zeit für diese Liste.</text>

  <!-- ============ Zeitachse ============ -->
  <text x="60" y="242" font-family="Georgia, serif" font-size="16" fill="#111">JETZT — Warnung kommt</text>
  <text x="840" y="242" text-anchor="end" font-family="Georgia, serif" font-size="16" fill="#111">STURM beginnt</text>
  <line x1="60" y1="254" x2="838" y2="254" stroke="#5b7f96" stroke-width="2"/>
  <path d="M 838,248 L 850,254 L 838,260 Z" fill="#5b7f96"/>

  <!-- ============ DRAUSSEN: kurzes Fenster ============ -->
  <text x="40" y="282" font-family="Georgia, serif" font-size="19" font-weight="bold" fill="#111">DRAUSSEN — muss zuerst fertig sein</text>
  <rect x="60" y="290" width="330" height="44" fill="#d9c98a" stroke="#111" stroke-width="3"/>
  <line x1="390" y1="290" x2="390" y2="254" stroke="#5b7f96" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- Gegenstand 1: Blumenkasten, fuer "lose Gegenstaende hereinholen" -->
  <circle cx="77" cy="338" r="13" fill="#7a5a3e"/>
  <text x="77" y="343" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#faf9f6">1</text>
  <circle cx="107" cy="354" r="7" fill="#d9c98a" stroke="#111" stroke-width="1.5"/>
  <circle cx="115" cy="348" r="8" fill="#d9c98a" stroke="#111" stroke-width="1.5"/>
  <circle cx="123" cy="354" r="7" fill="#d9c98a" stroke="#111" stroke-width="1.5"/>
  <path d="M 97,394 L 133,394 L 129,364 L 101,364 Z" fill="#d9c98a" stroke="#111" stroke-width="2.5"/>
  <text x="115" y="414" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#111">Lose</text>
  <text x="115" y="434" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#111">Gegenstände</text>

  <!-- Gegenstand 2: Auto, fuer "Auto wegstellen" -->
  <circle cx="190" cy="338" r="13" fill="#7a5a3e"/>
  <text x="190" y="343" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#faf9f6">2</text>
  <path d="M 204,384 L 204,374 Q 204,366 212,366 L 220,366 Q 224,356 234,356 L 240,356 Q 250,356 254,366 L 260,366 Q 264,366 264,374 L 264,384 Z" fill="#d9c98a" stroke="#111" stroke-width="2.5"/>
  <circle cx="214" cy="386" r="7" fill="#111"/>
  <circle cx="254" cy="386" r="7" fill="#111"/>
  <text x="228" y="414" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#111">Auto</text>
  <text x="228" y="434" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#111">wegstellen</text>

  <!-- Gegenstand 3: Fensterladen, fuer "Fensterlaeden und Rollaeden schliessen" -->
  <circle cx="303" cy="338" r="13" fill="#7a5a3e"/>
  <text x="303" y="343" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#faf9f6">3</text>
  <rect x="313" y="352" width="14" height="38" fill="#d9c98a" stroke="#111" stroke-width="2"/>
  <line x1="316" y1="360" x2="324" y2="360" stroke="#111" stroke-width="1"/>
  <line x1="316" y1="370" x2="324" y2="370" stroke="#111" stroke-width="1"/>
  <line x1="316" y1="380" x2="324" y2="380" stroke="#111" stroke-width="1"/>
  <rect x="329" y="352" width="24" height="38" fill="#e6e2d6" stroke="#111" stroke-width="2"/>
  <rect x="355" y="352" width="14" height="38" fill="#d9c98a" stroke="#111" stroke-width="2"/>
  <line x1="358" y1="360" x2="366" y2="360" stroke="#111" stroke-width="1"/>
  <line x1="358" y1="370" x2="366" y2="370" stroke="#111" stroke-width="1"/>
  <line x1="358" y1="380" x2="366" y2="380" stroke="#111" stroke-width="1"/>
  <text x="341" y="414" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#111">Fensterläden</text>
  <text x="341" y="434" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#111">schließen</text>

  <!-- ============ DRINNEN: langes Fenster ============ -->
  <text x="40" y="470" font-family="Georgia, serif" font-size="19" font-weight="bold" fill="#111">DRINNEN — hat länger Zeit</text>
  <rect x="60" y="478" width="780" height="44" fill="#e6e2d6" stroke="#111" stroke-width="3"/>
  <line x1="840" y1="478" x2="840" y2="254" stroke="#5b7f96" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- Gegenstand 4: Eimer, fuer "Gefaesse mit Wasser fuellen" -->
  <circle cx="119" cy="526" r="13" fill="#7a5a3e"/>
  <text x="119" y="531" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#faf9f6">4</text>
  <path d="M 141,544 Q 157,528 173,544" fill="none" stroke="#111" stroke-width="2.5"/>
  <path d="M 135,542 L 179,542 L 173,580 L 141,580 Z" fill="#e6e2d6" stroke="#111" stroke-width="2.5"/>
  <line x1="143" y1="557" x2="171" y2="557" stroke="#111" stroke-width="1.5"/>
  <text x="157" y="602" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#111">Wasser</text>
  <text x="157" y="622" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#111">füllen</text>

  <!-- Gegenstand 5: Kuehlschrank, fuer "Kuehl- und Gefrierschrank auf die kaelteste Stufe" -->
  <circle cx="314" cy="526" r="13" fill="#7a5a3e"/>
  <text x="314" y="531" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#faf9f6">5</text>
  <rect x="332" y="538" width="40" height="42" rx="4" fill="#e6e2d6" stroke="#111" stroke-width="2.5"/>
  <line x1="332" y1="552" x2="372" y2="552" stroke="#111" stroke-width="1.5"/>
  <line x1="366" y1="542" x2="366" y2="550" stroke="#111" stroke-width="2"/>
  <line x1="366" y1="558" x2="366" y2="576" stroke="#111" stroke-width="2"/>
  <circle cx="344" cy="568" r="6" fill="none" stroke="#111" stroke-width="1.5"/>
  <line x1="344" y1="568" x2="344" y2="563" stroke="#111" stroke-width="1.5"/>
  <text x="352" y="602" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#111">Kühlschrank</text>
  <text x="352" y="622" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#111">kalt stellen</text>

  <!-- Gegenstand 6: Geldschein, fuer "Bargeld bereitlegen" -->
  <circle cx="509" cy="526" r="13" fill="#7a5a3e"/>
  <text x="509" y="531" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#faf9f6">6</text>
  <rect x="521" y="544" width="52" height="30" rx="3" fill="#d9c98a" stroke="#111" stroke-width="2.5"/>
  <ellipse cx="547" cy="559" rx="8" ry="10" fill="none" stroke="#111" stroke-width="1.5"/>
  <circle cx="528" cy="551" r="2" fill="#111"/>
  <circle cx="566" cy="551" r="2" fill="#111"/>
  <circle cx="528" cy="567" r="2" fill="#111"/>
  <circle cx="566" cy="567" r="2" fill="#111"/>
  <text x="547" y="602" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#111">Bargeld</text>
  <text x="547" y="622" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#111">bereitlegen</text>

  <!-- Gegenstand 7: Radio, fuer "Lampen und Radio pruefen und laden" -->
  <circle cx="704" cy="526" r="13" fill="#7a5a3e"/>
  <text x="704" y="531" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#faf9f6">7</text>
  <line x1="750" y1="540" x2="756" y2="522" stroke="#111" stroke-width="2"/>
  <rect x="718" y="540" width="48" height="36" rx="6" fill="#e6e2d6" stroke="#111" stroke-width="2.5"/>
  <circle cx="732" cy="558" r="9" fill="none" stroke="#111" stroke-width="1.8"/>
  <circle cx="756" cy="558" r="6" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="742" y="602" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#111">Lampen &amp;</text>
  <text x="742" y="622" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#111">Radio laden</text>
</svg>
