<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620">
  <!-- Zum Tipp "Wenn ein Kind zu schnell atmet: Lungenentzuendung".
       Die Quelle grenzt das Zeichen ausdruecklich ab, und diese Abgrenzung
       ist der Grund fuer das Bild: Gemeint ist, dass die untere
       BRUSTKORBWAND beim Einatmen nach innen geht. Zieht sich nur das weiche
       Gewebe ZWISCHEN den Rippen oder UEBER dem Schluesselbein ein, ist es
       NICHT gemeint. Wer das verwechselt, haelt ein Kind fuer schwerkrank,
       das es nicht ist — oder umgekehrt. In Worten ist der Unterschied
       schwer zu fassen, im Bild sofort. -->
  <rect width="900" height="620" fill="#faf9f6"/>
  <text x="40" y="52" font-family="Georgia, serif" font-size="30" fill="#111">Einziehungen: was zählt und was nicht</text>

  <!-- ================= LINKS: gemeint ist der untere Brustkorb ================= -->
  <text x="60" y="106" font-family="Georgia, serif" font-size="24" fill="#111">Das ist gemeint</text>

  <!-- Kopf -->
  <circle cx="240" cy="182" r="42" fill="#faf9f6" stroke="#111" stroke-width="5"/>
  <!-- Hals -->
  <path d="M 240 224 L 240 250" stroke="#111" stroke-width="12" stroke-linecap="round"/>
  <!-- Rumpf: obere Haelfte normal, untere Brustkorbwand eingezogen -->
  <path d="M 178 250 L 302 250 L 312 320
           C 296 330 288 344 292 358
           L 302 430 L 178 430 L 188 358
           C 192 344 184 330 168 320 Z"
        fill="#e6e2d6" stroke="#111" stroke-width="5" stroke-linejoin="round"/>
  <!-- Rippenlinien -->
  <g stroke="#111" stroke-width="2.5" opacity="0.5" fill="none">
    <path d="M 196 276 Q 240 288 284 276"/>
    <path d="M 194 300 Q 240 312 286 300"/>
  </g>
  <!-- Pfeile: die untere Brustkorbwand geht nach innen -->
  <g stroke="#d65a1a" stroke-width="5" fill="none">
    <line x1="106" y1="340" x2="160" y2="340"/>
    <path d="M 160 340 l -16 -9 M 160 340 l -16 9"/>
    <line x1="374" y1="340" x2="320" y2="340"/>
    <path d="M 320 340 l 16 -9 M 320 340 l 16 9"/>
  </g>
  <text x="60" y="490" font-family="Georgia, serif" font-size="23" fill="#111">Die untere Brustkorbwand</text>
  <text x="60" y="520" font-family="Georgia, serif" font-size="23" fill="#111">selbst geht beim EINATMEN</text>
  <text x="60" y="550" font-family="Georgia, serif" font-size="23" fill="#111">nach innen.</text>
  <text x="60" y="588" font-family="Georgia, serif" font-size="23" fill="#d65a1a">Ernstes Zeichen.</text>

  <!-- Trennlinie -->
  <line x1="450" y1="130" x2="450" y2="560" stroke="#111" stroke-width="2" opacity="0.3"/>

  <!-- ================= RECHTS: nicht gemeint ================= -->
  <text x="500" y="106" font-family="Georgia, serif" font-size="24" fill="#111">Das ist NICHT gemeint</text>

  <circle cx="672" cy="182" r="42" fill="#faf9f6" stroke="#111" stroke-width="5"/>
  <path d="M 672 224 L 672 250" stroke="#111" stroke-width="12" stroke-linecap="round"/>
  <!-- Rumpf mit gerader unterer Brustkorbwand -->
  <path d="M 610 250 L 734 250 L 744 320 L 734 430 L 610 430 L 600 320 Z"
        fill="#e6e2d6" stroke="#111" stroke-width="5" stroke-linejoin="round"/>
  <g stroke="#111" stroke-width="2.5" opacity="0.5" fill="none">
    <path d="M 628 276 Q 672 288 716 276"/>
    <path d="M 626 300 Q 672 312 718 300"/>
  </g>
  <!-- kleine Dellen zwischen den Rippen -->
  <g fill="#c9c4b4" stroke="#111" stroke-width="2">
    <ellipse cx="644" cy="288" rx="11" ry="6"/>
    <ellipse cx="700" cy="288" rx="11" ry="6"/>
    <ellipse cx="644" cy="312" rx="11" ry="6"/>
    <ellipse cx="700" cy="312" rx="11" ry="6"/>
  </g>
  <!-- Delle ueber dem Schluesselbein -->
  <ellipse cx="640" cy="252" rx="14" ry="7" fill="#c9c4b4" stroke="#111" stroke-width="2"/>
  <ellipse cx="704" cy="252" rx="14" ry="7" fill="#c9c4b4" stroke="#111" stroke-width="2"/>

  <g font-family="Georgia, serif" font-size="19" fill="#111">
    <line x1="744" y1="252" x2="722" y2="252" stroke="#111" stroke-width="2"/>
    <text x="750" y="246">über dem</text>
    <text x="750" y="268">Schlüsselbein</text>
    <line x1="744" y1="300" x2="716" y2="300" stroke="#111" stroke-width="2"/>
    <text x="750" y="320">zwischen</text>
    <text x="750" y="342">den Rippen</text>
  </g>

  <text x="500" y="490" font-family="Georgia, serif" font-size="23" fill="#111">Nur das weiche Gewebe</text>
  <text x="500" y="520" font-family="Georgia, serif" font-size="23" fill="#111">zieht sich ein, die</text>
  <text x="500" y="550" font-family="Georgia, serif" font-size="23" fill="#111">Brustkorbwand bleibt gerade.</text>
  <text x="500" y="588" font-family="Georgia, serif" font-size="23" fill="#111">Zählt hier nicht.</text>
</svg>
