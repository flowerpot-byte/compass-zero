<svg xmlns="http://www.w3.org/2000/svg" width="900" height="670" viewBox="0 0 900 670">
  <!-- Zum Tipp "Defibrillator (AED): anwenden" (erste-hilfe-aed-anwenden).
       Aussage: Sobald ein Schock empfohlen wird, darf niemand mehr die Person
       beruehren, bevor die Schocktaste gedrueckt wird.
       Begruendung: Das ist reine Abstands-/Koerperhaltungs-Regel. In Worten
       ist sie nur als Checkliste zu erklaeren ("stelle sicher, dass weder du
       noch jemand anderes die Person beruehrt"). Im Bild ist sie sofort als
       Luecke zwischen den Helfern und der Person zu sehen. Der Tipp setzt an
       keiner Stelle ein Ausrufezeichen, deshalb bleibt die Signalfarbe hier
       ganz weg. Die kleine Nebenszene zeigt die kuerzer beschriebene
       Ausnahme: wird kein Schock empfohlen, geht es ohne Tastendruck sofort
       mit der Wiederbelebung weiter. -->

  <rect width="900" height="670" fill="#faf9f6"/>

  <text x="40" y="50" font-family="Georgia, serif" font-size="26" fill="#111">AED: Vor dem Schock berührt niemand die Person</text>
  <text x="40" y="84" font-family="Georgia, serif" font-size="18" fill="#111">Wird ein Schock empfohlen, muss zuerst jeder Kontakt zur Person aufhören.</text>

  <!-- Abstandszone: gestrichelte Grenze um die liegende Person -->
  <ellipse cx="295" cy="305" rx="210" ry="110" fill="none" stroke="#d65a1a" stroke-width="5" stroke-dasharray="12 9"/>
  <text x="295" y="172" font-family="Georgia, serif" font-size="18" fill="#111" text-anchor="middle">niemand berührt die Person</text>

  <!-- Liegende Person von oben, nackter Brustkorb mit aufgeklebten Pads.
       Ein einziger zusammenhaengender Umriss: Kopf als Bogen, Koerper als
       gerade Strecken, kein Kreis mit angesetzten Strichen. -->
  <path d="M 12 -44 L 20 -20 L 20 140
           A 20 20 0 0 1 -20 140
           L -20 -20 L -12 -44
           A 27 27 0 1 1 12 -44 Z"
        transform="translate(300,305) rotate(-90) scale(1.3)"
        fill="#e6e2d6" stroke="#111" stroke-width="4" stroke-linejoin="round"/>

  <!-- Elektrodenpads auf dem Brustkorb -->
  <ellipse cx="245" cy="275" rx="18" ry="13" fill="#d9c98a" stroke="#111" stroke-width="2"/>
  <ellipse cx="265" cy="325" rx="17" ry="12" fill="#d9c98a" stroke="#111" stroke-width="2"/>
  <line x1="263" y1="273" x2="560" y2="272" stroke="#111" stroke-width="2"/>
  <line x1="282" y1="325" x2="560" y2="325" stroke="#111" stroke-width="2"/>

  <!-- AED-Gerät -->
  <rect x="560" y="245" width="190" height="130" rx="14" fill="#e6e2d6" stroke="#111" stroke-width="4"/>
  <rect x="574" y="260" width="162" height="36" rx="4" fill="#faf9f6" stroke="#111" stroke-width="2"/>
  <text x="655" y="284" font-family="Georgia, serif" font-size="16" fill="#111" text-anchor="middle">Schock empfohlen</text>
  <circle cx="615" cy="335" r="20" fill="#d9c98a" stroke="#111" stroke-width="3"/>
  <line x1="635" y1="335" x2="760" y2="335" stroke="#111" stroke-width="2"/>
  <text x="766" y="340" font-family="Georgia, serif" font-size="16" fill="#111">Schocktaste</text>

  <!-- Helferin/Helfer: Hände weg vom Körper, Abstand halten.
       Wieder ein einziger Umriss: Kopf als Bogen, Arme als Strecken, die vom
       Rumpf weg- und wieder zurueckfuehren, kein Kreis mit Strichen. -->
  <path d="M 10 -43 L 22 -38 L 55 -50 L 58 -32 L 26 -14 L 20 10 L 24 34 L 20 90
           L -20 90 L -24 34 L -20 10 L -26 -14 L -58 -32 L -55 -50 L -22 -38 L -10 -43
           A 18 18 0 1 1 10 -43 Z"
        transform="translate(230,500) scale(0.7)"
        fill="#7a5a3e" stroke="#111" stroke-width="4" stroke-linejoin="round"/>

  <path d="M 10 -43 L 22 -38 L 55 -50 L 58 -32 L 26 -14 L 20 10 L 24 34 L 20 90
           L -20 90 L -24 34 L -20 10 L -26 -14 L -58 -32 L -55 -50 L -22 -38 L -10 -43
           A 18 18 0 1 1 10 -43 Z"
        transform="translate(650,150) scale(0.7)"
        fill="#7a5a3e" stroke="#111" stroke-width="4" stroke-linejoin="round"/>

  <!-- Kleine Nebenszene, die Ausnahme: kein Schock empfohlen -->
  <rect x="640" y="414" width="220" height="140" rx="10" fill="#faf9f6" stroke="#111" stroke-width="2"/>
  <text x="652" y="438" font-family="Georgia, serif" font-size="16" fill="#111">Kein Schock empfohlen:</text>
  <text x="652" y="474" font-family="Georgia, serif" font-size="16" fill="#111">sofort weiter mit der</text>
  <text x="652" y="496" font-family="Georgia, serif" font-size="16" fill="#111">Wiederbelebung.</text>
  <text x="652" y="528" font-family="Georgia, serif" font-size="16" fill="#111">Nach dem Schock</text>
  <text x="652" y="548" font-family="Georgia, serif" font-size="16" fill="#111">genauso.</text>
  <text x="40" y="608" font-family="Georgia, serif" font-size="18" fill="#111">Die Pads kommen auf den nackten Brustkorb.</text>
  <text x="40" y="632" font-family="Georgia, serif" font-size="18" fill="#111">Ist mehr als ein Helfer da, läuft die Wiederbelebung weiter, während sie aufgeklebt werden.</text>
</svg>
