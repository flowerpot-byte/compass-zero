<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580">
  <!-- Zu Tipp "nahrung-fleisch-faeulnis-erkennen" ("Verdorbenes Fleisch erkennen").

       GEZEIGTE AUSSAGE: Faeulnis in der Tiefe ist gefaehrlicher als die
       Faeulnis an der Oberflaeche, weil sie von aussen lange nicht zu sehen
       ist. Sie beginnt an bindegewebsreichen Stellen: in der Achsel, in der
       Nachbarschaft der Nieren und an den Hinterkeulen nahe dem Gelenk.
       Genau diese drei Stellen sind in Worten muehsam zu benennen, auf
       einem Koerperschema aber sofort zu finden - deshalb das Bild.

       REGEL gross: der ganze Koerperumriss mit den drei markierten,
       bindegewebsreichen Stellen, an denen die tiefe Faeulnis beginnt.

       AUSNAHME klein: der kleine Vergleich rechts (aussen unauffaellig,
       im Anschnitt veraendert) zeigt, warum diese Stellen so gefaehrlich
       sind - man sieht es eben NICHT von aussen, nur nach dem Aufschneiden.

       Die Signalfarbe steht ausschliesslich im Warnkasten unten, weil der
       Text genau diesen Satz als "gefaehrlicher" bezeichnet: Faeulnis in
       der Tiefe ist von aussen lange nicht zu sehen. Die Handlung daraus
       steht gleich mit im Kasten: dort aufschneiden und riechen. -->

  <rect width="900" height="580" fill="#faf9f6"/>

  <text x="40" y="44" font-family="Georgia, serif" font-size="26" fill="#111">Fäulnis in der Tiefe: von außen oft unsichtbar</text>
  <text x="40" y="72" font-family="Georgia, serif" font-size="17" fill="#5b7f96">Sie beginnt an bindegewebsreichen Stellen des Körpers</text>
  <line x1="40" y1="90" x2="860" y2="90" stroke="#e6e2d6" stroke-width="2"/>

  <!-- ===================== Koerperumriss mit den drei Stellen ===================== -->
  <path d="M60,240 Q75,258 95,262 L120,285 L130,295 L125,365 L125,378 L148,378 L148,310
           Q230,325 300,312 L312,308 L312,370 L312,382 L335,382 L335,320
           Q350,290 345,250 L362,235 L348,222 Q260,165 160,168 Q145,169 130,178
           Q108,188 95,205 Q80,220 60,240 Z"
        fill="#d9c98a" stroke="#111" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M85,205 L95,190 L102,208 Z" fill="#d9c98a" stroke="#111" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="88" cy="230" r="4" fill="#111"/>

  <!-- Die drei bindegewebsreichen Stellen, gestrichelt markiert -->
  <circle cx="270" cy="230" r="12" fill="none" stroke="#5b7f96" stroke-width="2" stroke-dasharray="4,3"/>
  <circle cx="135" cy="300" r="12" fill="none" stroke="#5b7f96" stroke-width="2" stroke-dasharray="4,3"/>
  <circle cx="323" cy="345" r="12" fill="none" stroke="#5b7f96" stroke-width="2" stroke-dasharray="4,3"/>

  <line x1="282" y1="230" x2="395" y2="230" stroke="#5b7f96" stroke-width="1.5"/>
  <line x1="147" y1="300" x2="395" y2="292" stroke="#5b7f96" stroke-width="1.5"/>
  <line x1="335" y1="345" x2="395" y2="352" stroke="#5b7f96" stroke-width="1.5"/>

  <text x="405" y="235" font-family="Georgia, serif" font-size="16" fill="#111">Nähe der Nieren</text>
  <text x="405" y="296" font-family="Georgia, serif" font-size="16" fill="#111">Achsel</text>
  <text x="405" y="350" font-family="Georgia, serif" font-size="16" fill="#111">Hinterkeule</text>
  <text x="405" y="370" font-family="Georgia, serif" font-size="16" fill="#111">nahe dem Gelenk</text>

  <!-- ===================== Vergleich: aussen unauffaellig vs. im Anschnitt ===================== -->
  <text x="735" y="118" font-family="Georgia, serif" font-size="17" fill="#111" text-anchor="middle">Kontrolle in der Tiefe</text>

  <circle cx="685" cy="240" r="45" fill="#e6e2d6" stroke="#111" stroke-width="2.5"/>
  <text x="628" y="316" font-family="Georgia, serif" font-size="16" fill="#111" text-anchor="middle">außen</text>

  <circle cx="785" cy="240" r="45" fill="#7a5a3e" stroke="#111" stroke-width="2.5"/>
  <path d="M770,225 L783,218 L797,227 L802,242 L793,255 L777,258 L765,247 L763,232 Z"
        fill="#d9c98a" stroke="#111" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="772" cy="248" r="4" fill="#faf9f6" stroke="#111" stroke-width="1"/>
  <circle cx="793" cy="233" r="3.5" fill="#faf9f6" stroke="#111" stroke-width="1"/>
  <text x="843" y="316" font-family="Georgia, serif" font-size="16" fill="#111" text-anchor="middle">Anschnitt</text>
  <text x="735" y="360" font-family="Georgia, serif" font-size="17" fill="#111" text-anchor="middle">außen unauffällig,</text>
  <text x="735" y="382" font-family="Georgia, serif" font-size="17" fill="#111" text-anchor="middle">im Anschnitt verdorben</text>

  <line x1="728" y1="240" x2="736" y2="240" stroke="#111" stroke-width="2"/>
  <path d="M736,240 L730,235 L730,245 Z" fill="#111"/>

  <!-- ===================== Warnkasten: der Satz, den der Text als gefaehrlicher bezeichnet ===================== -->
  <rect x="60" y="470" width="780" height="90" rx="10" fill="#faf9f6" stroke="#d65a1a" stroke-width="3"/>
  <text x="450" y="498" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#d65a1a" text-anchor="middle">Gefährlicher: Fäulnis in der Tiefe</text>
  <text x="450" y="524" font-family="Georgia, serif" font-size="18" fill="#d65a1a" text-anchor="middle">ist von außen lange nicht zu sehen.</text>
  <text x="450" y="550" font-family="Georgia, serif" font-size="18" fill="#d65a1a" text-anchor="middle">Deshalb dort aufschneiden und riechen.</text>
</svg>
