<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620">
  <!-- Zur Anleitung fischen-ohne-angel, Schritt 3 (Doppelspitze als Haken ohne
       Haken). Gezeigter Satz: Du laesst den Fisch den Koeder erst tief
       schlucken - dann stellt sich die Doppelspitze quer im Rachen. Links:
       die Doppelspitze liegt laengs im Koeder versteckt, die Spitzen
       verschwinden darin. Rechts: nach dem Schlucken steht dieselbe
       Doppelspitze gedreht quer im Rachen und verkeilt sich dort - das ist
       der entscheidende Unterschied zum normalen Haken. Unten die
       kostspielige Fehlerquelle: nicht sofort an der Schnur ziehen, sonst
       kann sich die Doppelspitze nicht querstellen. -->
  <rect width="900" height="620" fill="#faf9f6"/>

  <text x="40" y="46" font-family="Georgia, serif" font-size="26" fill="#111">Die Doppelspitze: der Haken ohne Haken</text>
  <text x="40" y="72" font-family="Georgia, serif" font-size="17" fill="#5b7f96">Der Fisch schluckt sie mit dem Köder – dann verkeilt sie sich quer im Rachen</text>

  <!-- Panel A: der geköderte Zustand, Spitzen im Köder verdeckt -->
  <rect x="40" y="104" width="380" height="340" rx="10" fill="#f2efe6" stroke="#111" stroke-width="2"/>
  <text x="230" y="134" font-family="Georgia, serif" font-size="19" fill="#111" text-anchor="middle">Geködert: Spitzen verdeckt</text>

  <!-- Schnur zur Kerbe, gerade nach oben, mit Abstand zur Überschrift -->
  <path d="M 230 258 L 230 178" stroke="#111" stroke-width="1.5" fill="none"/>
  <circle cx="230" cy="178" r="3" fill="#5b7f96"/>
  <text x="242" y="182" font-family="Georgia, serif" font-size="16" fill="#111">Schnur</text>

  <!-- Köder als Kapsel, deckt die Doppelspitze vollständig ab -->
  <rect x="130" y="245" width="200" height="60" rx="30" fill="#e8ddc7" stroke="#111" stroke-width="2.5"/>

  <!-- Doppelspitze, als verdeckte Linie (Innenansicht) unter dem Köder -->
  <g stroke="#5b7f96" stroke-width="2.5" stroke-dasharray="7,5">
    <line x1="150" y1="275" x2="310" y2="275"/>
  </g>
  <polygon points="150,275 168,266 168,284" fill="#7a5a3e" stroke="#111" stroke-width="1.5"/>
  <polygon points="310,275 292,266 292,284" fill="#7a5a3e" stroke="#111" stroke-width="1.5"/>
  <path d="M 224 269 L 230 258 L 236 269" fill="none" stroke="#111" stroke-width="2"/>

  <!-- Leader-Beschriftung Panel A, oberhalb des Köders -->
  <path d="M 152 268 L 108 232" stroke="#5b7f96" stroke-width="2" fill="none"/>
  <circle cx="152" cy="268" r="3" fill="#5b7f96"/>
  <text x="50" y="210" font-family="Georgia, serif" font-size="16" fill="#111">Beide Enden</text>
  <text x="50" y="230" font-family="Georgia, serif" font-size="16" fill="#111">angespitzt</text>

  <!-- Leader-Beschriftung Panel A, unterhalb des Köders -->
  <path d="M 230 305 L 230 330" stroke="#5b7f96" stroke-width="2" fill="none"/>
  <circle cx="230" cy="305" r="3" fill="#5b7f96"/>
  <text x="230" y="352" font-family="Georgia, serif" font-size="16" fill="#111" text-anchor="middle">Kerbe in der Mitte für die Schnur,</text>
  <text x="230" y="374" font-family="Georgia, serif" font-size="16" fill="#111" text-anchor="middle">Köder liegt längs darüber –</text>
  <text x="230" y="396" font-family="Georgia, serif" font-size="16" fill="#111" text-anchor="middle">die Spitzen verschwinden darin</text>

  <!-- Panel B: nach dem Schlucken, Doppelspitze quer im Rachen verkeilt -->
  <rect x="480" y="104" width="380" height="340" rx="10" fill="#e8eef2" stroke="#111" stroke-width="2"/>
  <text x="670" y="134" font-family="Georgia, serif" font-size="19" fill="#111" text-anchor="middle">Verschluckt: quer verkeilt</text>

  <!-- Fisch, schematisch, kein Gesicht -->
  <ellipse cx="680" cy="300" rx="140" ry="55" fill="#c9d9e2" stroke="#111" stroke-width="2.5"/>
  <polygon points="818,300 858,265 858,335" fill="#c9d9e2" stroke="#111" stroke-width="2.5"/>
  <path d="M 545 285 Q 525 300 545 315" stroke="#111" stroke-width="2" fill="none"/>

  <!-- Rachen-Kanal, gestrichelte Fuehrungslinie -->
  <path d="M 545 300 L 700 300" stroke="#5b7f96" stroke-width="2" stroke-dasharray="6,5" fill="none"/>

  <!-- Doppelspitze quer gestellt: senkrecht zum Rachen-Kanal, Spitzen an den Waenden -->
  <rect x="644" y="265" width="12" height="70" fill="#7a5a3e" stroke="#111" stroke-width="2"/>
  <polygon points="644,265 656,265 650,245" fill="#7a5a3e" stroke="#111" stroke-width="1.5"/>
  <polygon points="644,335 656,335 650,355" fill="#7a5a3e" stroke="#111" stroke-width="1.5"/>
  <path d="M 644 294 L 634 300 L 644 306" fill="none" stroke="#111" stroke-width="1.5"/>

  <!-- Schnur von der Kerbe durch den Rachen aus dem Maul -->
  <path d="M 634 300 L 545 300 L 520 255" stroke="#111" stroke-width="1.5" fill="none"/>
  <path d="M 520 255 L 494 232" stroke="#5b7f96" stroke-width="2" fill="none"/>
  <circle cx="520" cy="255" r="3" fill="#5b7f96"/>
  <text x="490" y="222" font-family="Georgia, serif" font-size="16" fill="#111">Schnur</text>

  <!-- Leader-Beschriftung zur quer stehenden Doppelspitze -->
  <path d="M 650 245 L 650 218" stroke="#5b7f96" stroke-width="2" fill="none"/>
  <circle cx="650" cy="245" r="3" fill="#5b7f96"/>
  <text x="650" y="196" font-family="Georgia, serif" font-size="16" fill="#111" text-anchor="middle">Doppelspitze steht</text>
  <text x="650" y="216" font-family="Georgia, serif" font-size="16" fill="#111" text-anchor="middle">jetzt quer im Rachen</text>

  <!-- Verbindung der beiden Panels: die Drehung beim Schlucken -->
  <path d="M 420 452 Q 450 480 480 452" stroke="#5b7f96" stroke-width="2.5" fill="none"/>
  <polygon points="480,452 468,444 468,460" fill="#5b7f96"/>
  <text x="450" y="500" font-family="Georgia, serif" font-size="16" fill="#111" text-anchor="middle">Fisch schluckt tief –</text>
  <text x="450" y="520" font-family="Georgia, serif" font-size="16" fill="#111" text-anchor="middle">Spitze dreht sich quer</text>

  <!-- Warnung: die einzige teure Fehlerquelle in diesem Schritt -->
  <rect x="40" y="540" width="820" height="60" rx="8" fill="#f2efe6" stroke="#111" stroke-width="2"/>
  <circle cx="76" cy="570" r="17" fill="none" stroke="#d65a1a" stroke-width="4"/>
  <line x1="64" y1="558" x2="88" y2="582" stroke="#d65a1a" stroke-width="4"/>
  <text x="110" y="565" font-family="Georgia, serif" font-size="18" fill="#111">Nicht sofort anschlagen:</text>
  <text x="110" y="587" font-family="Georgia, serif" font-size="16" fill="#111">Fisch muss den Köder erst tief schlucken, dann verkeilt sich die Spitze.</text>
</svg>
