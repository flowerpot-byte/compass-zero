<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620">
  <!-- Zur Anleitung "Zuenden ohne Streichhoelzer", Schritt 9: die vier Teile.
       Erste Fassung hatte drei Bilder auf einer Tafel. Am Telefon nachgesehen:
       Die Beschriftungen wurden dadurch so klein, dass man sie kaum lesen
       konnte. Jetzt steht der Aufbau allein auf einer Tafel, das Feuerbrett
       auf einer eigenen (feuerbrett.svg) bei dem Schritt, in dem es gebraucht
       wird. Jedes Bild bekommt so die volle Breite des Bildschirms. -->
  <rect width="900" height="620" fill="#faf9f6"/>
  <text x="40" y="52" font-family="Georgia, serif" font-size="30" fill="#111">Bogenbohrer: die vier Teile</text>

  <!-- Boden -->
  <line x1="150" y1="556" x2="790" y2="556" stroke="#111" stroke-width="4"/>
  <g stroke="#111" stroke-width="3" opacity="0.4">
    <line x1="170" y1="556" x2="152" y2="578"/><line x1="250" y1="556" x2="232" y2="578"/>
    <line x1="330" y1="556" x2="312" y2="578"/><line x1="410" y1="556" x2="392" y2="578"/>
    <line x1="490" y1="556" x2="472" y2="578"/><line x1="570" y1="556" x2="552" y2="578"/>
    <line x1="650" y1="556" x2="632" y2="578"/><line x1="730" y1="556" x2="712" y2="578"/>
  </g>

  <!-- Feuerbrett, flach am Boden -->
  <rect x="238" y="516" width="400" height="40" fill="#e6e2d6" stroke="#111" stroke-width="5"/>

  <!-- Fuss auf dem Brett -->
  <path d="M 274 516 L 274 470 Q 274 452 300 452 L 376 452 Q 420 452 434 488 L 440 516 Z"
        fill="#c9c4b4" stroke="#111" stroke-width="5" stroke-linejoin="round"/>

  <!-- Bohrer, senkrecht -->
  <rect x="546" y="196" width="28" height="320" fill="#e6e2d6" stroke="#111" stroke-width="5"/>

  <!-- Druckstueck oben auf dem Bohrer -->
  <path d="M 502 196 L 618 196 L 608 138 Q 560 120 512 138 Z"
        fill="#c9c4b4" stroke="#111" stroke-width="5" stroke-linejoin="round"/>

  <!-- Bogen: gekruemmter Ast -->
  <path d="M 252 386 Q 434 268 720 350" fill="none" stroke="#111" stroke-width="10" stroke-linecap="round"/>
  <!-- Sehne: einmal um den Bohrer geschlungen -->
  <path d="M 252 386 L 546 366" fill="none" stroke="#111" stroke-width="3.5"/>
  <path d="M 546 366 A 14 14 0 1 0 574 374" fill="none" stroke="#111" stroke-width="3.5"/>
  <path d="M 574 374 L 720 350" fill="none" stroke="#111" stroke-width="3.5"/>

  <!-- Bewegungspfeile: Bogen vor und zurueck -->
  <g stroke="#d65a1a" stroke-width="4" fill="none">
    <line x1="272" y1="440" x2="204" y2="440"/>
    <path d="M 204 440 l 17 -9 M 204 440 l 17 9"/>
    <line x1="690" y1="424" x2="758" y2="424"/>
    <path d="M 758 424 l -17 -9 M 758 424 l -17 9"/>
  </g>
  <text x="286" y="446" font-family="Georgia, serif" font-size="22" fill="#d65a1a">vor und zurück sägen</text>

  <!-- Druckpfeil nach unten -->
  <g stroke="#d65a1a" stroke-width="4" fill="none">
    <line x1="560" y1="86" x2="560" y2="124"/>
    <path d="M 560 124 l -9 -16 M 560 124 l 9 -16"/>
  </g>
  <text x="584" y="102" font-family="Georgia, serif" font-size="22" fill="#d65a1a">Druck von oben</text>

  <!-- Beschriftungen -->
  <g font-family="Georgia, serif" font-size="23" fill="#111">
    <line x1="498" y1="160" x2="386" y2="160" stroke="#111" stroke-width="2"/>
    <text x="182" y="168">Druckstück</text>
    <line x1="542" y1="250" x2="440" y2="250" stroke="#111" stroke-width="2"/>
    <text x="284" y="258">Bohrer</text>
    <line x1="380" y1="330" x2="290" y2="316" stroke="#111" stroke-width="2"/>
    <text x="196" y="322">Bogen</text>
    <line x1="640" y1="358" x2="716" y2="300" stroke="#111" stroke-width="2"/>
    <text x="722" y="294">Sehne</text>
    <line x1="330" y1="536" x2="200" y2="512" stroke="#111" stroke-width="2"/>
    <text x="70" y="506">Fuß hält</text>
    <line x1="620" y1="536" x2="712" y2="512" stroke="#111" stroke-width="2"/>
    <text x="718" y="506">Feuerbrett</text>
  </g>
</svg>
