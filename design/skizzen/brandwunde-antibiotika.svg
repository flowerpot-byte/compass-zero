<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1562" viewBox="0 0 900 1562">
  <!-- Zum Tipp "Brandwunde: kein Antibiotikum auf Verdacht".
       Zwei Quellen widersprechen sich offen, und beide stehen nebeneinander
       — samt Jahreszahl, denn die ist hier ein Argument: Die aeltere
       Empfehlung stammt aus einer Zeit, in der Antibiotika nachbestellbar
       waren.
       Die beiden Kreise sind der ueberpruefbare Teil und der Grund, dem
       neueren Handbuch zu folgen: Ein schmaler Rand Roetung ist NORMAL,
       eine sich ausbreitende ist es nicht. Wer das einmal nebeneinander
       gesehen hat, behandelt die normale nicht mehr.
       Die Kreise sind SCHEMATISCH und nicht massstaeblich — es gibt keinen
       Massstab im Bild, weil eine Brandwunde jede Groesse haben kann. Was
       zaehlt, ist das VERHAELTNIS von Wunde zu Saum und die Frage, ob er
       sich aendert.
       Der rote Kasten ist der einzige Fall, in dem nicht gespart wird. Er
       steht eigens, damit die Sparsamkeit oben nicht auf ihn abfaerbt. -->
  <rect width="900" height="1562" fill="#faf9f6"/>
  <text x="40" y="46" font-family="Georgia, serif" font-size="28" fill="#111">Brandwunde: kein Antibiotikum auf Verdacht</text>

  <text x="40" y="96" font-family="Georgia, serif" font-size="21" fill="#111">Hier widersprechen sich die beiden Quellen offen. Weil es um eine</text>
  <text x="40" y="122" font-family="Georgia, serif" font-size="21" fill="#111">Entscheidung geht, die man wirklich treffen muss, steht beides hier — samt</text>
  <text x="40" y="148" font-family="Georgia, serif" font-size="21" fill="#111">der Auflösung.</text>

  <line x1="40" y1="184" x2="860" y2="184" stroke="#c9c4b4" stroke-width="3"/>

  <rect x="40" y="217" width="390" height="197" rx="10" fill="none" stroke="#111" stroke-width="3"/>
  <rect x="470" y="217" width="390" height="197" rx="10" fill="#eef4ee" stroke="#1d6b3a" stroke-width="4"/>

  <text x="62" y="257" font-family="Georgia, serif" font-size="21" fill="#111">DAS ÄLTERE HANDBUCH, 1982</text>
  <text x="62" y="293" font-family="Georgia, serif" font-size="21" fill="#111">Unter 15 von hundert ver-</text>
  <text x="62" y="319" font-family="Georgia, serif" font-size="21" fill="#111">brannter Körperfläche: kein</text>
  <text x="62" y="345" font-family="Georgia, serif" font-size="21" fill="#111">Antibiotikum für den ganzen</text>
  <text x="62" y="371" font-family="Georgia, serif" font-size="21" fill="#111">Körper. DARÜBER schon —</text>
  <text x="62" y="397" font-family="Georgia, serif" font-size="21" fill="#111">feste Gabe über fünf Tage.</text>

  <text x="492" y="257" font-family="Georgia, serif" font-size="21" fill="#1d6b3a">DAS NEUERE HANDBUCH, 2001</text>
  <text x="492" y="293" font-family="Georgia, serif" font-size="21" fill="#111">KEINE vorbeugenden</text>
  <text x="492" y="319" font-family="Georgia, serif" font-size="21" fill="#111">Antibiotika — weder über die</text>
  <text x="492" y="345" font-family="Georgia, serif" font-size="21" fill="#111">Vene noch zum Schlucken.</text>
  <text x="492" y="371" font-family="Georgia, serif" font-size="21" fill="#111">Ohne Einschränkung nach</text>
  <text x="492" y="397" font-family="Georgia, serif" font-size="21" fill="#111">Fläche.</text>

  <text x="40" y="456" font-family="Georgia, serif" font-size="26" fill="#111">Dieses Paket folgt dem neueren — und nicht nur, weil es</text>
  <text x="40" y="488" font-family="Georgia, serif" font-size="26" fill="#111">neuer ist.</text>
  <text x="40" y="524" font-family="Georgia, serif" font-size="21" fill="#111">Es begründet seine Regel, und die Begründung ist überprüfbar:</text>

  <line x1="40" y1="560" x2="860" y2="560" stroke="#c9c4b4" stroke-width="3"/>

  <!-- ============ Die beiden Roetungen ============ -->
  <circle cx="220" cy="648" r="52" fill="none" stroke="#d65a1a" stroke-width="4"/>
  <circle cx="220" cy="648" r="40" fill="#f2ece2" stroke="#111" stroke-width="3"/>

  <circle cx="660" cy="648" r="86" fill="none" stroke="#a3231a" stroke-width="6"/>
  <circle cx="660" cy="648" r="68" fill="none" stroke="#a3231a" stroke-width="3"/>
  <circle cx="660" cy="648" r="40" fill="#f2ece2" stroke="#111" stroke-width="3"/>

  <text x="220" y="778" font-family="Georgia, serif" font-size="23" fill="#1d6b3a" text-anchor="middle">EIN ZENTIMETER RÖTUNG</text>
  <text x="220" y="806" font-family="Georgia, serif" font-size="23" fill="#1d6b3a" text-anchor="middle">IST NORMAL</text>
  <text x="220" y="840" font-family="Georgia, serif" font-size="21" fill="#111" text-anchor="middle">Örtliche Entzündung,</text>
  <text x="220" y="866" font-family="Georgia, serif" font-size="21" fill="#111" text-anchor="middle">keine Infektion.</text>

  <text x="660" y="778" font-family="Georgia, serif" font-size="23" fill="#a3231a" text-anchor="middle">SIE BREITET SICH AUS</text>
  <text x="660" y="812" font-family="Georgia, serif" font-size="21" fill="#111" text-anchor="middle">Dann ist es eine Wundrose —</text>
  <text x="660" y="838" font-family="Georgia, serif" font-size="21" fill="#111" text-anchor="middle">und die braucht ein Antibiotikum</text>
  <text x="660" y="864" font-family="Georgia, serif" font-size="21" fill="#111" text-anchor="middle">gegen Streptokokken.</text>

  <text x="40" y="920" font-family="Georgia, serif" font-size="21" fill="#111">Wer auf die normale Rötung hin behandelt, behandelt etwas, das keiner</text>
  <text x="40" y="946" font-family="Georgia, serif" font-size="21" fill="#111">Behandlung bedarf — und verbraucht dabei einen Vorrat, den es nicht wieder</text>
  <text x="40" y="972" font-family="Georgia, serif" font-size="21" fill="#111">gibt. Die ältere Empfehlung stammt aus einer Zeit, in der Antibiotika</text>
  <text x="40" y="998" font-family="Georgia, serif" font-size="21" fill="#111">nachbestellbar waren.</text>

  <line x1="40" y1="1034" x2="860" y2="1034" stroke="#c9c4b4" stroke-width="3"/>

  <rect x="40" y="1060" width="820" height="145" rx="10" fill="#f7ecea" stroke="#a3231a" stroke-width="4"/>
  <text x="62" y="1098" font-family="Georgia, serif" font-size="23" fill="#a3231a">Der Fall, in dem nicht gespart wird</text>
  <text x="62" y="1134" font-family="Georgia, serif" font-size="21" fill="#111">Zeichen einer Blutvergiftung, und die Brandwunde ÄNDERT FARBE UND</text>
  <text x="62" y="1160" font-family="Georgia, serif" font-size="21" fill="#111">GERUCH. Das ist lebensbedrohlich. Dafür braucht es zwei breit wirksame</text>
  <text x="62" y="1186" font-family="Georgia, serif" font-size="21" fill="#111">Mittel gleichzeitig und viel Flüssigkeit.</text>

  <line x1="40" y1="1241" x2="860" y2="1241" stroke="#c9c4b4" stroke-width="3"/>

  <text x="40" y="1281" font-family="Georgia, serif" font-size="23" fill="#1d6b3a">Was stattdessen auf die Wunde kommt</text>
  <text x="40" y="1319" font-family="Georgia, serif" font-size="21" fill="#111">Eine Brandsalbe — und wenn keine da ist, ausdrücklich auch einfachere</text>
  <text x="40" y="1345" font-family="Georgia, serif" font-size="21" fill="#111">Dinge: jede antibiotische Salbe, Jodsalbe ODER HONIG.</text>
  <text x="40" y="1381" font-family="Georgia, serif" font-size="21" fill="#111">Blasen bleiben zu, solange sie heil sind; geplatzte, sehr große oder über</text>
  <text x="40" y="1407" font-family="Georgia, serif" font-size="21" fill="#111">einem Gelenk liegende werden abgetragen. Danach abdecken, im Feld am</text>
  <text x="40" y="1433" font-family="Georgia, serif" font-size="21" fill="#111">besten mit keimfreier Gaze oder sauberem Leinen.</text>

  <line x1="40" y1="1469" x2="860" y2="1469" stroke="#c9c4b4" stroke-width="3"/>

  <text x="40" y="1509" font-family="Georgia, serif" font-size="21" fill="#111">Leicht übersehen: Ein Mensch mit großer Verbrennung braucht MEHR</text>
  <text x="40" y="1535" font-family="Georgia, serif" font-size="21" fill="#111">KALORIEN UND MEHR EIWEISS als sonst. Über 30 von hundert Fläche ist</text>
  <text x="40" y="1558" font-family="Georgia, serif" font-size="21" fill="#111">ausdrücklich eine Zusatzkost nötig, die viel von beidem hat.</text>
</svg>
