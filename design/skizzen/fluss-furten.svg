<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620">
  <!-- Zur Bauanleitung "Einen Fluss durchqueren".
       Die Anleitung hat zwoelf Schritte und bisher kein einziges Bild. Drei
       ihrer Aussagen sind RAEUMLICH und stehen als Satz genau deshalb schlecht
       da: der Winkel von 45 Grad flussabwaerts, das Einsteigen OBERHALB der
       Sandbank, und die Stange STROMAUFWAERTS vom Koerper.
       Alles hier ist Draufsicht und Geometrie: Linien, Kreise, Pfeile. Keine
       Figur, kein Gegenstand von der Seite. Die einzige Zahl im Bild ist die
       45, und die steht so im Text (Schritt 3 und Schritt 7). -->
  <rect width="900" height="620" fill="#faf9f6"/>
  <text x="30" y="42" font-family="Georgia, serif" font-size="25" fill="#111">Furten: der Winkel, die Sandbank, die Stange</text>

  <!-- ===================== LINKS: Draufsicht auf den Fluss ================ -->
  <!-- Ufer -->
  <line x1="60" y1="120" x2="60" y2="560" stroke="#111" stroke-width="4"/>
  <line x1="430" y1="120" x2="430" y2="560" stroke="#111" stroke-width="4"/>
  <rect x="60" y="120" width="370" height="440" fill="#a8c4d4" opacity="0.35"/>

  <!-- Fliessrichtung: von oben nach unten -->
  <g stroke="#5b7f96" stroke-width="3" fill="none">
    <line x1="120" y1="150" x2="120" y2="250"/>
    <path d="M112 238 L120 252 L128 238"/>
    <line x1="370" y1="150" x2="370" y2="250"/>
    <path d="M362 238 L370 252 L378 238"/>
  </g>
  <text x="140" y="205" font-family="Georgia, serif" font-size="19" fill="#5b7f96">Strömung</text>

  <!-- Sandbank am gegenueberliegenden Ufer, FLUSSABWAERTS der Einstiegsstelle -->
  <path d="M430 470 C395 476 380 492 386 512 C398 532 430 534 430 534 Z"
        fill="#e0d6bd" stroke="#a89878" stroke-width="3"/>
  <text x="196" y="498" font-family="Georgia, serif" font-size="19" fill="#111">Sandbank</text>
  <line x1="282" y1="492" x2="386" y2="498" stroke="#a89878" stroke-width="2"/>

  <!-- Die Querungslinie: 45 Grad flussabwaerts.
       Von (110|300) nach (410|500): 300 nach rechts, 200 nach unten. Damit die
       Linie WIRKLICH 45 Grad zur Stroemung hat, muessen beide gleich sein —
       also 300 und 300: von (110|260) nach (410|560). -->
  <line x1="110" y1="260" x2="410" y2="560" stroke="#d65a1a" stroke-width="5"/>
  <path d="M396 548 L412 562 L392 566" fill="none" stroke="#d65a1a" stroke-width="5"/>

  <!-- Der Winkel zwischen Stroemung und Querungslinie -->
  <line x1="110" y1="260" x2="110" y2="400" stroke="#111" stroke-width="2" stroke-dasharray="7 6"/>
  <path d="M110 330 A70 70 0 0 0 159 309" fill="none" stroke="#d65a1a" stroke-width="3"/>
  <text x="126" y="352" font-family="Georgia, serif" font-size="22" fill="#d65a1a">45°</text>

  <!-- Einstieg -->
  <circle cx="110" cy="260" r="9" fill="#111"/>
  <text x="70" y="240" font-family="Georgia, serif" font-size="19" fill="#111">Einstieg</text>

  <!-- Die Aussage, um die es geht -->
  <text x="60" y="596" font-family="Georgia, serif" font-size="19" fill="#111">Oberhalb der Sandbank einsteigen: Wer den Halt verliert, treibt genau dorthin.</text>

  <!-- ===================== RECHTS OBEN: die Stange ======================== -->
  <text x="500" y="150" font-family="Georgia, serif" font-size="21" fill="#111">Die Stange steht stromaufwärts</text>

  <!-- Stroemungsrichtung in diesem Ausschnitt: von oben -->
  <g stroke="#5b7f96" stroke-width="3" fill="none">
    <line x1="530" y1="175" x2="530" y2="225"/>
    <path d="M522 213 L530 227 L538 213"/>
  </g>
  <text x="548" y="208" font-family="Georgia, serif" font-size="17" fill="#5b7f96">Strömung</text>

  <!-- Der Mensch als Kreis in der Draufsicht — kein Gegenstand, nur Lage -->
  <circle cx="700" cy="300" r="26" fill="none" stroke="#111" stroke-width="5"/>
  <text x="736" y="307" font-family="Georgia, serif" font-size="18" fill="#111">du</text>

  <!-- Die Stange: stromaufwaerts, also oberhalb -->
  <line x1="640" y1="238" x2="760" y2="238" stroke="#8a6a3a" stroke-width="9" stroke-linecap="round"/>
  <text x="636" y="222" font-family="Georgia, serif" font-size="18" fill="#8a6a3a">Stange</text>

  <!-- Der Fuss kommt UNTERHALB der Stange auf -->
  <line x1="700" y1="266" x2="700" y2="238" stroke="#d65a1a" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="712" y="262" font-family="Georgia, serif" font-size="17" fill="#d65a1a">Fuß unterhalb</text>

  <!-- ===================== RECHTS UNTEN: zu mehreren ===================== -->
  <text x="500" y="410" font-family="Georgia, serif" font-size="21" fill="#111">Zu mehreren an einer Stange</text>

  <g stroke="#5b7f96" stroke-width="3" fill="none">
    <line x1="502" y1="435" x2="502" y2="480"/>
    <path d="M494 468 L502 482 L510 468"/>
  </g>
  <text x="518" y="465" font-family="Georgia, serif" font-size="17" fill="#5b7f96">Strömung</text>

  <!-- Eine Stange, drei Leute: der Leichteste oben, der Schwerste unten -->
  <line x1="620" y1="450" x2="620" y2="586" stroke="#8a6a3a" stroke-width="9" stroke-linecap="round"/>
  <g stroke="#111" stroke-width="3">
    <line x1="626" y1="470" x2="643" y2="470"/>
    <line x1="626" y1="518" x2="643" y2="518"/>
    <line x1="626" y1="566" x2="643" y2="566"/>
  </g>
  <circle cx="662" cy="470" r="19" fill="#faf9f6" stroke="#111" stroke-width="5"/>
  <circle cx="662" cy="518" r="19" fill="#faf9f6" stroke="#111" stroke-width="5"/>
  <circle cx="662" cy="566" r="19" fill="#faf9f6" stroke="#111" stroke-width="5"/>
  <text x="690" y="466" font-family="Georgia, serif" font-size="18" fill="#111">der Leichteste —</text>
  <text x="690" y="490" font-family="Georgia, serif" font-size="18" fill="#111">bricht die Strömung</text>
  <text x="690" y="572" font-family="Georgia, serif" font-size="18" fill="#111">der Schwerste</text>
</svg>
