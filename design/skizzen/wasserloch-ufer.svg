<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500">
  <!-- Zum Tipp "Zu viel auf einmal trinken kann toeten", zweiter Teil.
       Querschnitt.
       Der Satz der Quelle ist kurz: "ein Loch in sandigen Boden etwa einen
       Meter vom Ufer graben". Was er nicht sagt und was die Zeichnung zeigt,
       ist das Prinzip: Das Wasser laeuft nicht ueber die Erde ins Loch,
       sondern SEITLICH DURCH den Sand. Der Sand haelt den Schlamm zurueck.
       Genau deshalb muss das Loch Abstand haben – direkt am Ufer entstuende
       nur eine zweite Pfuetze desselben Wassers. -->
  <rect width="880" height="500" fill="#faf9f6"/>
  <text x="30" y="44" font-family="Georgia, serif" font-size="25" fill="#111">Wasserloch am Ufer: der Sand filtert, nicht das Loch</text>

  <!-- Erdreich -->
  <rect x="0" y="180" width="880" height="240" fill="#e6e2d6"/>
  <g stroke="#cfc9b6" stroke-width="3">
    <line x1="40" y1="230" x2="120" y2="230"/><line x1="180" y1="262" x2="260" y2="262"/>
    <line x1="380" y1="300" x2="470" y2="300"/><line x1="600" y1="250" x2="690" y2="250"/>
    <line x1="700" y1="330" x2="790" y2="330"/><line x1="240" y1="350" x2="330" y2="350"/>
  </g>

  <!-- Der schlammige Bach links -->
  <path d="M 0 180 L 250 180 L 220 300 L 0 300 Z" fill="#b9ac8e"/>
  <line x1="0" y1="180" x2="250" y2="180" stroke="#8a7f66" stroke-width="5"/>
  <text x="40" y="240" font-family="Georgia, serif" font-size="20" fill="#3d382c">schlammig</text>

  <!-- Das gegrabene Loch rechts -->
  <path d="M 430 180 L 430 340 Q 430 366 460 366 L 520 366 Q 550 366 550 340 L 550 180 Z"
        fill="#faf9f6" stroke="#111" stroke-width="5" stroke-linejoin="round"/>
  <rect x="432" y="286" width="116" height="78" fill="#c9d9e2" opacity="0.75"/>
  <line x1="432" y1="286" x2="548" y2="286" stroke="#5b7f96" stroke-width="4"/>
  <text x="576" y="300" font-family="Georgia, serif" font-size="20" fill="#111">fast klar</text>

  <!-- Bodenlinie -->
  <line x1="250" y1="180" x2="430" y2="180" stroke="#111" stroke-width="5"/>
  <line x1="550" y1="180" x2="880" y2="180" stroke="#111" stroke-width="5"/>

  <!-- Sickerpfeile DURCH den Boden -->
  <g fill="none" stroke="#d65a1a" stroke-width="4" stroke-linecap="round">
    <path d="M 246 250 C 300 262 360 274 414 286"/>
    <path d="M 414 286 l -20 -3 M 414 286 l -12 -16"/>
    <path d="M 240 300 C 300 312 360 320 414 326"/>
    <path d="M 414 326 l -20 -2 M 414 326 l -13 -15"/>
  </g>
  <text x="170" y="222" font-family="Georgia, serif" font-size="19" fill="#111">sickert SEITLICH durch den Sand</text>

  <!-- Abstandsmass -->
  <g stroke="#d65a1a" stroke-width="3">
    <line x1="250" y1="150" x2="430" y2="150"/>
    <line x1="250" y1="142" x2="250" y2="158"/>
    <line x1="430" y1="142" x2="430" y2="158"/>
  </g>
  <text x="278" y="136" font-family="Georgia, serif" font-size="20" fill="#111">etwa 1 Meter</text>

  <g font-family="Georgia, serif" font-size="19" fill="#111">
    <text x="30" y="440">Direkt am Ufer entstünde nur eine zweite Pfütze desselben Wassers.</text>
    <text x="30" y="470" fill="#d65a1a">Klar heißt nicht keimfrei — dieses Wasser muss trotzdem aufbereitet werden.</text>
  </g>
</svg>
