<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620">
  <!-- Tipp erste-hilfe-wanderroete (Wanderröte erkennen).
       Gewählte Aussage: Die Wanderröte kommt nicht sofort, sondern
       frühestens nach drei Tagen, meist nach sieben bis zehn Tagen,
       manchmal erst nach bis zu 30 Tagen - und breitet sich dann von der
       Einstichstelle aus nach außen aus, mit betontem Rand und flacher,
       nicht erhabener Mitte, bei mindestens fünf Zentimetern Durchmesser.
       Begründung: genau diese zeitliche und räumliche Entwicklung lässt
       sich in Worten schlecht fassen, in einem Bild aber sofort erkennen -
       und sie ist der Schlüssel, um die harmlose Sofortreaktion auf den
       Stich (kommt gleich, bleibt klein, wandert nicht) von der
       Wanderröte zu unterscheiden. Die Signalfarbe liegt einzig auf dem
       Satz, der die Behandlung fordert, weil der Tipp genau dort seine
       Dringlichkeit setzt. -->

  <rect x="0" y="0" width="900" height="620" fill="#faf9f6"/>

  <text x="40" y="48" font-family="Georgia, serif" font-size="26" fill="#111">Wanderröte erkennen</text>
  <text x="40" y="74" font-family="Georgia, serif" font-size="16" fill="#111">Eine Rötung gleich nach dem Stich ist meist harmlos und bleibt klein.</text>
  <text x="40" y="96" font-family="Georgia, serif" font-size="16" fill="#111">Die Wanderröte kommt erst nach Tagen — und breitet sich dann aus.</text>

  <line x1="450" y1="118" x2="450" y2="530" stroke="#5b7f96" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- ============ LINKS: Sofortreaktion (klein, Nebensache) ============ -->
  <text x="245" y="145" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#111" text-anchor="middle">Sofortreaktion auf den Stich</text>
  <text x="245" y="168" font-family="Georgia, serif" font-size="16" fill="#111" text-anchor="middle">sofort, Tag 0</text>

  <path transform="translate(173,170)" d="M55,5 C30,5 20,30 22,70 C25,130 15,190 20,230 C22,255 15,270 25,285 C35,298 55,300 70,300 L95,300 C115,298 130,285 128,265 C122,230 108,190 112,130 C115,80 120,30 100,8 C90,2 70,0 55,5 Z" fill="#e6e2d6" stroke="#111" stroke-width="2"/>

  <circle cx="248" cy="320" r="9" fill="#7a5a3e" stroke="#111" stroke-width="1.5"/>

  <text x="245" y="490" font-family="Georgia, serif" font-size="16" fill="#111" text-anchor="middle">kommt gleich, bleibt klein</text>
  <text x="245" y="512" font-family="Georgia, serif" font-size="16" fill="#111" text-anchor="middle">wandert nicht</text>

  <!-- ============ RECHTS: Wanderröte (gross, Hauptsache) ============ -->
  <text x="655" y="145" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#111" text-anchor="middle">Wanderröte</text>
  <text x="655" y="166" font-family="Georgia, serif" font-size="15" fill="#111" text-anchor="middle">frühestens Tag 3, meist Tag 7–10, spätestens Tag 30</text>

  <path transform="translate(583,170)" d="M55,5 C30,5 20,30 22,70 C25,130 15,190 20,230 C22,255 15,270 25,285 C35,298 55,300 70,300 L95,300 C115,298 130,285 128,265 C122,230 108,190 112,130 C115,80 120,30 100,8 C90,2 70,0 55,5 Z" fill="#e6e2d6" stroke="#111" stroke-width="2"/>

  <circle cx="655" cy="320" r="48" fill="#d9c98a" stroke="#111" stroke-width="2.5"/>
  <circle cx="655" cy="320" r="30" fill="#e6e2d6" stroke="#111" stroke-width="1.5"/>
  <circle cx="655" cy="320" r="4" fill="#111"/>

  <!-- Pfeil: breitet sich weiter aus -->
  <line x1="697" y1="296" x2="716" y2="285" stroke="#111" stroke-width="1.5"/>
  <path d="M716,285 L711,292 L707,286 Z" fill="#111"/>
  <text x="723" y="289" font-family="Georgia, serif" font-size="16" fill="#111" text-anchor="start">breitet sich aus</text>

  <!-- Mass: mindestens 5 cm -->
  <line x1="703" y1="320" x2="723" y2="320" stroke="#5b7f96" stroke-width="1.2"/>
  <text x="726" y="325" font-family="Georgia, serif" font-size="16" fill="#111" text-anchor="start">mindestens 5 cm</text>

  <!-- Rand und Mitte -->
  <line x1="618" y1="307" x2="585" y2="300" stroke="#5b7f96" stroke-width="1.2"/>
  <text x="470" y="302" font-family="Georgia, serif" font-size="16" fill="#111" text-anchor="start">Rand betont</text>
  <line x1="625" y1="320" x2="585" y2="322" stroke="#5b7f96" stroke-width="1.2"/>
  <text x="470" y="328" font-family="Georgia, serif" font-size="16" fill="#111" text-anchor="start">Mitte: Stich</text>

  <!-- ============ Handlung ============ -->
  <text x="40" y="565" font-family="Georgia, serif" font-size="19" fill="#d65a1a">Ist das Bild typisch, braucht es keine Laboruntersuchung —</text>
  <text x="40" y="589" font-family="Georgia, serif" font-size="19" fill="#d65a1a">die Behandlung soll dann sofort beginnen.</text>
</svg>
