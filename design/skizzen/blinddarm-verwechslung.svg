<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1650" viewBox="0 0 900 1650">
  <!-- Zum Tipp "Bauchschmerz rechts unten: was sonst dahinterstecken kann".
       Das eine, was man ohne Geraete pruefen kann, ist die REIHENFOLGE, und
       sie steht deshalb oben als Bild: zwei Zeitachsen untereinander, dieselben
       zwei Kaesten in vertauschter Folge. Im Fliesstext ist das ein Nebensatz
       ("beim Blinddarm ist es umgekehrt"), und Umkehrungen behaelt man aus
       Nebensaetzen nicht.
       Die uebrigen Kandidaten stehen als Tabelle, weil jeder genau EIN
       Erkennungsmerkmal hat und man nur dieses eine sucht.
       Der Kasten in der Mitte gilt einer einzigen Krankheit aus der
       Frauen-Gruppe, weil sie die einzige ist, die schnell toetet. Die Frage
       nach der letzten Blutung kostet nichts und trennt sie ab.
       Der Kasten unten sagt, wozu die Liste dient, und das ist nicht
       selbstverstaendlich: Sie stellt keine Diagnose — sie verhindert
       Voreiligkeit. Ohne diesen Satz liest man sie als Bestimmungsschluessel
       und traut sich dann eine Sicherheit zu, die es nicht gibt. -->
  <rect width="900" height="1650" fill="#faf9f6"/>
  <text x="40" y="46" font-family="Georgia, serif" font-size="28" fill="#111">Bauchschmerz rechts unten: was sonst dahinterstecken kann</text>

  <text x="40" y="96" font-family="Georgia, serif" font-size="21" fill="#111">Nicht jeder Schmerz im rechten Unterbauch ist der Blinddarm. Einige der</text>
  <text x="40" y="122" font-family="Georgia, serif" font-size="21" fill="#111">Krankheiten, die ihm ähneln, lassen sich ohne Geräte auseinanderhalten.</text>

  <line x1="40" y1="158" x2="860" y2="158" stroke="#c9c4b4" stroke-width="3"/>

  <!-- ============ Die Reihenfolge ============ -->
  <text x="40" y="198" font-family="Georgia, serif" font-size="23" fill="#1d6b3a">Das eine, was man ohne Geräte prüfen kann: die Reihenfolge</text>

  <text x="40" y="256" font-family="Georgia, serif" font-size="21" fill="#111">BLINDDARM</text>
  <rect x="280" y="228" width="200" height="44" rx="8" fill="#f2ece2" stroke="#111" stroke-width="3"/>
  <text x="380" y="257" font-family="Georgia, serif" font-size="21" fill="#111" text-anchor="middle">SCHMERZ</text>
  <line x1="486" y1="250" x2="516" y2="250" stroke="#111" stroke-width="3"/>
  <polygon points="516,242 534,250 516,258" fill="#111"/>
  <rect x="540" y="228" width="200" height="44" rx="8" fill="#faf9f6" stroke="#111" stroke-width="3"/>
  <text x="640" y="257" font-family="Georgia, serif" font-size="21" fill="#111" text-anchor="middle">Erbrechen</text>

  <text x="40" y="336" font-family="Georgia, serif" font-size="21" fill="#111">MAGEN-DARM-</text>
  <text x="40" y="362" font-family="Georgia, serif" font-size="21" fill="#111">INFEKT</text>
  <rect x="280" y="308" width="200" height="44" rx="8" fill="#f2ece2" stroke="#111" stroke-width="3"/>
  <text x="380" y="337" font-family="Georgia, serif" font-size="21" fill="#111" text-anchor="middle">ERBRECHEN</text>
  <line x1="486" y1="330" x2="516" y2="330" stroke="#111" stroke-width="3"/>
  <polygon points="516,322 534,330 516,338" fill="#111"/>
  <rect x="540" y="308" width="200" height="44" rx="8" fill="#faf9f6" stroke="#111" stroke-width="3"/>
  <text x="640" y="337" font-family="Georgia, serif" font-size="21" fill="#111" text-anchor="middle">Schmerz</text>

  <text x="40" y="412" font-family="Georgia, serif" font-size="21" fill="#111">Beim Blinddarm kommt der Schmerz zuerst und das Erbrechen danach. Beim</text>
  <text x="40" y="438" font-family="Georgia, serif" font-size="21" fill="#111">Magen-Darm-Infekt ist es umgekehrt — und es besteht Durchfall statt des</text>
  <text x="40" y="464" font-family="Georgia, serif" font-size="21" fill="#111">Gefühls, es sei etwas gestaut.</text>

  <line x1="40" y1="500" x2="860" y2="500" stroke="#c9c4b4" stroke-width="3"/>

  <!-- ============ Die anderen Kandidaten ============ -->
  <text x="40" y="540" font-family="Georgia, serif" font-size="23" fill="#1d6b3a">Was sonst dahinterstecken kann</text>

  <text x="40" y="578" font-family="Georgia, serif" font-size="21" fill="#111">Harnleiterkolik oder</text>
  <text x="40" y="604" font-family="Georgia, serif" font-size="21" fill="#111">Nierenbeckenentzündung</text>
  <text x="380" y="578" font-family="Georgia, serif" font-size="21" fill="#111">krampfartiger Schmerz in Wellen, dazu</text>
  <text x="380" y="604" font-family="Georgia, serif" font-size="21" fill="#111">Brennen beim Wasserlassen</text>

  <text x="40" y="644" font-family="Georgia, serif" font-size="21" fill="#111">Lebensmittel-</text>
  <text x="40" y="670" font-family="Georgia, serif" font-size="21" fill="#111">vergiftung</text>
  <text x="380" y="644" font-family="Georgia, serif" font-size="21" fill="#111">mehrere Menschen haben dasselbe</text>
  <text x="380" y="670" font-family="Georgia, serif" font-size="21" fill="#111">gegessen, dazu Erbrechen und Durchfall</text>

  <text x="40" y="710" font-family="Georgia, serif" font-size="21" fill="#111">Verstopfung</text>
  <text x="380" y="710" font-family="Georgia, serif" font-size="21" fill="#111">der Schmerz sitzt eher LINKS unten</text>

  <line x1="40" y1="746" x2="860" y2="746" stroke="#c9c4b4" stroke-width="3"/>

  <!-- ============ Bei Frauen ============ -->
  <text x="40" y="786" font-family="Georgia, serif" font-size="23" fill="#a3231a">Bei Frauen kommt eine eigene Gruppe dazu</text>
  <text x="40" y="824" font-family="Georgia, serif" font-size="21" fill="#111">Eierstockzyste · Mittelschmerz — eine Blutung aus dem gesprungenen</text>
  <text x="40" y="850" font-family="Georgia, serif" font-size="21" fill="#111">Eibläschen etwa in der Mitte des Zyklus · Entzündungen im Becken ·</text>
  <text x="40" y="876" font-family="Georgia, serif" font-size="21" fill="#111">und die Schwangerschaft außerhalb der Gebärmutter.</text>

  <rect x="40" y="910" width="820" height="122" rx="10" fill="#f7ecea" stroke="#a3231a" stroke-width="4"/>
  <text x="62" y="950" font-family="Georgia, serif" font-size="26" fill="#a3231a">Die letzte ist die gefährliche: Sie kann innerlich stark bluten.</text>
  <text x="62" y="986" font-family="Georgia, serif" font-size="21" fill="#111">Bei einer Frau im gebärfähigen Alter mit plötzlichem einseitigem</text>
  <text x="62" y="1012" font-family="Georgia, serif" font-size="21" fill="#111">Unterbauchschmerz gehört die Frage nach der letzten Blutung immer dazu.</text>

  <line x1="40" y1="1068" x2="860" y2="1068" stroke="#c9c4b4" stroke-width="3"/>

  <text x="40" y="1108" font-family="Georgia, serif" font-size="23" fill="#1d6b3a">Selten hier, anderswo nicht</text>
  <text x="40" y="1146" font-family="Georgia, serif" font-size="21" fill="#111">· Typhus: Schmerz rechts unten mit Kopfschmerz, Abgeschlagenheit und</text>
  <text x="40" y="1172" font-family="Georgia, serif" font-size="21" fill="#111">  Ausschlag</text>
  <text x="40" y="1198" font-family="Georgia, serif" font-size="21" fill="#111">· Malaria: Fieber, Schüttelfrost und Erbrechen bei jemandem, der in einem</text>
  <text x="40" y="1224" font-family="Georgia, serif" font-size="21" fill="#111">  Malariagebiet war</text>
  <text x="40" y="1250" font-family="Georgia, serif" font-size="21" fill="#111">· Wurmbefall: kann einen Darmverschluss auslösen</text>
  <text x="40" y="1288" font-family="Georgia, serif" font-size="21" fill="#111">Wer aus solchen Gegenden kommt oder dort war, sollte das mitbedenken.</text>

  <line x1="40" y1="1324" x2="860" y2="1324" stroke="#c9c4b4" stroke-width="3"/>

  <rect x="40" y="1350" width="820" height="154" rx="10" fill="#eef4ee" stroke="#1d6b3a" stroke-width="4"/>
  <text x="62" y="1390" font-family="Georgia, serif" font-size="26" fill="#1d6b3a">Diese Liste stellt keine Diagnose.</text>
  <text x="62" y="1422" font-family="Georgia, serif" font-size="26" fill="#1d6b3a">Sie verhindert Voreiligkeit.</text>
  <text x="62" y="1458" font-family="Georgia, serif" font-size="21" fill="#111">Wer weiß, dass Erbrechen VOR dem Schmerz eher für einen Magen-Darm-Infekt</text>
  <text x="62" y="1484" font-family="Georgia, serif" font-size="21" fill="#111">spricht, wartet die entscheidenden Stunden ab, statt in Panik zu geraten.</text>

  <text x="40" y="1546" font-family="Georgia, serif" font-size="23" fill="#a3231a">Und umgekehrt: Wandert der Schmerz in den rechten Unterbauch</text>
  <text x="40" y="1574" font-family="Georgia, serif" font-size="23" fill="#a3231a">und bleibt dort, während der Appetit weg ist, dann ist es</text>
  <text x="40" y="1602" font-family="Georgia, serif" font-size="23" fill="#a3231a">wahrscheinlich doch der Blinddarm.</text>
  <text x="40" y="1638" font-family="Georgia, serif" font-size="19" fill="#111">(Einordnung dieses Pakets, nicht aus der Quelle.)</text>
</svg>
