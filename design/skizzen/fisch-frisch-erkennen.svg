<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580">
  <!-- Zu Tipp "nahrung-fisch-frisch-erkennen" ("Fisch: frisch oder verdorben").
       Gezeigte Aussage: Kiemen, Haut, Augen und Geruch unterscheiden im Text
       frischen von verdorbenem Fisch, und diese Zeichnung zeigt den
       Unterschied als Form und Fuellung, nicht nur als Beschriftung.
       Links: einzeln stehende, helle Kiemenfaeden mit Zwischenraum
       (feucht, getrennt) und Haut mit Lichtstreifen (glaenzend). Rechts:
       eine einzige dunkle, zusammenhaengende Kiemenmasse ohne
       Zwischenraum (verklebt) und Haut ohne Lichtstreifen, matt und
       heller gefuellt (blass), dazu Geruchslinien ueber dem Kopf fuer den
       unangenehmen Fischgeruch.
       Die Augen tragen nur auf der frischen Seite einen Glanzpunkt, weil
       der Text fuer verdorbenen Fisch keine Aussage zu den Augen macht
       und hier nichts erfunden werden soll.
       Klein und in der Signalfarbe steht unten die scharfe Grenze aus dem
       Text: saeuerlich oder tranig-faulig riechender Fisch wird in keinem
       Fall mehr gegessen. Nur dort ist ein Irrtum gefaehrlich, deshalb nur
       dort die Signalfarbe. -->
  <rect width="900" height="580" fill="#faf9f6"/>

  <text x="40" y="44" font-family="Georgia, serif" font-size="26" fill="#111">Fisch: frisch oder verdorben?</text>
  <text x="40" y="76" font-family="Georgia, serif" font-size="19" fill="#111">Vier Merkmale sprechen für frischen Fisch</text>

  <line x1="40" y1="96" x2="860" y2="96" stroke="#5b7f96" stroke-width="2"/>
  <line x1="450" y1="110" x2="450" y2="455" stroke="#5b7f96" stroke-width="2"/>

  <text x="235" y="132" font-family="Georgia, serif" font-size="22" fill="#111" text-anchor="middle">FRISCH</text>
  <text x="665" y="132" font-family="Georgia, serif" font-size="22" fill="#111" text-anchor="middle">VERDORBEN</text>
  <text x="665" y="154" font-family="Georgia, serif" font-size="16" fill="#111" text-anchor="middle">zu warm oder zu lange gelegen</text>

  <!-- Fisch links: frisch -->
  <g transform="translate(235,280)">
    <path d="M -110,0 C -102,-40 -70,-52 -40,-50 L -25,-72 L -5,-52
             C 20,-50 55,-42 92,-10 L 128,-34 L 116,0 L 128,34 L 92,10
             C 55,42 20,50 -5,52 L -25,72 L -40,50
             C -70,52 -102,40 -110,0 Z"
          fill="#d9c98a" stroke="#111" stroke-width="3" stroke-linejoin="round"/>

    <!-- Lichtstreifen: glaenzende Haut -->
    <path d="M -22,-38 Q 8,-46 38,-36 Q 8,-40 -22,-30 Z" fill="#faf9f6"/>

    <!-- vier getrennte, helle Kiemenfaeden: feucht -->
    <ellipse cx="-90" cy="-24" rx="7" ry="10" fill="#faf9f6" stroke="#111" stroke-width="2"/>
    <ellipse cx="-90" cy="-8" rx="7" ry="10" fill="#faf9f6" stroke="#111" stroke-width="2"/>
    <ellipse cx="-90" cy="8" rx="7" ry="10" fill="#faf9f6" stroke="#111" stroke-width="2"/>
    <ellipse cx="-90" cy="24" rx="7" ry="10" fill="#faf9f6" stroke="#111" stroke-width="2"/>

    <!-- Auge mit Glanzpunkt: klare Augen -->
    <circle cx="-68" cy="-10" r="9" fill="#e6e2d6" stroke="#111" stroke-width="2"/>
    <circle cx="-68" cy="-10" r="4" fill="#111"/>
    <circle cx="-71" cy="-13" r="1.8" fill="#faf9f6"/>
  </g>

  <text x="235" y="378" font-family="Georgia, serif" font-size="17" fill="#111" text-anchor="middle">feuchte, hellrote Kiemen</text>
  <text x="235" y="400" font-family="Georgia, serif" font-size="17" fill="#111" text-anchor="middle">glänzende Haut</text>
  <text x="235" y="422" font-family="Georgia, serif" font-size="17" fill="#111" text-anchor="middle">klare Augen</text>
  <text x="235" y="444" font-family="Georgia, serif" font-size="17" fill="#111" text-anchor="middle">neutraler Geruch</text>

  <!-- Fisch rechts: verdorben -->
  <g transform="translate(665,280)">
    <path d="M -110,0 C -102,-40 -70,-52 -40,-50 L -25,-72 L -5,-52
             C 20,-50 55,-42 92,-10 L 128,-34 L 116,0 L 128,34 L 92,10
             C 55,42 20,50 -5,52 L -25,72 L -40,50
             C -70,52 -102,40 -110,0 Z"
          fill="#e6e2d6" stroke="#111" stroke-width="3" stroke-linejoin="round"/>

    <!-- eine zusammenhaengende, dunkle Kiemenmasse: verklebt, ohne Zwischenraum -->
    <path d="M -101,-27 C -110,-10 -110,10 -101,27 C -92,31 -79,29 -75,20
             C -69,10 -69,-10 -75,-20 C -79,-29 -92,-31 -101,-27 Z"
          fill="#7a5a3e" stroke="#111" stroke-width="2" stroke-linejoin="round"/>

    <!-- Auge ohne Glanzpunkt: der Text nennt fuer verdorbenen Fisch keine Augenfarbe -->
    <circle cx="-68" cy="-10" r="9" fill="#c9c4b4" stroke="#111" stroke-width="2"/>
    <circle cx="-68" cy="-10" r="4" fill="#7a5a3e" opacity="0.5"/>

    <!-- Geruchslinien: unangenehmer Fischgeruch -->
    <path d="M -97,-58 Q -102,-70 -97,-82 Q -92,-94 -97,-106" fill="none" stroke="#5b7f96" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M -80,-58 Q -85,-68 -80,-78 Q -75,-88 -80,-98" fill="none" stroke="#5b7f96" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M -63,-58 Q -68,-67 -63,-76 Q -58,-85 -63,-94" fill="none" stroke="#5b7f96" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <text x="665" y="378" font-family="Georgia, serif" font-size="17" fill="#111" text-anchor="middle">verklebte Kiemen</text>
  <text x="665" y="400" font-family="Georgia, serif" font-size="17" fill="#111" text-anchor="middle">blasse Haut</text>
  <text x="665" y="422" font-family="Georgia, serif" font-size="17" fill="#111" text-anchor="middle">unangenehmer Fischgeruch</text>

  <rect x="150" y="480" width="600" height="75" rx="10" fill="#faf9f6" stroke="#d65a1a" stroke-width="3"/>
  <text x="450" y="510" font-family="Georgia, serif" font-size="18" fill="#d65a1a" text-anchor="middle">Riecht er säuerlich oder tranig-faulig:</text>
  <text x="450" y="536" font-family="Georgia, serif" font-size="18" fill="#d65a1a" text-anchor="middle">wird er auf keinen Fall mehr gegessen.</text>
</svg>
