<svg xmlns="http://www.w3.org/2000/svg" width="900" height="770" viewBox="0 0 900 770">
  <!-- Zum Tipp taktisch-notgepaeck (Notgepaeck: zwanzig Dinge, und eine Mappe).
       Aussage: der Text nennt zwanzig Dinge fuer das Notgepaeck, aber genau
       drei davon hebt er selbst als "fast immer vergessen" hervor - Ersatz
       fuer Brille oder Hoergeraet, Arbeitshandschuhe, Bargeld. Und die Mappe
       mit den Dokumenten bekommt im Text eine eigene Ordnung nach sieben
       Zwecken: Identitaet, Besitz, Anspruech, Qualifikationen, Rechte,
       Angaben, Emotional. Das Bild zeigt nur diese vom Text selbst
       hervorgehobene Auswahl, nicht alle zwanzig Dinge einzeln.
       Begruendung: zwanzig Woerter nebeneinander waeren nur eine Abschrift
       der Liste und ohne eigene Aussage. Die drei vergessenen Gegenstaende
       und die Mappen-Ordnung sind die Stellen, an denen der Text selbst am
       staerksten betont (Grossbuchstaben im Original) - genau die zeigt das
       Bild, mit einem klaren Hinweis, dass es eine Auswahl ist. Die
       Signalfarbe markiert einzig den Satz "DREI DAVON WERDEN FAST IMMER
       VERGESSEN", die staerkste Einzelaussage im Text. -->

  <defs>
    <path id="dokBasis" d="M -35,-45 L 20,-45 L 35,-30 L 35,45 L -35,45 Z"/>
    <path id="dokFalz" d="M 20,-45 L 35,-30 L 20,-30 Z"/>
  </defs>

  <rect x="0" y="0" width="900" height="770" fill="#faf9f6"/>

  <text x="40" y="42" font-family="Georgia, serif" font-size="26" fill="#111">Notgepäck: eine Auswahl</text>
  <text x="40" y="68" font-family="Georgia, serif" font-size="16" fill="#111">Der Text nennt zwanzig Dinge — gezeigt ist nur, was er selbst hervorhebt.</text>

  <line x1="40" y1="86" x2="860" y2="86" stroke="#5b7f96" stroke-width="1.5"/>

  <!-- ============ oben: die drei fast immer vergessenen Dinge ============ -->
  <!-- Die Signalfarbe steht einzig hier, am Satz "DREI DAVON WERDEN FAST
       IMMER VERGESSEN" - der staerksten Betonung im Text. -->
  <rect x="46" y="98" width="10" height="20" rx="5" fill="#d65a1a"/>
  <circle cx="51" cy="124" r="6" fill="#d65a1a"/>
  <text x="70" y="122" font-family="Georgia, serif" font-size="20" fill="#111">Diese drei werden fast immer vergessen</text>

  <!-- Ersatz: Brille, Hörgerät -->
  <g transform="translate(140,215)">
    <path d="M -66,-28 L -34,-28 Q -22,-28 -22,-16 L -22,16 Q -22,28 -34,28 L -66,28 Q -78,28 -78,16 L -78,-16 Q -78,-28 -66,-28 Z
             M 34,-28 L 66,-28 Q 78,-28 78,-16 L 78,16 Q 78,28 66,28 L 34,28 Q 22,28 22,16 L 22,-16 Q 22,-28 34,-28 Z
             M -18,-8 L 18,-8 Q 22,-8 22,-4 L 22,4 Q 22,8 18,8 L -18,8 Q -22,8 -22,4 L -22,-4 Q -22,-8 -18,-8 Z"
          fill="#e6e2d6" stroke="#111" stroke-width="3"/>
  </g>
  <g transform="translate(270,215)">
    <rect x="-15" y="-7" width="30" height="14" rx="7" fill="#d9c98a" stroke="#111" stroke-width="2.5"/>
  </g>
  <text x="175" y="305" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#111">Ersatz: Brille, Hörgerät</text>

  <!-- Arbeitshandschuhe -->
  <g transform="translate(480,205)">
    <path d="M -13,-55 L 13,-55 Q 38,-55 38,-30 L 38,35 Q 38,60 13,60 L -13,60 Q -38,60 -38,35 L -38,-30 Q -38,-55 -13,-55 Z
             M 45,-15 L 50,-15 Q 65,-15 65,0 L 65,15 Q 65,30 50,30 L 45,30 Q 30,30 30,15 L 30,0 Q 30,-15 45,-15 Z"
          fill="#d9c98a" stroke="#111" stroke-width="3"/>
  </g>
  <text x="480" y="305" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#111">Arbeitshandschuhe</text>

  <!-- Bargeld -->
  <g transform="translate(740,215)">
    <rect x="-55" y="-25" width="110" height="55" rx="8" fill="#d9c98a" stroke="#111" stroke-width="3"/>
    <circle cx="-15" cy="2" r="10" fill="none" stroke="#111" stroke-width="1.3"/>
    <circle cx="45" cy="25" r="20" fill="#e6e2d6" stroke="#111" stroke-width="3"/>
  </g>
  <text x="740" y="305" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#111">Bargeld</text>

  <line x1="40" y1="332" x2="860" y2="332" stroke="#5b7f96" stroke-width="1.5"/>

  <!-- ============ unten: die Mappe, geordnet nach Zweck ============ -->
  <g transform="translate(40,346)">
    <path d="M 0,4 L 0,-4 L 10,-4 L 14,0 L 26,0 L 26,16 Q 26,20 22,20 L 4,20 Q 0,20 0,16 Z"
          fill="#d9c98a" stroke="#111" stroke-width="2"/>
  </g>
  <text x="76" y="366" font-family="Georgia, serif" font-size="20" fill="#111">Die Mappe: Dokumente geordnet nach Zweck</text>

  <rect x="40" y="380" width="820" height="326" rx="16" fill="none" stroke="#5b7f96" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Reihe A: Identität, Besitz, Ansprüche, Qualifikationen -->
  <g transform="translate(145,436)">
    <use href="#dokBasis" fill="#e6e2d6" stroke="#111" stroke-width="3"/>
    <use href="#dokFalz" fill="#d9c98a" stroke="#111" stroke-width="1.5"/>
    <rect x="-12" y="-8" width="24" height="16" rx="3" fill="#7a5a3e" stroke="#111" stroke-width="1.5"/>
    <circle cx="-4" cy="0" r="3.5" fill="#e6e2d6" stroke="#111" stroke-width="1"/>
  </g>
  <text x="145" y="510" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#111">Identität</text>

  <g transform="translate(350,436)">
    <use href="#dokBasis" fill="#e6e2d6" stroke="#111" stroke-width="3"/>
    <use href="#dokFalz" fill="#d9c98a" stroke="#111" stroke-width="1.5"/>
    <path d="M -11,10 L -11,-3 L 0,-14 L 11,-3 L 11,10 Z" fill="#7a5a3e" stroke="#111" stroke-width="1.5"/>
  </g>
  <text x="350" y="510" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#111">Besitz</text>

  <g transform="translate(555,436)">
    <use href="#dokBasis" fill="#e6e2d6" stroke="#111" stroke-width="3"/>
    <use href="#dokFalz" fill="#d9c98a" stroke="#111" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="11" fill="#d9c98a" stroke="#111" stroke-width="1.5"/>
  </g>
  <text x="555" y="510" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#111">Ansprüche</text>

  <g transform="translate(760,436)">
    <use href="#dokBasis" fill="#e6e2d6" stroke="#111" stroke-width="3"/>
    <use href="#dokFalz" fill="#d9c98a" stroke="#111" stroke-width="1.5"/>
    <circle cx="0" cy="-6" r="7" fill="#d9c98a" stroke="#111" stroke-width="1.5"/>
    <path d="M -5,0 L 0,-3 L 5,0 L 3,13 L 0,7 L -3,13 Z" fill="#7a5a3e" stroke="#111" stroke-width="1.2"/>
  </g>
  <text x="760" y="510" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#111">Qualifikationen</text>

  <!-- Reihe B: Rechte, Angaben, Emotional -->
  <g transform="translate(180,590)">
    <use href="#dokBasis" fill="#e6e2d6" stroke="#111" stroke-width="3"/>
    <use href="#dokFalz" fill="#d9c98a" stroke="#111" stroke-width="1.5"/>
    <rect x="-14" y="-4" width="28" height="8" rx="4" fill="#d9c98a" stroke="#111" stroke-width="1.5"/>
    <circle cx="-14" cy="0" r="4" fill="#7a5a3e" stroke="#111" stroke-width="1"/>
    <circle cx="14" cy="0" r="4" fill="#7a5a3e" stroke="#111" stroke-width="1"/>
    <circle cx="0" cy="10" r="5" fill="#7a5a3e" stroke="#111" stroke-width="1.5"/>
  </g>
  <text x="180" y="664" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#111">Rechte</text>

  <g transform="translate(450,590)">
    <use href="#dokBasis" fill="#e6e2d6" stroke="#111" stroke-width="3"/>
    <use href="#dokFalz" fill="#d9c98a" stroke="#111" stroke-width="1.5"/>
    <rect x="-11" y="-9" width="22" height="18" rx="2" fill="#e6e2d6" stroke="#111" stroke-width="1.5"/>
  </g>
  <text x="450" y="664" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#111">Angaben</text>

  <g transform="translate(720,590)">
    <use href="#dokBasis" fill="#e6e2d6" stroke="#111" stroke-width="3"/>
    <use href="#dokFalz" fill="#d9c98a" stroke="#111" stroke-width="1.5"/>
    <rect x="-12" y="-9" width="20" height="16" rx="2" transform="rotate(-10)" fill="#e6e2d6" stroke="#111" stroke-width="1.3"/>
    <rect x="-10" y="-8" width="20" height="16" rx="2" transform="rotate(6)" fill="#e6e2d6" stroke="#111" stroke-width="1.3"/>
    <rect x="-10" y="-8" width="20" height="16" rx="2" fill="#faf9f6" stroke="#111" stroke-width="1.5"/>
  </g>
  <text x="720" y="664" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#111">Emotional</text>
  <text x="145" y="530" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#5b7f96">Ausweis, Geburtsurkunde</text>
  <text x="350" y="530" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#5b7f96">Kaufverträge</text>
  <text x="555" y="530" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#5b7f96">Versicherungen</text>
  <text x="760" y="530" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#5b7f96">Zeugnisse</text>
  <text x="180" y="684" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#5b7f96">Vollmachten</text>
  <text x="450" y="684" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#5b7f96">Impfausweis, Befunde</text>
  <text x="720" y="684" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#5b7f96">Bilder</text>
  <text x="40" y="740" font-family="Georgia, serif" font-size="17" fill="#111">Die Mappe gehört in einen feuerfesten oder wasserdichten Behälter — bei Brand oder</text>
  <text x="40" y="762" font-family="Georgia, serif" font-size="17" fill="#111">Hochwasser braucht man sie danach am dringendsten.</text>
</svg>
