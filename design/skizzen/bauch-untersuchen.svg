<svg xmlns="http://www.w3.org/2000/svg" width="900" height="860" viewBox="0 0 900 860">
  <!-- Zum Tipp "Bauchfellentzuendung: wenn der Bauch bretthart wird".
       Der Bildkern ist die REIHENFOLGE der Untersuchung, die in der Quelle
       ausdruecklich feststeht: erst hoeren, dann klopfen, dann tasten. Wer
       zuerst drueckt, veraendert die Darmgeraeusche und kann danach nichts
       mehr beurteilen. Das ist ein Fehler, den man genau einmal macht und
       danach nicht mehr rueckgaengig machen kann — also gehoert er ins Bild.
       Dazu die vier Viertel, in denen gelauscht wird, und der schonendere
       Handgriff: das Becken leicht ruetteln statt zu druecken.
       WICHTIG und deshalb ausdruecklich im Bild: Dieses Ruetteln gilt fuer den
       Bauch. Bei Verdacht auf einen BECKENBRUCH wird nie gerueettelt — dort
       kann es eine Blutung wieder in Gang setzen. Ohne diesen Satz koennte
       jemand die beiden Zeichnungen verwechseln. -->
  <rect width="900" height="860" fill="#faf9f6"/>
  <text x="40" y="46" font-family="Georgia, serif" font-size="28" fill="#111">Den Bauch untersuchen: erst hören, dann klopfen, dann tasten</text>

  <!-- ============ A: die Reihenfolge ============ -->
  <text x="40" y="96" font-family="Georgia, serif" font-size="23" fill="#1d6b3a">Die vier Viertel</text>

  <!-- Rumpf mit Vierteln -->
  <path d="M 130 130 L 288 130 C 300 180 302 214 294 254 C 288 296 282 326 274 350
           L 144 350 C 136 326 130 296 124 254 C 116 214 118 180 130 130 Z"
        fill="#f2ece2" stroke="#111" stroke-width="4"/>
  <line x1="209" y1="130" x2="209" y2="350" stroke="#111" stroke-width="3" stroke-dasharray="8 6"/>
  <line x1="120" y1="240" x2="298" y2="240" stroke="#111" stroke-width="3" stroke-dasharray="8 6"/>
  <circle cx="209" cy="240" r="7" fill="none" stroke="#111" stroke-width="4"/>
  <!-- Ohr -->
  <path d="M 336 196 c -18 0 -30 14 -30 30 c 0 18 12 26 12 40" fill="none" stroke="#d65a1a" stroke-width="5"/>
  <path d="M 322 214 c 8 -6 16 0 14 10" fill="none" stroke="#d65a1a" stroke-width="4"/>
  <line x1="304" y1="228" x2="270" y2="212" stroke="#d65a1a" stroke-width="2"/>
  <text x="308" y="304" font-family="Georgia, serif" font-size="21" fill="#d65a1a">Ohr auf</text>
  <text x="308" y="330" font-family="Georgia, serif" font-size="21" fill="#d65a1a">den Bauch</text>

  <g fill="#1d6b3a">
    <circle cx="58" cy="404" r="17"/>
    <circle cx="58" cy="460" r="17"/>
    <circle cx="58" cy="516" r="17"/>
  </g>
  <g font-family="Georgia, serif" font-size="19" fill="#faf9f6" text-anchor="middle">
    <text x="58" y="411">1</text><text x="58" y="467">2</text><text x="58" y="523">3</text>
  </g>
  <text x="86" y="400" font-family="Georgia, serif" font-size="23" fill="#111">HÖREN — in allen vier</text>
  <text x="86" y="428" font-family="Georgia, serif" font-size="23" fill="#111">Vierteln lauschen.</text>
  <text x="86" y="468" font-family="Georgia, serif" font-size="23" fill="#111">KLOPFEN.</text>
  <text x="86" y="512" font-family="Georgia, serif" font-size="23" fill="#111">TASTEN — weit weg von</text>
  <text x="86" y="540" font-family="Georgia, serif" font-size="23" fill="#111">der schmerzhaftesten</text>
  <text x="86" y="568" font-family="Georgia, serif" font-size="23" fill="#111">Stelle anfangen, sehr sanft.</text>

  <line x1="446" y1="112" x2="446" y2="600" stroke="#c9c4b4" stroke-width="3"/>

  <!-- ============ B: die Zeichen ============ -->
  <text x="470" y="96" font-family="Georgia, serif" font-size="23" fill="#1d6b3a">Woran man sie erkennt</text>

  <!-- zusammengekruemmt wie ein Embryo -->
  <line x1="490" y1="290" x2="700" y2="290" stroke="#111" stroke-width="4"/>
  <circle cx="530" cy="256" r="21" fill="#c9c4b4" stroke="#111" stroke-width="4"/>
  <rect x="552" y="240" width="104" height="46" rx="22" fill="#c9c4b4" stroke="#111" stroke-width="4"/>
  <g stroke="#111" stroke-width="26" stroke-linecap="round" fill="none">
    <path d="M 648 272 L 706 240"/>
    <path d="M 706 240 L 676 200"/>
  </g>
  <g stroke="#c9c4b4" stroke-width="18" stroke-linecap="round" fill="none">
    <path d="M 648 272 L 706 240"/>
    <path d="M 706 240 L 676 200"/>
  </g>
  <line x1="596" y1="238" x2="560" y2="196" stroke="#d65a1a" stroke-width="2"/>
  <text x="470" y="160" font-family="Georgia, serif" font-size="21" fill="#d65a1a">zusammengekrümmt wie ein Embryo:</text>
  <text x="470" y="186" font-family="Georgia, serif" font-size="21" fill="#d65a1a">jede Bewegung tut weh</text>

  <g fill="#a3231a">
    <circle cx="482" cy="336" r="7"/>
    <circle cx="482" cy="390" r="7"/>
    <circle cx="482" cy="444" r="7"/>
  </g>
  <text x="502" y="344" font-family="Georgia, serif" font-size="21" fill="#111">Ein BRETTHARTER Bauch ist eindeutig.</text>
  <text x="502" y="398" font-family="Georgia, serif" font-size="21" fill="#111">In allen vier Vierteln nichts zu hören.</text>
  <text x="502" y="452" font-family="Georgia, serif" font-size="21" fill="#111">Fieber 37,8 bis 38,3 Grad, schneller Puls.</text>

  <text x="470" y="512" font-family="Georgia, serif" font-size="23" fill="#a3231a">Aussagekräftiger als der Zustand</text>
  <text x="470" y="540" font-family="Georgia, serif" font-size="23" fill="#a3231a">ist die VERÄNDERUNG: leiser</text>
  <text x="470" y="568" font-family="Georgia, serif" font-size="23" fill="#a3231a">werdende Darmgeräusche bei</text>
  <text x="470" y="596" font-family="Georgia, serif" font-size="23" fill="#a3231a">zunehmender Druckempfindlichkeit.</text>

  <line x1="40" y1="628" x2="860" y2="628" stroke="#c9c4b4" stroke-width="3"/>

  <!-- ============ C: der schonendere Handgriff ============ -->
  <text x="40" y="670" font-family="Georgia, serif" font-size="23" fill="#1d6b3a">Der schonendere Handgriff</text>

  <line x1="60" y1="768" x2="330" y2="768" stroke="#111" stroke-width="4"/>
  <circle cx="94" cy="744" r="19" fill="#c9c4b4" stroke="#111" stroke-width="4"/>
  <rect x="116" y="726" width="96" height="42" rx="19" fill="#c9c4b4" stroke="#111" stroke-width="4"/>
  <rect x="212" y="720" width="52" height="48" rx="14" fill="#c9c4b4" stroke="#111" stroke-width="4"/>
  <g fill="#d65a1a">
    <rect x="204" y="694" width="30" height="24" rx="8"/>
    <rect x="242" y="694" width="30" height="24" rx="8"/>
  </g>
  <g stroke="#d65a1a" stroke-width="4" fill="none">
    <path d="M 288 706 q 16 12 0 26"/>
    <path d="M 300 700 q 22 18 0 38"/>
  </g>

  <text x="350" y="712" font-family="Georgia, serif" font-size="21" fill="#111">Das Becken leicht rütteln, statt auf den</text>
  <text x="350" y="738" font-family="Georgia, serif" font-size="21" fill="#111">Bauch zu drücken. Wenn schon das</text>
  <text x="350" y="764" font-family="Georgia, serif" font-size="21" fill="#111">Erschüttern weh tut, braucht man</text>
  <text x="350" y="790" font-family="Georgia, serif" font-size="21" fill="#111">gar nicht erst zu drücken.</text>

  <rect x="40" y="806" width="820" height="40" rx="8" fill="none" stroke="#a3231a" stroke-width="3"/>
  <text x="62" y="834" font-family="Georgia, serif" font-size="21" fill="#a3231a">Das gilt für den Bauch. Bei Verdacht auf einen BECKENBRUCH wird nie gerüttelt.</text>
</svg>
