<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560">
  <!-- Zum Tipp "Hochwasser: fuenfzehn Zentimeter reichen".
       Die beiden Zahlen der Quelle sind das Wertvollste am Tipp, und beide
       sind kleiner, als jeder schaetzt. Als Zahl im Text bleibt "15 cm"
       abstrakt; neben einem Menschen gezeichnet sieht man, dass es
       KNOECHELTIEF ist. Dasselbe bei 60 cm neben einem Auto: gut kniehoch,
       und das Auto schwimmt bereits.
       Deshalb ist der Massstab hier der ganze Inhalt: Mensch und Auto in
       richtiger Groesse zueinander, die Wasserlinie an der richtigen Stelle. -->
  <rect width="900" height="560" fill="#faf9f6"/>
  <text x="30" y="44" font-family="Georgia, serif" font-size="25" fill="#111">Hochwasser: beide Zahlen sind kleiner, als man denkt</text>

  <!-- Grundlinie -->
  <line x1="40" y1="450" x2="860" y2="450" stroke="#111" stroke-width="4"/>

  <!-- Wasserflaechen liegen HINTER den Figuren. Im ersten Anlauf lagen sie
       davor und haben Mensch und Auto zugedeckt; nur die Oberflaechenlinie
       gehoert nach vorn, damit man sieht, wo sie den Koerper schneidet. -->
  <rect x="40" y="424" width="340" height="26" fill="#a8c4d4" opacity="0.55"/>
  <rect x="470" y="347" width="390" height="103" fill="#a8c4d4" opacity="0.55"/>

  <!-- ===== LINKS: Mensch, 15 cm ===== -->
  <!-- Massstab: 175 cm Mensch = 300 px  =>  1 cm = 1,714 px; 15 cm = 26 px -->
  <g>
    <circle cx="180" cy="176" r="24" fill="none" stroke="#111" stroke-width="6"/>
    <line x1="180" y1="200" x2="180" y2="330" stroke="#111" stroke-width="8" stroke-linecap="round"/>
    <line x1="180" y1="232" x2="136" y2="286" stroke="#111" stroke-width="7" stroke-linecap="round"/>
    <line x1="180" y1="232" x2="224" y2="286" stroke="#111" stroke-width="7" stroke-linecap="round"/>
    <line x1="180" y1="330" x2="152" y2="450" stroke="#111" stroke-width="8" stroke-linecap="round"/>
    <line x1="180" y1="330" x2="208" y2="450" stroke="#111" stroke-width="8" stroke-linecap="round"/>
  </g>
  <!-- Wasser 15 cm = 26 px -->
  <line x1="40" y1="424" x2="380" y2="424" stroke="#5b7f96" stroke-width="4"/>
  <g stroke="#d65a1a" stroke-width="3">
    <line x1="300" y1="424" x2="300" y2="450"/>
    <line x1="292" y1="424" x2="308" y2="424"/>
    <line x1="292" y1="450" x2="308" y2="450"/>
  </g>
  <text x="316" y="440" font-family="Georgia, serif" font-size="22" fill="#d65a1a">15 cm</text>
  <g font-family="Georgia, serif" font-size="19" fill="#111">
    <text x="40" y="498">Knöcheltief. So viel schnell fließendes</text>
    <text x="40" y="522">Wasser reißt einen Menschen um.</text>
  </g>

  <!-- ===== RECHTS: Auto, 60 cm ===== -->
  <!-- gleicher Massstab: Auto 145 cm hoch = 249 px; 60 cm = 103 px -->
  <g>
    <path d="M 520 450 L 520 372 L 566 372 L 604 316 L 730 316 L 762 372 L 812 372 L 812 450 Z"
          fill="#e6e2d6" stroke="#111" stroke-width="6" stroke-linejoin="round"/>
    <path d="M 612 322 L 726 322 L 752 368 L 574 368 Z" fill="#faf9f6" stroke="#111" stroke-width="4"/>
    <circle cx="578" cy="450" r="30" fill="#faf9f6" stroke="#111" stroke-width="6"/>
    <circle cx="756" cy="450" r="30" fill="#faf9f6" stroke="#111" stroke-width="6"/>
  </g>
  <!-- Wasser 60 cm = 103 px -->
  <line x1="470" y1="347" x2="860" y2="347" stroke="#5b7f96" stroke-width="4"/>
  <g stroke="#d65a1a" stroke-width="3">
    <line x1="496" y1="347" x2="496" y2="450"/>
    <line x1="488" y1="347" x2="504" y2="347"/>
    <line x1="488" y1="450" x2="504" y2="450"/>
  </g>
  <text x="400" y="404" font-family="Georgia, serif" font-size="22" fill="#d65a1a">60 cm</text>
  <g font-family="Georgia, serif" font-size="19" fill="#111">
    <text x="470" y="498">Die meisten Autos schwimmen auf.</text>
    <text x="470" y="522">Ein aufschwimmendes Auto treibt.</text>
  </g>
</svg>
