<svg xmlns="http://www.w3.org/2000/svg" width="900" height="524" viewBox="0 0 900 524">
  <!-- Zum Tipp erste-hilfe-angelhaken, "Angelhaken in der Haut: durchschieben
       oder stecken lassen".
       Gezeigt wird nur der Fall, fuer den die Leitlinie das Durchschieben
       ueberhaupt erlaubt: der Haken sitzt OBERFLAECHLICH, die Spitze
       schimmert durch. Drei Saetze werden als Bewegungsrichtung gezeichnet,
       nicht nur benannt:
       1) "Den Haken WEITER IN SEINER EIGENEN KRUEMMUNG schieben, bis die
          Spitze samt Widerhaken durch die Haut wieder heraustritt", Tafel 1:
          die gestrichelte Fortsetzung folgt derselben Kruemmung wie der
          bereits eingedrungene Teil, nicht einer Geraden.
       2) "Die Spitze abkneifen, hinter dem Widerhaken", Tafel 2: die
          orange Markierung sitzt zwischen dem Widerhaken und der Stelle, an
          der der Haken die Haut verlaesst, nicht vor der Spitze.
       3) "Den Rest rueckwaerts herausziehen, den Weg zurueck, den er
          gekommen ist", Tafel 3: der Pfeil zeigt in die GEGENRICHTUNG von
          Tafel 1 und das Ende ist rund, weil der Widerhaken bereits ab ist.
       Signalfarbe nur an der einen gefaehrlichen Stelle: dem Schnittpunkt in
       Tafel 2. Ein Schnitt vor der Spitze statt dahinter wuerde den
       Widerhaken stehen lassen und das Herausziehen wieder gefaehrlich
       machen. -->
  <rect width="900" height="524" fill="#faf9f6"/>
  <text x="40" y="44" font-family="Georgia, serif" font-size="26" fill="#111">Angelhaken in der Haut: durchschieben</text>
  <text x="40" y="72" font-family="Georgia, serif" font-size="16" fill="#5b7f96">Nur wenn die Spitze oberflächlich durchschimmert – sonst stecken lassen.</text>

  <!-- Trennlinien zwischen den drei Tafeln -->
  <line x1="310" y1="90" x2="310" y2="444" stroke="#5b7f96" stroke-width="2"/>
  <line x1="590" y1="90" x2="590" y2="444" stroke="#5b7f96" stroke-width="2"/>
  <line x1="40" y1="454" x2="860" y2="454" stroke="#5b7f96" stroke-width="2"/>

  <!-- ============ TAFEL 1: Schieben ============ -->
  <g transform="translate(40,100)">
    <text x="14" y="20" font-family="Georgia, serif" font-size="19" fill="#111">Schieben</text>

    <!-- Haut, im Querschnitt -->
    <line x1="20" y1="160" x2="240" y2="160" stroke="#111" stroke-width="3"/>
    <g stroke="#5b7f96" stroke-width="2" opacity="0.6">
      <line x1="34" y1="166" x2="26" y2="178"/><line x1="74" y1="166" x2="66" y2="178"/>
      <line x1="194" y1="166" x2="186" y2="178"/><line x1="226" y1="166" x2="218" y2="178"/>
    </g>
    <text x="24" y="144" font-family="Georgia, serif" font-size="14" fill="#5b7f96">Haut</text>
    <line x1="34" y1="150" x2="34" y2="158" stroke="#5b7f96" stroke-width="1.5"/>

    <!-- Schaft, oberhalb der Haut, zur Angelschnur hin -->
    <path d="M 80 160 L 58 108" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round"/>

    <!-- eingedrungener Teil: Bogen unter der Haut, Spitze noch knapp darunter -->
    <path d="M 80 160 C 64 190 92 224 130 228 C 162 232 182 204 186 170"
          fill="none" stroke="#111" stroke-width="4" stroke-linecap="round"/>

    <!-- Widerhaken an der Spitze, zeigt zurueck zum Bogen -->
    <path d="M 186 170 L 172 178 L 182 184 Z" fill="#faf9f6" stroke="#111" stroke-width="2.5"/>
    <line x1="180" y1="176" x2="168" y2="146" stroke="#5b7f96" stroke-width="1.5"/>
    <text x="86" y="140" font-family="Georgia, serif" font-size="14" fill="#111">Widerhaken</text>

    <!-- gestrichelte Fortsetzung: gleiche Kruemmung weiter bis durch die Haut -->
    <path d="M 186 170 Q 205 150 220 118" fill="none" stroke="#5b7f96" stroke-width="3" stroke-dasharray="6 6"/>
    <path d="M 220 118 l -16 -2 M 220 118 l -6 16" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round"/>

    <text x="14" y="266" font-family="Georgia, serif" font-size="16" fill="#111">In der eigenen Krümmung</text>
    <text x="14" y="288" font-family="Georgia, serif" font-size="16" fill="#111">weiter schieben,</text>
    <text x="14" y="310" font-family="Georgia, serif" font-size="16" fill="#111">bis die Spitze durch die</text>
    <text x="14" y="332" font-family="Georgia, serif" font-size="16" fill="#111">Haut heraustritt.</text>
  </g>

  <!-- ============ TAFEL 2: Abkneifen ============ -->
  <g transform="translate(320,100)">
    <text x="14" y="20" font-family="Georgia, serif" font-size="19" fill="#111">Abkneifen</text>

    <line x1="20" y1="160" x2="240" y2="160" stroke="#111" stroke-width="3"/>
    <g stroke="#5b7f96" stroke-width="2" opacity="0.6">
      <line x1="34" y1="166" x2="26" y2="178"/><line x1="74" y1="166" x2="66" y2="178"/>
      <line x1="222" y1="166" x2="214" y2="178"/>
    </g>

    <path d="M 80 160 L 58 108" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round"/>

    <!-- Haken ganz durchgeschoben: Spitze und Widerhaken jetzt ausserhalb -->
    <path d="M 80 160 C 64 190 92 224 130 228 C 162 232 178 206 182 178 C 184 160 196 140 206 122"
          fill="none" stroke="#111" stroke-width="4" stroke-linecap="round"/>

    <path d="M 206 122 L 192 130 L 202 136 Z" fill="#faf9f6" stroke="#111" stroke-width="2.5"/>

    <!-- Schnittstelle: hinter dem Widerhaken, vor der Stelle, wo der Haken die Haut verlaesst -->
    <path d="M 188 149 L 205 133" stroke="#d65a1a" stroke-width="4" stroke-linecap="round"/>

    <text x="14" y="266" font-family="Georgia, serif" font-size="16" fill="#111">Die Spitze abkneifen –</text>
    <text x="14" y="288" font-family="Georgia, serif" font-size="16" fill="#111">hinter dem Widerhaken.</text>
    <text x="14" y="310" font-family="Georgia, serif" font-size="16" fill="#111">Der Widerhaken kommt</text>
    <text x="14" y="332" font-family="Georgia, serif" font-size="16" fill="#111">mit der Spitze ab.</text>
  </g>

  <!-- ============ TAFEL 3: Rueckwaerts heraus ============ -->
  <g transform="translate(600,100)">
    <text x="14" y="20" font-family="Georgia, serif" font-size="19" fill="#111">Rückwärts heraus</text>

    <line x1="20" y1="160" x2="240" y2="160" stroke="#111" stroke-width="3"/>
    <g stroke="#5b7f96" stroke-width="2" opacity="0.6">
      <line x1="74" y1="166" x2="66" y2="178"/>
      <line x1="194" y1="166" x2="186" y2="178"/><line x1="226" y1="166" x2="218" y2="178"/>
    </g>

    <!-- Rest des Hakens ohne Widerhaken, stumpfes Ende -->
    <path d="M 80 160 C 64 190 92 224 130 228 C 162 232 178 206 182 178 C 184 163 190 150 197 141"
          fill="none" stroke="#111" stroke-width="4" stroke-linecap="round"/>

    <!-- Schaft wird weiter herausgezogen: laenger als in Tafel 1, Gegenrichtung -->
    <path d="M 80 160 L 48 92" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round"/>
    <path d="M 48 92 Q 32 68 20 45" fill="none" stroke="#5b7f96" stroke-width="3" stroke-dasharray="6 6"/>
    <path d="M 20 45 l 16 4 M 20 45 l 2 17" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round"/>

    <text x="14" y="266" font-family="Georgia, serif" font-size="16" fill="#111">Den Rest rückwärts</text>
    <text x="14" y="288" font-family="Georgia, serif" font-size="16" fill="#111">herausziehen –</text>
    <text x="14" y="310" font-family="Georgia, serif" font-size="16" fill="#111">denselben Weg zurück,</text>
    <text x="14" y="332" font-family="Georgia, serif" font-size="16" fill="#111">den er gekommen ist.</text>
  </g>

  <text x="40" y="482" font-family="Georgia, serif" font-size="18" fill="#111">Tief, am Gelenk oder in der Nähe eines großen Gefäßes: nicht durchschieben, sondern stecken lassen.</text>
  <text x="40" y="508" font-family="Georgia, serif" font-size="18" fill="#111">Im Auge oder Augenlid: gar nichts tun, nur abdecken.</text>
</svg>
