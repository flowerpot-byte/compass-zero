<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900">
  <!-- Zum Tipp "Stromunfall: erst abschalten, dann anfassen".
       Vier Tafeln fuer vier Dinge, die der Text nacheinander sagt und die man
       zugleich wissen muss.
       Tafel 2 ist der eigentliche Grund fuer dieses Bild: Die Quelle nennt es
       ausdruecklich als Irrtum, den fast alle haben — ein Mensch, den es
       geschlagen hat, ist NICHT geladen. Wer aus Angst vor einer Ladung
       zoegert, verliert Minuten, in denen wiederbelebt werden muesste. Ein
       Satz allein wird ueberlesen; als eigene Tafel mit gruenem Haken nicht.
       Tafel 3 erklaert, WARUM Abschalten der erste Schritt ist und nicht
       Ziehen: Bei niedriger Spannung verkrampfen die Muskeln, die Person
       klebt an der Quelle. Bei hoher Spannung wird sie weggeschleudert, und
       dann kommen Sturzverletzungen dazu.
       Tafel 4 zeigt, warum zwei kleine Brandstellen eine schwere Verletzung
       bedeuten koennen: Der Schaden liegt auf dem Weg dazwischen. -->
  <rect width="900" height="900" fill="#faf9f6"/>
  <text x="40" y="46" font-family="Georgia, serif" font-size="28" fill="#111">Stromunfall: die Reihenfolge und ein verbreiteter Irrtum</text>

  <!-- ============ 1. Die Reihenfolge ============ -->
  <text x="40" y="96" font-family="Georgia, serif" font-size="23" fill="#1d6b3a">1. Erst abschalten, dann anfassen</text>

  <!-- Steckdose an der Wand -->
  <rect x="62" y="130" width="18" height="150" fill="#c9c4b4" stroke="#111" stroke-width="4"/>
  <rect x="80" y="164" width="42" height="44" rx="6" fill="#e8eef2" stroke="#111" stroke-width="4"/>
  <circle cx="94" cy="186" r="5" fill="#111"/>
  <circle cx="108" cy="186" r="5" fill="#111"/>
  <!-- Kabel zur Person -->
  <path d="M 122 194 Q 200 220 268 244" fill="none" stroke="#111" stroke-width="5"/>
  <!-- Boden -->
  <line x1="40" y1="290" x2="430" y2="290" stroke="#111" stroke-width="4"/>

  <!-- Person am Boden -->
  <circle cx="288" cy="266" r="21" fill="#c9c4b4" stroke="#111" stroke-width="4"/>
  <rect x="310" y="248" width="106" height="42" rx="19" fill="#c9c4b4" stroke="#111" stroke-width="4"/>

  <!-- Schritt 1 an der Steckdose -->
  <circle cx="101" cy="120" r="18" fill="#1d6b3a"/>
  <text x="101" y="128" font-family="Georgia, serif" font-size="21" fill="#faf9f6" text-anchor="middle">1</text>
  <line x1="101" y1="140" x2="101" y2="158" stroke="#1d6b3a" stroke-width="3"/>
  <text x="140" y="128" font-family="Georgia, serif" font-size="21" fill="#1d6b3a">Sicherung heraus,</text>
  <text x="140" y="154" font-family="Georgia, serif" font-size="21" fill="#1d6b3a">Stecker ziehen</text>

  <!-- Schritt 2 an der Person -->
  <circle cx="360" cy="212" r="18" fill="#1d6b3a"/>
  <text x="360" y="220" font-family="Georgia, serif" font-size="21" fill="#faf9f6" text-anchor="middle">2</text>
  <line x1="360" y1="232" x2="360" y2="246" stroke="#1d6b3a" stroke-width="3"/>

  <!-- Der falsche Weg: direkt hinfassen -->
  <g stroke="#a3231a" stroke-width="5" fill="none">
    <path d="M 150 258 L 252 272"/>
    <path d="M 252 272 l -20 -8 M 252 272 l -16 12"/>
    <path d="M 178 246 L 216 286 M 216 246 L 178 286"/>
  </g>
  <text x="40" y="330" font-family="Georgia, serif" font-size="21" fill="#a3231a">Wer eine Person anfasst, die noch am</text>
  <text x="40" y="356" font-family="Georgia, serif" font-size="21" fill="#a3231a">Strom hängt, wird selbst zum zweiten</text>
  <text x="40" y="382" font-family="Georgia, serif" font-size="21" fill="#a3231a">Verletzten. Geht Abschalten nicht: mit</text>
  <text x="40" y="408" font-family="Georgia, serif" font-size="21" fill="#a3231a">trockenem, nicht leitendem Gegenstand</text>
  <text x="40" y="434" font-family="Georgia, serif" font-size="21" fill="#a3231a">wegschieben, aus sicherem Abstand.</text>

  <line x1="446" y1="110" x2="446" y2="450" stroke="#c9c4b4" stroke-width="3"/>

  <!-- ============ 2. Der Irrtum ============ -->
  <text x="472" y="96" font-family="Georgia, serif" font-size="23" fill="#1d6b3a">2. Der Irrtum, der Minuten kostet</text>

  <line x1="470" y1="290" x2="860" y2="290" stroke="#111" stroke-width="4"/>
  <circle cx="600" cy="266" r="21" fill="#c9c4b4" stroke="#111" stroke-width="4"/>
  <rect x="622" y="248" width="140" height="42" rx="19" fill="#c9c4b4" stroke="#111" stroke-width="4"/>
  <!-- keine Verbindung mehr: durchtrenntes Kabel -->
  <path d="M 486 210 Q 520 232 548 244" fill="none" stroke="#111" stroke-width="5"/>
  <g stroke="#a3231a" stroke-width="4">
    <path d="M 548 232 l 16 22 M 564 230 l -16 24"/>
  </g>
  <text x="472" y="190" font-family="Georgia, serif" font-size="21" fill="#111">Verbindung getrennt</text>

  <!-- Hand fasst an, mit gruenem Haken -->
  <rect x="666" y="196" width="40" height="34" rx="10" fill="#1d6b3a"/>
  <line x1="686" y1="230" x2="686" y2="246" stroke="#1d6b3a" stroke-width="4"/>
  <circle cx="744" cy="204" r="19" fill="#1d6b3a"/>
  <g stroke="#faf9f6" stroke-width="4" fill="none">
    <path d="M 735 204 l 6 7 l 12 -14"/>
  </g>

  <text x="472" y="330" font-family="Georgia, serif" font-size="23" fill="#a3231a">Ein Mensch, den es geschlagen hat,</text>
  <text x="472" y="358" font-family="Georgia, serif" font-size="23" fill="#a3231a">ist NICHT elektrisch geladen.</text>
  <text x="472" y="392" font-family="Georgia, serif" font-size="21" fill="#111">Sobald er die Quelle nicht mehr berührt,</text>
  <text x="472" y="418" font-family="Georgia, serif" font-size="21" fill="#111">darf er sofort angefasst werden — auch</text>
  <text x="472" y="444" font-family="Georgia, serif" font-size="21" fill="#111">nach einem Blitzschlag.</text>

  <line x1="40" y1="474" x2="860" y2="474" stroke="#c9c4b4" stroke-width="3"/>

  <!-- ============ 3. Niedrige und hohe Spannung ============ -->
  <text x="40" y="516" font-family="Georgia, serif" font-size="23" fill="#1d6b3a">3. Warum abschalten und nicht ziehen</text>

  <!-- niedrige Spannung: klebt fest -->
  <rect x="62" y="556" width="18" height="120" fill="#c9c4b4" stroke="#111" stroke-width="4"/>
  <rect x="80" y="580" width="38" height="40" rx="6" fill="#e8eef2" stroke="#111" stroke-width="4"/>
  <rect x="116" y="586" width="34" height="28" rx="8" fill="#d65a1a" stroke="#111" stroke-width="4"/>
  <!-- Arm zur Steckdose, dann Kopf und Rumpf: sonst klebt nur ein Kopf da -->
  <g stroke="#111" stroke-width="9" stroke-linecap="round">
    <line x1="150" y1="600" x2="214" y2="614"/>
  </g>
  <circle cx="238" cy="606" r="19" fill="#c9c4b4" stroke="#111" stroke-width="4"/>
  <rect x="224" y="626" width="40" height="50" rx="18" fill="#c9c4b4" stroke="#111" stroke-width="4"/>
  <line x1="62" y1="676" x2="430" y2="676" stroke="#111" stroke-width="4"/>
  <!-- Verkrampfung andeuten -->
  <g stroke="#d65a1a" stroke-width="3" fill="none">
    <path d="M 160 586 l 8 -10 M 176 588 l 8 -10 M 192 592 l 8 -10"/>
  </g>
  <text x="62" y="708" font-family="Georgia, serif" font-size="21" fill="#d65a1a">Niedrige Spannung: die Muskeln</text>
  <text x="62" y="734" font-family="Georgia, serif" font-size="21" fill="#d65a1a">verkrampfen, die Person KLEBT fest</text>
  <text x="62" y="760" font-family="Georgia, serif" font-size="21" fill="#d65a1a">und kann sich nicht selbst lösen.</text>

  <!-- hohe Spannung: weggeschleudert -->
  <line x1="470" y1="676" x2="860" y2="676" stroke="#111" stroke-width="4"/>
  <path d="M 500 676 L 500 556 M 486 566 L 514 566" fill="none" stroke="#111" stroke-width="4"/>
  <g stroke="#d65a1a" stroke-width="5" fill="none">
    <path d="M 520 580 L 610 604"/>
    <path d="M 610 604 l -20 -8 M 610 604 l -14 14"/>
  </g>
  <circle cx="660" cy="620" r="19" fill="#c9c4b4" stroke="#111" stroke-width="4"/>
  <rect x="682" y="604" width="96" height="38" rx="17" fill="#c9c4b4" stroke="#111" stroke-width="4"/>
  <text x="470" y="708" font-family="Georgia, serif" font-size="21" fill="#d65a1a">Hohe Spannung: kurz und</text>
  <text x="470" y="734" font-family="Georgia, serif" font-size="21" fill="#d65a1a">explosionsartig, die Person wird</text>
  <text x="470" y="760" font-family="Georgia, serif" font-size="21" fill="#d65a1a">WEGGESCHLEUDERT — dazu</text>
  <text x="470" y="786" font-family="Georgia, serif" font-size="21" fill="#d65a1a">Sturzverletzungen.</text>

  <line x1="40" y1="812" x2="860" y2="812" stroke="#c9c4b4" stroke-width="3"/>
  <text x="40" y="846" font-family="Georgia, serif" font-size="21" fill="#111">Zwei kleine Brandstellen können viel bedeuten: Es gibt eine Eintritts- und eine</text>
  <text x="40" y="872" font-family="Georgia, serif" font-size="21" fill="#111">Austrittsstelle, und dazwischen liegt der Weg des Stroms durch den Körper.</text>
</svg>
