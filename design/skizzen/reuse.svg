<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560">
  <!-- Zu Schritt 5 der Bauanleitung "Fischen ohne Angel": die Reuse.
       Laengsschnitt.
       Der Text sagt "ein Loch, das gerade gross genug zum Hineinschwimmen ist
       und den Rueckweg erschwert". Als Satz klingt das nach einem Loch. Es ist
       aber ein nach INNEN gezogener Trichter: Von aussen findet der Fisch die
       weite Oeffnung sofort; von innen muesste er die schmale Spitze treffen,
       und die zeigt von ihm weg. Genau diese Umkehrung macht die Falle aus,
       und genau sie sieht man nur im Schnitt. -->
  <rect width="900" height="560" fill="#faf9f6"/>
  <text x="30" y="44" font-family="Georgia, serif" font-size="25" fill="#111">Reuse: der Trichter zeigt nach innen — Längsschnitt</text>

  <!-- Wasser -->
  <rect x="0" y="96" width="900" height="380" fill="#eef1f0"/>
  <line x1="0" y1="96" x2="900" y2="96" stroke="#cfd6d4" stroke-width="4"/>

  <!-- Korb: laenglicher Koerper aus Stoecken -->
  <path d="M 250 168 L 700 168 Q 730 168 730 200 L 730 372 Q 730 404 700 404 L 250 404 Z"
        fill="#faf9f6" stroke="#111" stroke-width="6" stroke-linejoin="round"/>
  <g stroke="#111" stroke-width="3">
    <line x1="320" y1="168" x2="320" y2="404"/>
    <line x1="390" y1="168" x2="390" y2="404"/>
    <line x1="460" y1="168" x2="460" y2="404"/>
    <line x1="530" y1="168" x2="530" y2="404"/>
    <line x1="600" y1="168" x2="600" y2="404"/>
    <line x1="670" y1="168" x2="670" y2="404"/>
  </g>

  <!-- Der Trichter: von der Muendung nach INNEN gezogen -->
  <path d="M 250 168 L 400 250 M 250 404 L 400 322"
        fill="none" stroke="#d65a1a" stroke-width="8" stroke-linecap="round"/>
  <!-- Die enge Stelle -->
  <g stroke="#d65a1a" stroke-width="3">
    <line x1="418" y1="250" x2="418" y2="322"/>
    <line x1="410" y1="250" x2="426" y2="250"/>
    <line x1="410" y1="322" x2="426" y2="322"/>
  </g>

  <!-- Fisch draussen, schwimmt hinein -->
  <g transform="translate(150,286)">
    <path d="M 0 0 C 18 -20 54 -20 72 0 C 54 20 18 20 0 0 Z" fill="#111"/>
    <path d="M 0 0 L -22 -14 L -22 14 Z" fill="#111"/>
    <circle cx="56" cy="-5" r="4" fill="#faf9f6"/>
  </g>
  <g fill="none" stroke="#111" stroke-width="4" stroke-linecap="round">
    <line x1="238" y1="286" x2="292" y2="286"/>
    <path d="M 292 286 l -16 -11 M 292 286 l -16 11"/>
  </g>

  <!-- Fisch drinnen, findet nicht zurueck -->
  <g transform="translate(560,286)">
    <path d="M 0 0 C 18 -20 54 -20 72 0 C 54 20 18 20 0 0 Z" fill="#111"/>
    <path d="M 72 0 L 94 -14 L 94 14 Z" fill="#111"/>
    <circle cx="16" cy="-5" r="4" fill="#faf9f6"/>
  </g>
  <path d="M 548 286 L 452 286" fill="none" stroke="#d65a1a" stroke-width="4"
        stroke-linecap="round" stroke-dasharray="12 9"/>
  <g stroke="#d65a1a" stroke-width="7" stroke-linecap="round">
    <line x1="404" y1="264" x2="440" y2="308"/>
    <line x1="440" y1="264" x2="404" y2="308"/>
  </g>

  <!-- Beschriftungen ausserhalb -->
  <g font-family="Georgia, serif" font-size="19" fill="#d65a1a">
    <text x="30" y="150">weite Öffnung</text>
    <text x="30" y="176">von außen</text>
    <text x="470" y="474">schmale Spitze, zeigt nach innen</text>
  </g>
  <path d="M 466 462 L 424 336" fill="none" stroke="#d65a1a" stroke-width="2" stroke-dasharray="8 7"/>

  <g font-family="Georgia, serif" font-size="19" fill="#111">
    <text x="30" y="512">Hinein findet der Fisch sofort. Hinaus müsste er die Spitze treffen,</text>
    <text x="30" y="538">und die zeigt von ihm weg. Ködern — bei Fischfallen fast immer nötig.</text>
  </g>
</svg>
