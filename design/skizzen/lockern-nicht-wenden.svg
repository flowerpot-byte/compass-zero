<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580">
  <!-- Kapitel agrikultur-boden, Abschnitt 2: Schritt eins - lockern, ohne zu wenden.
       Gezeigter Satz: "Dabei wird der Boden nicht gewendet ... Die Schichten
       bleiben, wo sie sind" (links, LOCKERN) im Gegensatz zu "Wer umgraebt und
       wendet, kehrt das um" (rechts, WENDEN): die Schichten tauschen die
       Plaetze und das Bodenleben, das oben lebt, landet unten und stirbt ab.
       Die Signalfarbe markiert einzig diesen teuren Fehler (X auf der
       verschuetteten oberen Schicht rechts), nicht die Pfeile und nicht die
       Ueberschriften. Zahl 30 Zentimeter = Arbeitstiefe der Grabegabel, steht
       wortgleich im Abschnittstext. -->
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#111"/>
    </marker>
  </defs>
  <rect width="900" height="580" fill="#faf9f6"/>

  <text x="450" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#111">Schritt eins: lockern, ohne zu wenden</text>

  <text x="270" y="72" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#111">LOCKERN</text>
  <text x="270" y="93" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5b7f96">(richtig)</text>
  <text x="665" y="72" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#111">WENDEN</text>
  <text x="665" y="93" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5b7f96">(falsch)</text>

  <!-- Tiefenmass am linken Rand -->
  <line x1="95" y1="140" x2="95" y2="420" stroke="#5b7f96" stroke-width="1.5"/>
  <line x1="88" y1="140" x2="102" y2="140" stroke="#5b7f96" stroke-width="1.5"/>
  <line x1="88" y1="420" x2="102" y2="420" stroke="#5b7f96" stroke-width="1.5"/>
  <text x="100" y="144" text-anchor="end" font-family="Georgia, serif" font-size="14" fill="#5b7f96">0</text>
  <text x="78" y="272" text-anchor="end" font-family="Georgia, serif" font-size="15" fill="#5b7f96">30</text>
  <text x="78" y="290" text-anchor="end" font-family="Georgia, serif" font-size="15" fill="#5b7f96">Zentimeter</text>

  <!-- Linkes Profil: LOCKERN. Bodenleben oben bleibt oben, Untergrund unten bleibt unten -->
  <line x1="110" y1="140" x2="430" y2="140" stroke="#111" stroke-width="2"/>
  <rect x="110" y="140" width="320" height="95" fill="#7a5a3e"/>
  <rect x="110" y="235" width="320" height="185" fill="#d9c98a"/>
  <line x1="110" y1="235" x2="430" y2="235" stroke="#5b7f96" stroke-width="1.5" stroke-dasharray="5,4"/>
  <rect x="110" y="140" width="320" height="280" fill="none" stroke="#111" stroke-width="1.5"/>

  <!-- Grabegabel: eingestochen bis etwa 30 Zentimeter, nichts wird gedreht -->
  <line x1="255" y1="104" x2="285" y2="104" stroke="#111" stroke-width="4" stroke-linecap="round"/>
  <line x1="270" y1="104" x2="270" y2="402" stroke="#111" stroke-width="4" stroke-linecap="round"/>
  <line x1="270" y1="402" x2="252" y2="418" stroke="#111" stroke-width="3" stroke-linecap="round"/>
  <line x1="270" y1="402" x2="270" y2="420" stroke="#111" stroke-width="3" stroke-linecap="round"/>
  <line x1="270" y1="402" x2="288" y2="418" stroke="#111" stroke-width="3" stroke-linecap="round"/>
  <text x="345" y="109" font-family="Georgia, serif" font-size="14" fill="#111">Grabegabel</text>

  <!-- Lockerungsloecher: Hohlraeume entstehen, die Schichten selbst wandern nicht -->
  <g fill="#faf9f6">
    <circle cx="140" cy="172" r="6"/>
    <circle cx="380" cy="172" r="6"/>
    <circle cx="340" cy="212" r="6"/>
    <circle cx="150" cy="272" r="6"/>
    <circle cx="370" cy="292" r="6"/>
    <circle cx="180" cy="372" r="6"/>
  </g>

  <line x1="428" y1="192" x2="434" y2="192" stroke="#5b7f96" stroke-width="1.2"/>
  <text x="437" y="196" font-family="Georgia, serif" font-size="14" fill="#111">Bodenleben</text>
  <line x1="428" y1="332" x2="434" y2="332" stroke="#5b7f96" stroke-width="1.2"/>
  <text x="437" y="336" font-family="Georgia, serif" font-size="14" fill="#111">Untergrund</text>

  <!-- Rechtes Profil: WENDEN. Die Schichten haben die Plaetze getauscht -->
  <line x1="510" y1="140" x2="820" y2="140" stroke="#111" stroke-width="2"/>
  <rect x="510" y="140" width="310" height="95" fill="#d9c98a"/>
  <rect x="510" y="235" width="310" height="185" fill="#7a5a3e"/>
  <line x1="510" y1="235" x2="820" y2="235" stroke="#5b7f96" stroke-width="1.5" stroke-dasharray="5,4"/>
  <rect x="510" y="140" width="310" height="280" fill="none" stroke="#111" stroke-width="1.5"/>

  <!-- Drehbewegung: obere Schicht wandert nach unten, untere nach oben -->
  <path d="M615,172 C575,252 575,342 615,402" stroke="#111" stroke-width="2.5" fill="none" marker-end="url(#pfeil)"/>
  <path d="M715,400 C757,340 757,254 715,174" stroke="#111" stroke-width="2.5" fill="none" marker-end="url(#pfeil)"/>

  <!-- Die eine Signalfarbe dieser Zeichnung: das verschuettete, absterbende Bodenleben -->
  <line x1="651" y1="314" x2="679" y2="342" stroke="#d65a1a" stroke-width="5" stroke-linecap="round"/>
  <line x1="679" y1="314" x2="651" y2="342" stroke="#d65a1a" stroke-width="5" stroke-linecap="round"/>
  <line x1="690" y1="328" x2="812" y2="328" stroke="#5b7f96" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="816" y="324" font-family="Georgia, serif" font-size="14" fill="#111">Bodenleben</text>
  <text x="816" y="342" font-family="Georgia, serif" font-size="14" fill="#111">stirbt ab</text>

  <text x="270" y="444" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#111">Schichten bleiben, wo sie sind</text>
  <text x="270" y="466" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5b7f96">eingestochen, nicht umgedreht</text>
  <text x="665" y="444" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#111">Schichten tauschen die Plätze</text>
  <text x="665" y="466" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5b7f96">umgedreht statt gelockert</text>

  <text x="450" y="522" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#111">Die Gabel wird eingestochen und der Boden gelockert — nicht umgedreht.</text>
</svg>
