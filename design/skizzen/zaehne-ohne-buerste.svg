<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" font-family="Georgia, serif">
  <!-- Zum Tipp medizin-zaehne-ohne-buerste.

       GEZEIGTE AUSSAGE: das Kauholz als Buerstenersatz. Der Tipp schreibt:
       Such einen Zweig von etwa 20 Zentimetern Laenge und einem Zentimeter
       Dicke. Kau das eine Ende so lange, bis sich die Fasern trennen -
       dann hast du einen Pinsel. Genau dieser Vorgang, ein fester Ast wird
       am Ende zu gefaecherten Fasern, laesst sich in Worten nur umstaendlich
       beschreiben, im Bild aber auf einen Blick zeigen. Der Unterschied ist
       als Form UND Fuellung gezeichnet: der ungekaute Teil ist ein voller,
       dunkler Umriss, das gekaute Ende sind duenne, helle Einzelfasern.

       Kleine Ergaenzung rechts unten, bewusst kleiner gezeichnet: der Lappen
       als zweiter Weg, ein Stoffstreifen um die Finger gewickelt.

       SIGNALFARBE: Der Tipp setzt an keiner Stelle im Text ein
       Ausrufezeichen. Deshalb bleibt die Farbe #d65a1a hier ganz weg.

       Alle Zahlen (20 Zentimeter, ein Zentimeter) stehen wortgleich im
       Tipptext, keine weitere Zahl wurde hinzugefuegt. -->

  <rect width="900" height="600" fill="#faf9f6"/>

  <text x="40" y="46" font-family="Georgia, serif" font-size="26" fill="#111">Der Zahnbürsten-Ersatz: das Kauholz</text>
  <text x="40" y="76" font-family="Georgia, serif" font-size="17" fill="#5b7f96">Mindestens einmal am Tag gründlich reinigen — auch ohne Bürste</text>

  <!-- ===================== Laengen-Massline ===================== -->
  <line x1="170" y1="118" x2="650" y2="118" stroke="#5b7f96" stroke-width="1.5"/>
  <polygon points="170,118 179,113 179,123" fill="#5b7f96"/>
  <polygon points="650,118 641,113 641,123" fill="#5b7f96"/>
  <text x="410" y="108" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#5b7f96">etwa 20 cm</text>

  <!-- ===================== Dicken-Massline ===================== -->
  <line x1="150" y1="242" x2="150" y2="278" stroke="#5b7f96" stroke-width="1.5"/>
  <polygon points="150,242 145,251 155,251" fill="#5b7f96"/>
  <polygon points="150,278 145,269 155,269" fill="#5b7f96"/>
  <text x="40" y="264" font-family="Georgia, serif" font-size="16" fill="#5b7f96">etwa 1 cm</text>

  <!-- ===================== Der Zweig: fester Griff, gekautes Ende ===================== -->
  <!-- Griff: durchgehender Umriss, links rund, rechts an die Fasern anschliessend -->
  <path d="M 188,242 L 460,242 L 460,278 L 188,278 A 18 18 0 0 1 188 242 Z"
        fill="#7a5a3e" stroke="#111" stroke-width="4" stroke-linejoin="round"/>
  <text x="185" y="305" font-family="Georgia, serif" font-size="16" fill="#111">Zweig</text>

  <!-- Gekautes Ende: einzelne Fasern, jede ein eigener geschlossener Umriss,
       heller gefuellt als der Griff, die Form UND die Fuellung wechseln -->
  <g fill="#d9c98a" stroke="#111" stroke-width="2" stroke-linejoin="round">
    <path d="M460,243.5 Q506,209 552,186 Q506,223 460,248.5 Z"/>
    <path d="M460,248.5 Q526,221 592,206 Q526,236 460,253.5 Z"/>
    <path d="M460,253.5 Q542,236 624,230 Q542,250 460,258.5 Z"/>
    <path d="M460,257.5 Q555,256 650,260 Q555,264 460,262.5 Z"/>
    <path d="M460,261.5 Q542,270 624,290 Q542,284 460,266.5 Z"/>
    <path d="M460,266.5 Q526,284 592,314 Q526,299 460,271.5 Z"/>
    <path d="M460,271.5 Q506,297 552,334 Q506,311 460,276.5 Z"/>
  </g>

  <!-- Erklaerender Hinweis, mit Fuehrungslinie zum gekauten Ende -->
  <line x1="605" y1="222" x2="655" y2="205" stroke="#5b7f96" stroke-width="1.5"/>
  <text x="660" y="200" font-family="Georgia, serif" font-size="17" fill="#111">bis sich die Fasern trennen —</text>
  <text x="660" y="222" font-family="Georgia, serif" font-size="17" fill="#111">dann hast du einen Pinsel</text>

  <!-- ===================== Trenner ===================== -->
  <line x1="40" y1="360" x2="860" y2="360" stroke="#5b7f96" stroke-width="1" stroke-dasharray="6 6"/>

  <!-- Die Regel in Worten, als Ergaenzung zum Bild -->
  <text x="40" y="390" font-family="Georgia, serif" font-size="18" fill="#111">Damit putzt du gründlich, mindestens einmal am Tag.</text>

  <text x="40" y="436" font-family="Georgia, serif" font-size="18" fill="#111">Als Putzmittel taugen kleine Mengen Sand, Natron,</text>
  <text x="40" y="460" font-family="Georgia, serif" font-size="18" fill="#111">Salz oder Seife.</text>
  <text x="40" y="498" font-family="Georgia, serif" font-size="18" fill="#111">Zum Spülen: Wasser, Salzwasser oder Weidenrindentee.</text>

  <!-- ===================== Kleine Ergaenzung: der Lappen, zweiter Weg ===================== -->
  <text x="590" y="396" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#111">Der Lappen — zweiter Weg</text>

  <!-- Finger: durchgehender Umriss, oben rund, unten am Bildrand gekappt -->
  <path d="M640,500 L640,430 A20,20 0 0 1 680,430 L680,500 Z"
        fill="#e6e2d6" stroke="#111" stroke-width="3" stroke-linejoin="round"/>

  <!-- Stoffstreifen, um den Finger gewickelt: jede Windung ein eigener Umriss -->
  <path d="M632,448 L688,436 L692,450 L636,462 Z" fill="#d9c98a" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
  <path d="M630,468 L690,456 L694,470 L634,482 Z" fill="#d9c98a" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
  <path d="M628,486 L688,474 L692,488 L632,500 Z" fill="#d9c98a" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
  <!-- loses Ende des Streifens -->
  <path d="M632,448 L610,439 L614,455 L632,458 Z" fill="#d9c98a" stroke="#111" stroke-width="1.5" stroke-linejoin="round"/>

  <text x="590" y="520" font-family="Georgia, serif" font-size="16" fill="#111">Sauberer Stoffstreifen um die Finger —</text>
  <text x="590" y="542" font-family="Georgia, serif" font-size="16" fill="#111">damit Zähne abreiben,</text>
  <text x="590" y="564" font-family="Georgia, serif" font-size="16" fill="#111">Reste wegwischen.</text>
</svg>
