<svg xmlns="http://www.w3.org/2000/svg" width="900" height="646" viewBox="0 0 900 646">
  <!-- Tipp: erste-hilfe-allergischer-schock (Allergischer Schock / Anaphylaxie).
       Aussage: Der Adrenalin-Autoinjektor wird in die Aussenseite des
       Oberschenkels gedrueckt, sofort, egal ob die Person ihn selbst setzt
       oder geschultes Personal - der ORT bleibt bei jedem Alter derselbe,
       nur die Dosis aendert sich mit dem Alter.
       Begruendung: "Aussenseite des Oberschenkels" ist eine raeumliche
       Angabe. In Worten bleibt sie ungefaehr (vorne, seitlich, wo genau),
       im Bild ist die Stelle an einem Koerperumriss eindeutig zu zeigen.
       Die Regel (Ort, immer gleich, gross gezeichnet) steht damit klar
       neben der Ausnahme (Dosis je nach Alter, klein als Randspalte).
       Der Text markiert einen Satz ausdruecklich als das Wichtigste ("und
       vor allem"): der kurz zuvor erfolgte Kontakt mit einem bekannten
       Nahrungsmittel-Allergen oder ein Insektenstich. Dieser Satz steht
       deshalb im Bild und traegt als einziges Element die Signalfarbe. -->

  <rect width="900" height="646" fill="#faf9f6"/>

  <text x="40" y="44" font-family="Georgia, serif" font-size="26" fill="#111">Adrenalin-Autoinjektor: die Außenseite des Oberschenkels</text>

  <text x="40" y="74" font-family="Georgia, serif" font-size="18" fill="#d65a1a">Vor allem: kurz vorher Kontakt mit einem bekannten</text>
  <text x="40" y="96" font-family="Georgia, serif" font-size="18" fill="#d65a1a">Nahrungsmittel-Allergen oder ein Insektenstich.</text>

  <line x1="40" y1="112" x2="860" y2="112" stroke="#e6e2d6" stroke-width="2"/>

  <text x="40" y="142" font-family="Georgia, serif" font-size="19" fill="#111">Sie selbst oder geschultes Personal: so schnell wie möglich</text>
  <text x="40" y="166" font-family="Georgia, serif" font-size="19" fill="#111">in die Außenseite des Oberschenkels drücken.</text>

  <line x1="40" y1="182" x2="860" y2="182" stroke="#e6e2d6" stroke-width="1"/>

  <!-- ===================== Grosse Figur: WO gedrueckt wird ===================== -->
  <circle cx="200" cy="250" r="36" fill="#e6e2d6" stroke="#111" stroke-width="4"/>
  <rect x="186" y="282" width="28" height="20" fill="#e6e2d6" stroke="#111" stroke-width="4"/>
  <path d="M 140,300 L 260,300 L 248,410 L 152,410 Z" fill="#e6e2d6" stroke="#111" stroke-width="4" stroke-linejoin="round"/>

  <g fill="none" stroke-linecap="round">
    <path d="M140,306 L96,400" stroke="#111" stroke-width="24"/>
    <path d="M140,306 L96,400" stroke="#e6e2d6" stroke-width="18"/>
    <path d="M260,306 L304,400" stroke="#111" stroke-width="24"/>
    <path d="M260,306 L304,400" stroke="#e6e2d6" stroke-width="18"/>
    <path d="M178,410 L120,540" stroke="#111" stroke-width="30"/>
    <path d="M178,410 L120,540" stroke="#e6e2d6" stroke-width="23"/>
    <path d="M222,410 L280,540" stroke="#111" stroke-width="30"/>
    <path d="M222,410 L280,540" stroke="#e6e2d6" stroke-width="23"/>
  </g>

  <ellipse cx="120" cy="548" rx="24" ry="9" fill="#e6e2d6" stroke="#111" stroke-width="4"/>
  <ellipse cx="280" cy="548" rx="24" ry="9" fill="#e6e2d6" stroke="#111" stroke-width="4"/>

  <!-- Injektionsstelle: Aussenseite des rechten Oberschenkels -->
  <circle cx="255" cy="450" r="11" fill="#d9c98a" stroke="#111" stroke-width="3"/>
  <g stroke="#7a5a3e" stroke-width="2">
    <line x1="249" y1="450" x2="261" y2="450"/>
    <line x1="255" y1="444" x2="255" y2="456"/>
  </g>

  <line x1="255" y1="450" x2="380" y2="420" stroke="#5b7f96" stroke-width="2"/>
  <line x1="380" y1="420" x2="405" y2="305" stroke="#5b7f96" stroke-width="2"/>
  <text x="415" y="300" font-family="Georgia, serif" font-size="19" fill="#111">Außenseite</text>
  <text x="415" y="324" font-family="Georgia, serif" font-size="19" fill="#111">des Oberschenkels</text>

  <!-- ===================== Rechte Spalte: Ausnahme, klein ===================== -->
  <line x1="580" y1="195" x2="580" y2="560" stroke="#e6e2d6" stroke-width="2"/>

  <text x="610" y="222" font-family="Georgia, serif" font-size="19" fill="#111">Die Dosen:</text>
  <text x="610" y="244" font-family="Georgia, serif" font-size="16" fill="#5b7f96">Der Ort bleibt gleich.</text>

  <!-- Reihe 1: Kinder 1-5 Jahre -->
  <g fill="none" stroke-linecap="round">
    <path d="M630,266 L610,326" stroke="#111" stroke-width="14"/>
    <path d="M630,266 L610,326" stroke="#e6e2d6" stroke-width="10"/>
  </g>
  <circle cx="628" cy="292" r="5" fill="#d9c98a" stroke="#111" stroke-width="1.5"/>
  <line x1="631" y1="290" x2="648" y2="284" stroke="#5b7f96" stroke-width="1"/>
  <text x="650" y="280" font-family="Georgia, serif" font-size="16" fill="#111">Kinder, 1–5 Jahre</text>
  <text x="650" y="302" font-family="Georgia, serif" font-size="18" fill="#111">0,15 mg</text>

  <!-- Reihe 2: Kinder 6-12 Jahre -->
  <g fill="none" stroke-linecap="round">
    <path d="M635,366 L607,446" stroke="#111" stroke-width="18"/>
    <path d="M635,366 L607,446" stroke="#e6e2d6" stroke-width="13"/>
  </g>
  <circle cx="632" cy="400" r="6" fill="#d9c98a" stroke="#111" stroke-width="1.5"/>
  <line x1="636" y1="398" x2="648" y2="392" stroke="#5b7f96" stroke-width="1"/>
  <text x="650" y="396" font-family="Georgia, serif" font-size="16" fill="#111">Kinder, 6–12 Jahre</text>
  <text x="650" y="420" font-family="Georgia, serif" font-size="18" fill="#111">0,3 mg</text>

  <!-- Reihe 3: Erwachsene -->
  <g fill="none" stroke-linecap="round">
    <path d="M640,470 L603,560" stroke="#111" stroke-width="22"/>
    <path d="M640,470 L603,560" stroke="#e6e2d6" stroke-width="16"/>
  </g>
  <circle cx="636" cy="508" r="7" fill="#d9c98a" stroke="#111" stroke-width="1.5"/>
  <line x1="640" y1="505" x2="648" y2="500" stroke="#5b7f96" stroke-width="1"/>
  <text x="650" y="500" font-family="Georgia, serif" font-size="16" fill="#111">Erwachsene</text>
  <text x="650" y="524" font-family="Georgia, serif" font-size="18" fill="#111">0,5 mg</text>

  <text x="40" y="602" font-family="Georgia, serif" font-size="18" fill="#111">Ein Autoinjektor hat eine feste Menge, die sich nicht einstellen lässt:</text>
  <text x="40" y="626" font-family="Georgia, serif" font-size="18" fill="#111">man benutzt den, der da ist. Nach fünf Minuten ohne Besserung eine zweite Dosis.</text>
</svg>
