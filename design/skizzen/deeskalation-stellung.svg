<svg xmlns="http://www.w3.org/2000/svg" width="900" height="780" viewBox="0 0 900 780">
  <!-- Zum Tipp "Deeskalation: seitlich stehen, leise reden".
       Der Tipp zaehlt viele Punkte auf, aber nur einer ist GEOMETRIE: seitlich
       zur Person stehen, etwa im Winkel von 45 Grad, eine Armlaenge Abstand.
       Zwei Zahlen und eine Lage — das trifft Text schlecht und eine Aufsicht
       sofort. Deshalb nimmt sie die grosse Tafel ein, blass daneben die
       falsche Aufstellung: frontal und zu nah.
       Der Rest des Tipps ist eine Liste und bleibt eine Liste; im Bild stehen
       nur die Punkte, die eine HALTUNG beschreiben (Arme nicht verschraenken,
       leise reden, offene Fragen) und die vier Dinge, die man nicht tut. -->
  <rect width="900" height="780" fill="#faf9f6"/>
  <text x="40" y="46" font-family="Georgia, serif" font-size="28" fill="#111">Deeskalation: wo man steht, bevor man etwas sagt</text>

  <!-- ============ A: die Aufstellung, von oben ============ -->
  <text x="40" y="96" font-family="Georgia, serif" font-size="23" fill="#1d6b3a">Von oben gesehen</text>

  <!-- falsche Aufstellung, blass: frontal und zu nah -->
  <circle cx="420" cy="380" r="26" fill="none" stroke="#b9b4a6" stroke-width="4"/>
  <path d="M 394 380 l -14 0" stroke="#b9b4a6" stroke-width="4"/>
  <g stroke="#a3231a" stroke-width="5" fill="none">
    <circle cx="420" cy="308" r="22"/>
    <line x1="404" y1="292" x2="436" y2="324"/>
  </g>
  <text x="420" y="434" font-family="Georgia, serif" font-size="21" fill="#a3231a" text-anchor="middle">frontal und zu nah</text>

  <!-- die erregte Person -->
  <circle cx="250" cy="380" r="30" fill="#c9c4b4" stroke="#111" stroke-width="4"/>
  <path d="M 280 380 l 22 0" stroke="#111" stroke-width="5"/>
  <path d="M 302 380 l -10 -7 M 302 380 l -10 7" stroke="#111" stroke-width="5" fill="none"/>
  <text x="250" y="446" font-family="Georgia, serif" font-size="21" fill="#111" text-anchor="middle">die erregte Person</text>
  <text x="250" y="472" font-family="Georgia, serif" font-size="19" fill="#111" text-anchor="middle">(Blickrichtung →)</text>

  <!-- der Helfer: 45 Grad, eine Armlaenge -->
  <circle cx="378" cy="252" r="30" fill="#c9c4b4" stroke="#111" stroke-width="4"/>
  <text x="378" y="206" font-family="Georgia, serif" font-size="21" fill="#1d6b3a" text-anchor="middle">du</text>

  <!-- Abstandslinie -->
  <line x1="278" y1="358" x2="352" y2="278" stroke="#1d6b3a" stroke-width="3"/>
  <g stroke="#1d6b3a" stroke-width="3">
    <line x1="270" y1="350" x2="286" y2="366"/>
    <line x1="344" y1="270" x2="360" y2="286"/>
  </g>
  <text x="182" y="288" font-family="Georgia, serif" font-size="21" fill="#1d6b3a">eine Armlänge</text>
  <text x="182" y="314" font-family="Georgia, serif" font-size="21" fill="#1d6b3a">Abstand</text>
  <line x1="292" y1="296" x2="308" y2="322" stroke="#1d6b3a" stroke-width="2"/>

  <!-- Winkelbogen -->
  <path d="M 320 380 A 70 70 0 0 0 300 331" fill="none" stroke="#d65a1a" stroke-width="3"/>
  <text x="330" y="342" font-family="Georgia, serif" font-size="23" fill="#d65a1a">45°</text>

  <line x1="516" y1="112" x2="516" y2="500" stroke="#c9c4b4" stroke-width="3"/>

  <!-- ============ B: die Haltung ============ -->
  <text x="546" y="96" font-family="Georgia, serif" font-size="23" fill="#1d6b3a">Die Haltung</text>

  <g fill="#1d6b3a">
    <circle cx="558" cy="146" r="7"/>
    <circle cx="558" cy="216" r="7"/>
    <circle cx="558" cy="312" r="7"/>
    <circle cx="558" cy="356" r="7"/>
  </g>
  <text x="578" y="154" font-family="Georgia, serif" font-size="21" fill="#111">Ruhig und beherrscht bleiben,</text>
  <text x="578" y="180" font-family="Georgia, serif" font-size="21" fill="#111">nicht selbst emotional werden.</text>
  <text x="578" y="224" font-family="Georgia, serif" font-size="21" fill="#111">Nicht bedrohlich stehen — zum</text>
  <text x="578" y="250" font-family="Georgia, serif" font-size="21" fill="#111">Beispiel die Arme nicht</text>
  <text x="578" y="276" font-family="Georgia, serif" font-size="21" fill="#111">verschränken.</text>
  <text x="578" y="320" font-family="Georgia, serif" font-size="21" fill="#111">Leise und ruhig sprechen.</text>
  <text x="578" y="364" font-family="Georgia, serif" font-size="21" fill="#111">Offene Fragen stellen und</text>
  <text x="578" y="390" font-family="Georgia, serif" font-size="21" fill="#111">weiterreden lassen, bis sie Zeit</text>
  <text x="578" y="416" font-family="Georgia, serif" font-size="21" fill="#111">hatte, ruhiger zu werden.</text>

  <text x="546" y="464" font-family="Georgia, serif" font-size="21" fill="#1d6b3a">Klar sagen, dass sie weder sich</text>
  <text x="546" y="490" font-family="Georgia, serif" font-size="21" fill="#1d6b3a">noch anderen etwas antun darf.</text>

  <line x1="40" y1="528" x2="860" y2="528" stroke="#c9c4b4" stroke-width="3"/>

  <!-- ============ C: was man nicht tut ============ -->
  <text x="40" y="570" font-family="Georgia, serif" font-size="23" fill="#a3231a">Was man nicht tut</text>

  <g stroke="#a3231a" stroke-width="5" fill="none">
    <circle cx="58" cy="614" r="15"/><line x1="48" y1="604" x2="68" y2="624"/>
    <circle cx="58" cy="664" r="15"/><line x1="48" y1="654" x2="68" y2="674"/>
    <circle cx="470" cy="614" r="15"/><line x1="460" y1="604" x2="480" y2="624"/>
    <circle cx="470" cy="664" r="15"/><line x1="460" y1="654" x2="480" y2="674"/>
  </g>
  <text x="86" y="622" font-family="Georgia, serif" font-size="21" fill="#111">von oben herab behandeln</text>
  <text x="86" y="672" font-family="Georgia, serif" font-size="21" fill="#111">spöttisch werden</text>
  <text x="498" y="622" font-family="Georgia, serif" font-size="21" fill="#111">laut werden</text>
  <text x="498" y="672" font-family="Georgia, serif" font-size="21" fill="#111">ankündigen, was du selbst vorhast</text>

  <line x1="40" y1="704" x2="860" y2="704" stroke="#c9c4b4" stroke-width="3"/>
  <text x="40" y="740" font-family="Georgia, serif" font-size="21" fill="#111">Frag nach ihren Bezugspersonen und danach, was ihr sonst helfen könnte.</text>
  <text x="40" y="766" font-family="Georgia, serif" font-size="21" fill="#111">Unterschiedliche Meinungen darf man stehen lassen.</text>
</svg>
