<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560">
  <!-- Tipp erste-hilfe-offene-brustwunde, "Offene Brustwunde: nicht zudecken".
       Gezeigter Satz: "Bluetet es, druek neben der Oeffnung auf die blutende
       Stelle, die Oeffnung selbst bleibt frei, nichts hineinstopfen, nichts
       darueberlegen."
       Links: die Wunde bleibt als offene, gestrichelt umrandete Flaeche im
       Brustkorb sichtbar (kein Verband darauf), zwei Haende druecken links
       und rechts DANEBEN auf die Haut, nicht auf die Oeffnung selbst.
       Rechts, kleiner: der Fehler, den der Tipp benennt. Die Wunde ist dort
       komplett mit einer Auflage abgedeckt und mit X markiert, weil sich
       dann Luft im Brustkorb staut, siehe Text. Das ist die einzige Stelle
       mit Signalfarbe, weil dort der gefaehrliche Fehler liegt. -->
  <rect width="900" height="560" fill="#faf9f6"/>
  <text x="40" y="46" font-family="Georgia, serif" font-size="26" fill="#111">Offene Brustwunde: nicht zudecken</text>

  <line x1="560" y1="90" x2="560" y2="460" stroke="#5b7f96" stroke-width="1.5"/>

  <!-- ============ LINKS: richtig ============ -->
  <text x="40" y="112" font-family="Georgia, serif" font-size="19" fill="#5b7f96">Blutet es: daneben drücken</text>

  <!-- Kopf, Hals -->
  <circle cx="230" cy="150" r="36" fill="#faf9f6" stroke="#111" stroke-width="4"/>
  <line x1="230" y1="186" x2="230" y2="200" stroke="#111" stroke-width="6"/>

  <!-- Torso -->
  <rect x="120" y="200" width="220" height="240" rx="28" fill="#faf9f6" stroke="#111" stroke-width="4"/>

  <!-- Arme -->
  <path d="M 130 215 L 85 370" fill="none" stroke="#111" stroke-width="16" stroke-linecap="round"/>
  <path d="M 330 215 L 375 370" fill="none" stroke="#111" stroke-width="16" stroke-linecap="round"/>

  <!-- Wunde: offen, kein Verband, gestrichelter Rand -->
  <ellipse cx="230" cy="300" rx="36" ry="46" fill="#faf9f6" stroke="#111" stroke-width="3" stroke-dasharray="7 6"/>

  <!-- Haende, links und rechts DANEBEN auf der Haut -->
  <ellipse cx="160" cy="300" rx="26" ry="20" fill="#5b7f96" stroke="#111" stroke-width="3"/>
  <ellipse cx="300" cy="300" rx="26" ry="20" fill="#5b7f96" stroke="#111" stroke-width="3"/>
  <path d="M 160 262 L 160 278" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round"/>
  <path d="M 154 274 L 160 280 L 166 274" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 300 262 L 300 278" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round"/>
  <path d="M 294 274 L 300 280 L 306 274" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="160" y="252" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#111">drücken</text>
  <text x="300" y="252" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#111">drücken</text>

  <text x="230" y="372" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#111">Öffnung bleibt frei</text>

  <text x="40" y="500" font-family="Georgia, serif" font-size="16" fill="#111">Eine offene Brustwunde wird nicht abgedeckt und nicht zugedrückt – sie bleibt frei.</text>
  <text x="40" y="524" font-family="Georgia, serif" font-size="16" fill="#111">Blutet es, wird direkt daneben gedrückt, bis der Rettungsdienst die Person übernimmt.</text>

  <!-- ============ RECHTS: so nicht ============ -->
  <text x="610" y="112" font-family="Georgia, serif" font-size="19" fill="#5b7f96">So nicht</text>

  <circle cx="680" cy="150" r="24" fill="#faf9f6" stroke="#111" stroke-width="3"/>
  <line x1="680" y1="174" x2="680" y2="190" stroke="#111" stroke-width="5"/>
  <rect x="610" y="190" width="140" height="160" rx="20" fill="#faf9f6" stroke="#111" stroke-width="3"/>
  <path d="M 620 200 L 590 320" fill="none" stroke="#111" stroke-width="10" stroke-linecap="round"/>
  <path d="M 740 200 L 770 320" fill="none" stroke="#111" stroke-width="10" stroke-linecap="round"/>

  <!-- Wunde darunter, jetzt komplett abgedeckt -->
  <ellipse cx="680" cy="270" rx="24" ry="30" fill="#faf9f6" stroke="#111" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="645" y="235" width="70" height="80" rx="10" fill="#5b7f96" stroke="#111" stroke-width="3"/>

  <!-- die eine Stelle mit Signalfarbe: der gefaehrliche Fehler -->
  <path d="M 650 240 L 710 310 M 710 240 L 650 310" fill="none" stroke="#d65a1a" stroke-width="6" stroke-linecap="round"/>

  <text x="610" y="392" font-family="Georgia, serif" font-size="16" fill="#d65a1a">Luft staut sich</text>
  <text x="610" y="414" font-family="Georgia, serif" font-size="16" fill="#d65a1a">im Brustkorb</text>
</svg>
