<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <!-- Zum Tipp erste-hilfe-stabile-seitenlage, "Stabile Seitenlage: wann und
       wann nicht".
       Gezeigte Aussage: Die Seitenlage ist keine einmalige Entscheidung,
       sondern haengt an Bedingungen, die sich waehrend der Betreuung aendern
       koennen - reagiert die Person nicht und atmet sie ausreichend, kommt
       sie in die Seitenlage und wird weiter beobachtet; hoert die Atmung auf,
       wird sie ZUERST WIEDER AUF DEN RUECKEN GEDREHT und erst dann gedrueckt;
       nach Sturz, Unfall oder Einklemmung wird sie gar nicht erst gedreht.
       Am 17.08.2026 berichtigt: Die Zeichnung stammte aus der Zeit vor der
       Korrektur des Tipps und liess das Zurueckdrehen weg. Auf der Seite laesst
       sich nicht druecken - wer dem Bild folgte, verlor genau die Zeit, um die
       es geht.
       Begruendung: Der Text reiht mehrere Weichen in einem Fliesstext
       aneinander, das ist schwer zu behalten. Als Ablaufplan mit Pfeilen wird
       sofort sichtbar, was wann zu tun ist. Die Signalfarbe sitzt einzig bei
       "NICHT Seitenlage", denn das ist die einzige GROSSSCHREIBUNG im
       Originaltext - dort setzt der Tipp selbst sein Ausrufezeichen. -->
  <rect width="900" height="520" fill="#faf9f6"/>
  <text x="40" y="45" font-family="Georgia, serif" font-size="26" fill="#111">Stabile Seitenlage: wann und wann nicht</text>

  <line x1="600" y1="76" x2="600" y2="452" stroke="#5b7f96" stroke-width="1.5"/>

  <!-- ============ LINKS: der Ablauf (die Regel, gross) ============ -->

  <!-- Einstiegsbedingungen -->
  <rect x="40" y="78" width="240" height="46" rx="14" fill="#e6e2d6" stroke="#111" stroke-width="3"/>
  <text x="60" y="107" font-family="Georgia, serif" font-size="18" fill="#111">reagiert nicht</text>

  <rect x="300" y="78" width="260" height="46" rx="14" fill="#e6e2d6" stroke="#111" stroke-width="3"/>
  <text x="320" y="107" font-family="Georgia, serif" font-size="18" fill="#111">atmet ausreichend</text>

  <line x1="160" y1="124" x2="290" y2="150" stroke="#111" stroke-width="2.5"/>
  <line x1="430" y1="124" x2="290" y2="150" stroke="#111" stroke-width="2.5"/>
  <line x1="290" y1="150" x2="290" y2="172" stroke="#111" stroke-width="2.5"/>
  <polygon points="290,178 284,166 296,166" fill="#111"/>

  <!-- Ergebnis: stabile Seitenlage (die Regel, gross und deutlich gefuellt) -->
  <rect x="40" y="180" width="520" height="92" rx="16" fill="#d9c98a" stroke="#111" stroke-width="4"/>
  <g transform="translate(58,192)">
    <!-- Figur: runder Kopf, Ruecken/Rumpf, gestrecktes unteres Bein und
         angewinkeltes oberes Bein - jeder Koerperteil eine gefuellte
         Flaeche mit Umriss, keine Striche als Gliedmassen. -->
    <circle cx="18" cy="30" r="14" fill="#7a5a3e" stroke="#111" stroke-width="2.5"/>
    <path d="M 30 22 L 66 18 Q 76 20 76 30 L 74 40 Q 68 48 56 48 L 32 46
             Q 26 38 30 22 Z"
          fill="#7a5a3e" stroke="#111" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 62 40 L 112 44 L 112 52 L 62 48 Z"
          fill="#7a5a3e" stroke="#111" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 66 28 L 98 20 L 104 50 L 94 52 L 88 32 L 66 34 Z"
          fill="#7a5a3e" stroke="#111" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
  <text x="190" y="236" font-family="Georgia, serif" font-size="28" fill="#111">Stabile Seitenlage</text>

  <line x1="300" y1="272" x2="300" y2="294" stroke="#111" stroke-width="2.5"/>
  <polygon points="300,300 294,288 306,288" fill="#111"/>

  <!-- Weiter beobachten (laeuft, solange die Person so liegt) -->
  <rect x="40" y="300" width="520" height="54" rx="12" fill="#e6e2d6" stroke="#111" stroke-width="3"/>
  <text x="60" y="332" font-family="Georgia, serif" font-size="16" fill="#111">weiter prüfen: Bewusstsein, Atmung, Lebenszeichen</text>
  <path d="M 500 302 C 538 294 550 316 533 327" fill="none" stroke="#5b7f96" stroke-width="2.5"/>
  <polygon points="533,327 521,323 528,335" fill="#5b7f96"/>

  <line x1="300" y1="354" x2="300" y2="376" stroke="#111" stroke-width="2.5"/>
  <polygon points="300,382 294,370 306,370" fill="#111"/>
  <text x="316" y="372" font-family="Georgia, serif" font-size="16" fill="#111">Atmung setzt aus</text>

  <!-- Sofortmassnahme, wenn die Atmung aussetzt -->
  <rect x="40" y="384" width="520" height="64" rx="14" fill="#d9c98a" stroke="#111" stroke-width="4"/>
  <text x="60" y="410" font-family="Georgia, serif" font-size="20" fill="#111">ZUERST auf den Rücken drehen,</text>
  <text x="60" y="436" font-family="Georgia, serif" font-size="20" fill="#111">dann Herzdruckmassage</text>

  <text x="40" y="470" font-family="Georgia, serif" font-size="17" fill="#111">Reagiert nicht, atmet ausreichend: stabile Seitenlage, weiter beobachten.</text>
  <text x="40" y="496" font-family="Georgia, serif" font-size="17" fill="#111">Sturz aus Höhe, Verkehrs- oder Sportunfall, Einklemmung: nicht drehen – siehe eigener Tipp.</text>

  <!-- ============ RECHTS: die Ausnahme (klein) ============ -->
  <text x="620" y="100" font-family="Georgia, serif" font-size="18" fill="#111" font-weight="bold">Ausnahme</text>

  <text x="620" y="134" font-family="Georgia, serif" font-size="16" fill="#111">Sturz aus Höhe</text>
  <text x="620" y="166" font-family="Georgia, serif" font-size="16" fill="#111">Verkehrs- oder Sportunfall</text>
  <text x="620" y="198" font-family="Georgia, serif" font-size="16" fill="#111">Person eingeklemmt</text>

  <line x1="700" y1="214" x2="700" y2="236" stroke="#111" stroke-width="2.5"/>
  <polygon points="700,242 694,230 706,230" fill="#111"/>

  <rect x="630" y="244" width="210" height="54" rx="10" fill="#e6e2d6" stroke="#111" stroke-width="3"/>
  <text x="650" y="277" font-family="Georgia, serif" font-size="19" fill="#d65a1a">NICHT Seitenlage</text>

  <text x="630" y="330" font-family="Georgia, serif" font-size="16" fill="#5b7f96">siehe Tipp</text>
  <text x="630" y="354" font-family="Georgia, serif" font-size="16" fill="#5b7f96">„Wirbelsäulenverletzung“</text>
</svg>
