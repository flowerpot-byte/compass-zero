<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1386" viewBox="0 0 900 1386">
  <!-- Zum Tipp "Sturm: das Auto ist kein Schutz".
       Der Tipp nennt selbst die Verwechslung, die am meisten kostet, und sie
       ist eine Gegenueberstellung: Beim Gewitter ist das Auto gut, bei Sturm
       und Orkan nicht. Beides steht deshalb als zwei Kaesten nebeneinander,
       gruen gegen rot. Wer nur den Gewitterrat kennt, macht genau hier den
       Fehler, und beide Wetterlagen treten oft zusammen auf.
       Die vier Windstufen sind eine Leiter und deshalb als Treppe
       gezeichnet: Jeder Balken faengt dort an, wo der vorige aufhoert, und
       man sieht die Steigerung statt vier Zahlenpaare zu lesen.
       Der Massstab stimmt: 70 bis 140 km/h ueber 560 Bildpunkte, also
       8 Punkte je km/h; 75 km/h stehen bei x=270, 133 bei x=734.
       Der rote Satz unten ist der einzige im Tipp, der eine Abwaegung
       entscheidet und nicht nur beschreibt: Ist der Sturm da, bleibt das
       Zeug draussen. Deshalb steht er gross. -->
  <rect width="900" height="1386" fill="#faf9f6"/>
  <text x="40" y="46" font-family="Georgia, serif" font-size="28" fill="#111">Sturm: das Auto ist kein Schutz</text>

  <!-- ============ A: die Verwechslung ============ -->
  <text x="40" y="96" font-family="Georgia, serif" font-size="23" fill="#a3231a">Die Verwechslung, die am meisten kostet</text>

  <rect x="40" y="130" width="400" height="200" rx="10" fill="none" stroke="#1d6b3a" stroke-width="3"/>
  <text x="62" y="168" font-family="Georgia, serif" font-size="23" fill="#1d6b3a">Gewitter</text>
  <text x="62" y="204" font-family="Georgia, serif" font-size="21" fill="#111">Das Auto ist ein guter Platz.</text>
  <text x="62" y="230" font-family="Georgia, serif" font-size="21" fill="#111">Das Metall leitet den Blitz</text>
  <text x="62" y="256" font-family="Georgia, serif" font-size="21" fill="#111">außen vorbei.</text>

  <rect x="460" y="130" width="400" height="200" rx="10" fill="none" stroke="#a3231a" stroke-width="3"/>
  <text x="482" y="168" font-family="Georgia, serif" font-size="23" fill="#a3231a">Sturm und Orkan</text>
  <text x="482" y="204" font-family="Georgia, serif" font-size="21" fill="#111">Das Auto ist KEIN Schutz. Ein</text>
  <text x="482" y="230" font-family="Georgia, serif" font-size="21" fill="#111">Fahrzeug kann durch den Wind</text>
  <text x="482" y="256" font-family="Georgia, serif" font-size="21" fill="#111">aus der Spur geworfen werden.</text>
  <text x="482" y="282" font-family="Georgia, serif" font-size="21" fill="#111">Wer im Sturm unterwegs ist,</text>
  <text x="482" y="308" font-family="Georgia, serif" font-size="21" fill="#111">sucht ein FESTES GEBÄUDE auf.</text>

  <text x="40" y="370" font-family="Georgia, serif" font-size="21" fill="#111">Beide Wetterlagen treten oft zusammen auf, und der Rat fürs Gewitter ist</text>
  <text x="40" y="396" font-family="Georgia, serif" font-size="21" fill="#111">allgemein bekannt. Deshalb ist das die Verwechslung, die am meisten kostet.</text>

  <line x1="40" y1="432" x2="860" y2="432" stroke="#c9c4b4" stroke-width="3"/>

  <!-- ============ B: die vier Stufen ============ -->
  <text x="40" y="472" font-family="Georgia, serif" font-size="23" fill="#1d6b3a">Wie stark ist stark? Die Einteilung nach Windgeschwindigkeit</text>

  <rect x="270" y="520" width="104" height="30" fill="#e8eef2" stroke="#111" stroke-width="3"/>
  <text x="40" y="541" font-family="Georgia, serif" font-size="19" fill="#111">Sturm</text>
  <text x="386" y="541" font-family="Georgia, serif" font-size="19" fill="#111">75 bis 88 km/h</text>

  <rect x="382" y="560" width="104" height="30" fill="#c9c4b4" stroke="#111" stroke-width="3"/>
  <text x="40" y="581" font-family="Georgia, serif" font-size="19" fill="#111">schwerer Sturm</text>
  <text x="498" y="581" font-family="Georgia, serif" font-size="19" fill="#111">89 bis 102 km/h</text>

  <rect x="494" y="600" width="112" height="30" fill="#d65a1a" stroke="#111" stroke-width="3"/>
  <text x="40" y="621" font-family="Georgia, serif" font-size="19" fill="#111">orkanartiger Sturm</text>
  <text x="618" y="621" font-family="Georgia, serif" font-size="19" fill="#111">103 bis 117 km/h</text>

  <rect x="614" y="640" width="120" height="30" fill="#a3231a" stroke="#111" stroke-width="3"/>
  <text x="40" y="661" font-family="Georgia, serif" font-size="19" fill="#a3231a">Orkan</text>
  <text x="746" y="661" font-family="Georgia, serif" font-size="19" fill="#a3231a">118 bis 133</text>

  <line x1="230" y1="684" x2="790" y2="684" stroke="#111" stroke-width="2"/>
  <g stroke="#111" stroke-width="2">
    <line x1="230" y1="684" x2="230" y2="692"/><line x1="390" y1="684" x2="390" y2="692"/>
    <line x1="550" y1="684" x2="550" y2="692"/><line x1="710" y1="684" x2="710" y2="692"/>
  </g>
  <g font-family="Georgia, serif" font-size="19" fill="#111" text-anchor="middle">
    <text x="230" y="710">70</text><text x="390" y="710">90</text>
    <text x="550" y="710">110</text><text x="710" y="710">130 km/h</text>
  </g>

  <text x="40" y="750" font-family="Georgia, serif" font-size="21" fill="#a3231a">Orkan: 118 bis 133 Stundenkilometer — so schnell wie ein Auto auf der Autobahn.</text>

  <line x1="40" y1="786" x2="860" y2="786" stroke="#c9c4b4" stroke-width="3"/>

  <!-- ============ C: waehrend des Sturms ============ -->
  <text x="40" y="826" font-family="Georgia, serif" font-size="23" fill="#a3231a">Während des Sturms wird nicht hinausgegangen</text>
  <text x="40" y="864" font-family="Georgia, serif" font-size="21" fill="#111">Lässt es sich nicht vermeiden, dann auf keinen Fall in den WALD. Herabfallende</text>
  <text x="40" y="890" font-family="Georgia, serif" font-size="21" fill="#111">Äste und stürzende Bäume sind die häufigste Verletzungsursache. Dasselbe gilt</text>
  <text x="40" y="916" font-family="Georgia, serif" font-size="21" fill="#111">für alles, was von Gebäuden fallen kann: Dachziegel, Blumenkästen, Antennen,</text>
  <text x="40" y="942" font-family="Georgia, serif" font-size="21" fill="#111">lose Bleche.</text>

  <line x1="40" y1="978" x2="860" y2="978" stroke="#c9c4b4" stroke-width="3"/>

  <!-- ============ D: vorher sichern ============ -->
  <text x="40" y="1018" font-family="Georgia, serif" font-size="23" fill="#1d6b3a">Das Sichern geschieht vorher, nicht mittendrin</text>
  <text x="40" y="1056" font-family="Georgia, serif" font-size="21" fill="#111">Alles, was der Wind mitnehmen kann, kommt hinein oder wird festgemacht:</text>
  <text x="40" y="1082" font-family="Georgia, serif" font-size="21" fill="#111">Gartenmöbel, Sonnenschirme, Blumenkästen, Mülltonnen, Leitern, Planen. Dabei</text>
  <text x="40" y="1108" font-family="Georgia, serif" font-size="21" fill="#111">nicht dorthin stellen, wo ein weggewehter Gegenstand treffen kann.</text>

  <text x="40" y="1148" font-family="Georgia, serif" font-size="23" fill="#a3231a">Ist der Sturm schon da, bleibt das Zeug draußen — nichts davon ist</text>
  <text x="40" y="1176" font-family="Georgia, serif" font-size="23" fill="#a3231a">einen Menschen wert.</text>

  <text x="40" y="1212" font-family="Georgia, serif" font-size="21" fill="#111">Drinnen: Fenster, Türen und Rollläden schließen, von großen Fensterflächen</text>
  <text x="40" y="1238" font-family="Georgia, serif" font-size="21" fill="#111">wegbleiben. Wer ein Dachgeschoss hat, geht bei schwerem Sturm tiefer.</text>

  <text x="40" y="1278" font-family="Georgia, serif" font-size="19" fill="#111">Einordnung dieses Pakets, nicht aus der Quelle: Nach dem Sturm ist es nicht vorbei.</text>
  <text x="40" y="1302" font-family="Georgia, serif" font-size="19" fill="#111">Angebrochene Äste hängen noch und fallen später, beschädigte Dächer verlieren weiter</text>
  <text x="40" y="1326" font-family="Georgia, serif" font-size="19" fill="#111">Ziegel, und heruntergerissene Leitungen können Strom führen — an eine am Boden</text>
  <text x="40" y="1350" font-family="Georgia, serif" font-size="19" fill="#111">liegende Leitung wird nicht herangegangen.</text>
</svg>
