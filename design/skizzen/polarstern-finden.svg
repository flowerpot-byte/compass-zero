  <text x="143" y="156" font-family="Georgia, serif" font-size="23" fill="#a3231a" text-anchor="start">Polarstern</text>
  <line x1="168" y1="233" x2="258" y2="202" stroke="#d65a1a" stroke-width="2"/>
  <text x="268" y="196" font-family="Georgia, serif" font-size="21" fill="#d65a1a" text-anchor="start">fünfmal</text>
  <text x="268" y="222" font-family="Georgia, serif" font-size="21" fill="#d65a1a" text-anchor="start">diesen Abstand</text>
  <line x1="210" y1="349" x2="104" y2="384" stroke="#d65a1a" stroke-width="2"/>
  <text x="40" y="406" font-family="Georgia, serif" font-size="21" fill="#d65a1a" text-anchor="start">dieser Abstand: die beiden dicken</text>
  <text x="40" y="432" font-family="Georgia, serif" font-size="21" fill="#d65a1a" text-anchor="start">Sterne auf der Kante OHNE Griff</text>
  <text x="393" y="299" font-family="Georgia, serif" font-size="21" fill="#111" text-anchor="middle">Großer Wagen</text>
  <line x1="466" y1="88" x2="466" y2="462" stroke="#c9c4b4" stroke-width="3"/>
  <text x="492" y="100" font-family="Georgia, serif" font-size="23" fill="#1d6b3a" text-anchor="start">Über die Kassiopeia</text>
  <line x1="734" y1="331" x2="789" y2="139" stroke="#1d6b3a" stroke-width="3" stroke-dasharray="9 7"/>
  <line x1="724" y1="328" x2="743" y2="334" stroke="#1d6b3a" stroke-width="3"/>
