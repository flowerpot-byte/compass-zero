  <text x="761" y="147" font-family="Georgia, serif" font-size="23" fill="#a3231a" text-anchor="end">Polarstern</text>
  <line x1="761" y1="235" x2="584" y2="202" stroke="#1d6b3a" stroke-width="2"/>
  <text x="574" y="196" font-family="Georgia, serif" font-size="21" fill="#1d6b3a" text-anchor="end">fünfmal</text>
  <text x="574" y="222" font-family="Georgia, serif" font-size="21" fill="#1d6b3a" text-anchor="end">diese Höhe</text>
  <text x="606" y="286" font-family="Georgia, serif" font-size="21" fill="#1d6b3a" text-anchor="end">Höhe</text>
  <text x="606" y="312" font-family="Georgia, serif" font-size="21" fill="#1d6b3a" text-anchor="end">des W</text>
  <line x1="734" y1="331" x2="700" y2="366" stroke="#1d6b3a" stroke-width="2"/>
  <text x="700" y="388" font-family="Georgia, serif" font-size="21" fill="#1d6b3a" text-anchor="middle">diesen Winkel halbieren</text>
  <text x="640" y="281" font-family="Georgia, serif" font-size="21" fill="#111" text-anchor="start">Kassiopeia</text>
  <text x="492" y="406" font-family="Georgia, serif" font-size="21" fill="#1d6b3a" text-anchor="start">Die flachere Seite des W zeigt zum Pol.</text>
  <text x="492" y="432" font-family="Georgia, serif" font-size="21" fill="#1d6b3a" text-anchor="start">Ihr Scheitel ist der Ansatzpunkt.</text>
  <line x1="40" y1="486" x2="860" y2="486" stroke="#c9c4b4" stroke-width="3"/>
  <text x="40" y="528" font-family="Georgia, serif" font-size="23" fill="#1d6b3a" text-anchor="start">Warum man beide kennt</text>
  <circle cx="176" cy="664" r="82" fill="none" stroke="#c9c4b4" stroke-width="3" stroke-dasharray="7 7"/>
  <circle cx="176" cy="664" r="8" fill="#a3231a"/>
  <text x="192" y="670" font-family="Georgia, serif" font-size="21" fill="#a3231a" text-anchor="start">Pol</text>
  <circle cx="124" cy="727" r="9" fill="#111"/>
  <circle cx="228" cy="601" r="9" fill="#111"/>
  <text x="112" y="755" font-family="Georgia, serif" font-size="21" fill="#111" text-anchor="end">Wagen</text>
  <text x="242" y="589" font-family="Georgia, serif" font-size="21" fill="#111" text-anchor="start">Kassiopeia</text>
  <path d="M 278 650 A 104 104 0 0 0 246 588" fill="none" stroke="#d65a1a" stroke-width="4"/>
  <path d="M 246 588 l 20 1 M 246 588 l 2 20" fill="none" stroke="#d65a1a" stroke-width="4"/>
  <text x="40" y="800" font-family="Georgia, serif" font-size="21" fill="#111" text-anchor="start">Sie stehen einander gegenüber und drehen</text>
  <text x="40" y="826" font-family="Georgia, serif" font-size="21" fill="#111" text-anchor="start">sich gegen den Uhrzeigersinn um den Pol.</text>
  <text x="40" y="852" font-family="Georgia, serif" font-size="21" fill="#111" text-anchor="start">Steht eines tief oder im Dunst, steht das</text>
  <text x="40" y="878" font-family="Georgia, serif" font-size="21" fill="#111" text-anchor="start">andere hoch.</text>
  <line x1="466" y1="510" x2="466" y2="890" stroke="#c9c4b4" stroke-width="3"/>
  <text x="492" y="528" font-family="Georgia, serif" font-size="23" fill="#1d6b3a" text-anchor="start">Wo am Himmel man ansetzt</text>
  <line x1="540" y1="712" x2="760" y2="712" stroke="#111" stroke-width="4"/>
  <text x="540" y="740" font-family="Georgia, serif" font-size="21" fill="#111" text-anchor="start">Horizont</text>
  <line x1="540" y1="712" x2="625" y2="611" stroke="#a3231a" stroke-width="4"/>
  <circle cx="625" cy="611" r="8" fill="#a3231a"/>
  <text x="639" y="607" font-family="Georgia, serif" font-size="21" fill="#a3231a" text-anchor="start">Polarstern</text>
  <line x1="540" y1="712" x2="540" y2="562" stroke="#c9c4b4" stroke-width="3" stroke-dasharray="6 6"/>
  <text x="516" y="552" font-family="Georgia, serif" font-size="19" fill="#c9c4b4" text-anchor="start">senkrecht über dir</text>
  <path d="M 598 712 A 58 58 0 0 1 577 668" fill="none" stroke="#a3231a" stroke-width="3"/>
  <text x="610" y="686" font-family="Georgia, serif" font-size="21" fill="#a3231a" text-anchor="start">rund 50°</text>
  <text x="492" y="800" font-family="Georgia, serif" font-size="21" fill="#111" text-anchor="start">Der Polarstern steht so hoch über dem</text>
  <text x="492" y="826" font-family="Georgia, serif" font-size="21" fill="#111" text-anchor="start">Horizont, wie weit man nördlich des</text>
  <text x="492" y="852" font-family="Georgia, serif" font-size="21" fill="#111" text-anchor="start">Äquators ist — in Mitteleuropa rund 50°.</text>
  <text x="492" y="878" font-family="Georgia, serif" font-size="21" fill="#111" text-anchor="start">So sucht man nur einen Streifen ab.</text>
  <line x1="40" y1="900" x2="860" y2="900" stroke="#c9c4b4" stroke-width="3"/>
  <text x="40" y="928" font-family="Georgia, serif" font-size="21" fill="#1d6b3a" text-anchor="start">Hat man ihn: vom Polarstern senkrecht zum Boden — dort ist Norden.</text>
</svg>
