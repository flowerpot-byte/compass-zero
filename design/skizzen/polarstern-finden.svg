  <circle cx="309" cy="275" r="6" fill="#111"/>
  <circle cx="350" cy="265" r="6" fill="#111"/>
  <circle cx="397" cy="267" r="6" fill="#111"/>
  <circle cx="221" cy="318" r="9" fill="#d65a1a"/>
