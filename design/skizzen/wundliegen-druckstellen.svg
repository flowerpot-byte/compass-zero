<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620">
  <!-- Zum Tipp "medizin-wundliegen" (Wer lange liegt: alle zwei Stunden drehen).
       Gezeigte Aussage: WO der Druck entsteht - naemlich punktuell dort, wo
       Knochen dicht unter der Haut auf die harte Unterlage trifft, nicht
       flaechig am ganzen Ruecken - und was das Umlagern daran aendert: die
       alten Druckpunkte werden frei, andere Stellen tragen jetzt das Gewicht.
       Das ist rein raeumlich und laesst sich in Worten schlecht fassen, im
       Bild aber direkt vergleichen. Aufzaehlungen aus dem Text (Rhythmus fuer
       Bewusstlose, Luecke bei der Wundbehandlung) werden bewusst NICHT
       abgemalt, weil dort kein raeumlicher Unterschied zu zeigen ist. -->
  <rect width="900" height="620" fill="#faf9f6"/>

  <text x="40" y="44" font-family="Georgia, serif" font-size="26" fill="#111">Wundliegen: Der Druck wandert, wenn man dreht</text>
  <text x="40" y="76" font-family="Georgia, serif" font-size="18" fill="#5b7f96">Druck entsteht dort, wo Knochen dicht unter der Haut auf die Unterlage trifft.</text>

  <!-- Panel A: Rueckenlage, seit Stunden nicht bewegt -->
  <text x="40" y="118" font-family="Georgia, serif" font-size="19" fill="#111">Vorher: liegt seit Stunden auf dem Rücken</text>

  <line x1="60" y1="312" x2="860" y2="312" stroke="#111" stroke-width="3"/>
  <g stroke="#111" stroke-width="2" opacity="0.35">
    <line x1="90" y1="312" x2="76" y2="328"/><line x1="190" y1="312" x2="176" y2="328"/>
    <line x1="290" y1="312" x2="276" y2="328"/><line x1="390" y1="312" x2="376" y2="328"/>
    <line x1="490" y1="312" x2="476" y2="328"/><line x1="590" y1="312" x2="576" y2="328"/>
    <line x1="690" y1="312" x2="676" y2="328"/><line x1="790" y1="312" x2="776" y2="328"/>
  </g>

  <circle cx="140" cy="280" r="32" fill="#e6e2d6" stroke="#111" stroke-width="4"/>
  <path d="M 186 312 Q 210 257 280 250 L 410 250 Q 460 257 470 312 Z"
        fill="#e6e2d6" stroke="#111" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 470 312 L 473 286 L 610 289 L 618 312 Z"
        fill="#c9c4b4" stroke="#111" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 618 312 L 621 291 L 700 293 L 710 312 Z"
        fill="#e6e2d6" stroke="#111" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 710 312 L 732 312 Q 742 296 728 281 L 712 286 Z"
        fill="#e6e2d6" stroke="#111" stroke-width="4" stroke-linejoin="round"/>

  <!-- Druckpunkte: dort, wo Knochen (Hinterkopf, Schulterblatt, Kreuzbein, Ferse)
       nah unter der Haut liegen und auf die Unterlage treffen -->
  <circle cx="140" cy="312" r="9" fill="#7a5a3e" stroke="#111" stroke-width="2"/>
  <circle cx="270" cy="312" r="9" fill="#7a5a3e" stroke="#111" stroke-width="2"/>
  <circle cx="465" cy="312" r="9" fill="#d65a1a" stroke="#111" stroke-width="2"/>
  <circle cx="722" cy="312" r="9" fill="#7a5a3e" stroke="#111" stroke-width="2"/>

  <g stroke="#5b7f96" stroke-width="2">
    <line x1="140" y1="321" x2="140" y2="336"/>
    <line x1="270" y1="321" x2="270" y2="336"/>
    <line x1="465" y1="321" x2="465" y2="336"/>
    <line x1="722" y1="321" x2="722" y2="336"/>
  </g>
  <text x="140" y="354" font-family="Georgia, serif" font-size="16" fill="#5b7f96" text-anchor="middle">Hinterkopf</text>
  <text x="270" y="354" font-family="Georgia, serif" font-size="16" fill="#5b7f96" text-anchor="middle">Schulterblatt</text>
  <text x="465" y="354" font-family="Georgia, serif" font-size="16" fill="#d65a1a" text-anchor="middle">Kreuzbein</text>
  <text x="722" y="354" font-family="Georgia, serif" font-size="16" fill="#5b7f96" text-anchor="middle">Ferse</text>

  <!-- Pfeil: Umlagern -->
  <line x1="200" y1="372" x2="200" y2="405" stroke="#111" stroke-width="4"/>
  <path d="M 188 399 L 200 417 L 212 399 Z" fill="#111"/>
  <text x="225" y="397" font-family="Georgia, serif" font-size="20" fill="#111">alle zwei Stunden drehen</text>

  <!-- Panel B: nach dem Umlagern -->
  <text x="40" y="440" font-family="Georgia, serif" font-size="19" fill="#111">Nachher: auf die Seite gedreht</text>
  <text x="40" y="460" font-family="Georgia, serif" font-size="16" fill="#5b7f96">Andere Stellen tragen jetzt das Gewicht, das Kreuzbein ist frei.</text>

  <line x1="60" y1="572" x2="860" y2="572" stroke="#111" stroke-width="3"/>
  <g stroke="#111" stroke-width="2" opacity="0.35">
    <line x1="90" y1="572" x2="76" y2="588"/><line x1="190" y1="572" x2="176" y2="588"/>
    <line x1="290" y1="572" x2="276" y2="588"/><line x1="390" y1="572" x2="376" y2="588"/>
    <line x1="490" y1="572" x2="476" y2="588"/><line x1="590" y1="572" x2="576" y2="588"/>
    <line x1="690" y1="572" x2="676" y2="588"/><line x1="790" y1="572" x2="776" y2="588"/>
  </g>

  <!-- Die Seitenlage war in der ersten Fassung fast dieselbe Silhouette wie
       die Rueckenlage: gleiche flache Huegel, nur andere Beschriftungen. Damit
       stand die Kernaussage nur in den Worten und nicht im Bild. Jetzt ist die
       Seitenlage als HALTUNG erkennbar - hoehere, kuerzere Schulter,
       angezogenes Bein - und vor allem: der Koerper beruehrt die Unterlage
       zwischen Schulter und Huefte gar nicht mehr. Diese Luecke IST die
       Aussage. -->
  <circle cx="150" cy="540" r="32" fill="#e6e2d6" stroke="#111" stroke-width="4"/>

  <!-- Rumpf: Schulter oben, Taille frei ueber der Unterlage -->
  <path d="M 255 572 C 250 508 290 480 340 478 C 400 476 438 496 500 572
           C 450 560 400 548 380 546 C 340 542 290 552 255 572 Z"
        fill="#e6e2d6" stroke="#111" stroke-width="4" stroke-linejoin="round"/>

  <!-- angezogenes Bein: Oberschenkel hoch zum Knie, Unterschenkel herunter -->
  <path d="M 500 572 C 520 520 570 492 620 494 C 668 496 692 534 700 572
           C 676 540 650 522 620 522 C 578 522 540 544 500 572 Z"
        fill="#e6e2d6" stroke="#111" stroke-width="4" stroke-linejoin="round"/>

  <!-- Neue Druckpunkte: das Kreuzbein ist nicht mehr dabei -->
  <circle cx="150" cy="572" r="9" fill="#7a5a3e" stroke="#111" stroke-width="2"/>
  <circle cx="255" cy="572" r="9" fill="#7a5a3e" stroke="#111" stroke-width="2"/>
  <circle cx="500" cy="572" r="9" fill="#7a5a3e" stroke="#111" stroke-width="2"/>
  <circle cx="700" cy="572" r="9" fill="#7a5a3e" stroke="#111" stroke-width="2"/>

  <!-- Die freie Stelle: dort lag eben noch das ganze Gewicht -->
  <circle cx="380" cy="572" r="9" fill="#faf9f6" stroke="#111" stroke-width="2" stroke-dasharray="3 2"/>

  <g stroke="#5b7f96" stroke-width="2">
    <line x1="150" y1="581" x2="150" y2="596"/>
    <line x1="255" y1="581" x2="255" y2="596"/>
    <line x1="500" y1="581" x2="500" y2="596"/>
    <line x1="700" y1="581" x2="700" y2="596"/>
  </g>
  <text x="150" y="614" font-family="Georgia, serif" font-size="16" fill="#5b7f96" text-anchor="middle">Ohr</text>
  <text x="255" y="614" font-family="Georgia, serif" font-size="16" fill="#5b7f96" text-anchor="middle">Schulter</text>
  <text x="380" y="614" font-family="Georgia, serif" font-size="16" fill="#111" text-anchor="middle">Kreuzbein frei</text>
  <text x="500" y="614" font-family="Georgia, serif" font-size="16" fill="#5b7f96" text-anchor="middle">Hüfte</text>
  <text x="700" y="614" font-family="Georgia, serif" font-size="16" fill="#5b7f96" text-anchor="middle">Knöchel</text>
</svg>
