<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
  <!-- Zum Abschnitt "Die einzige Regel zur Saattiefe, die man braucht" im
       Agrikultur-Kapitel "Aussaat: wie tief, wie dicht, wann vereinzeln".
       Bodenquerschnitt mit Massangaben.
       Die Regel aus dem Text: Samen werden hoechstens doppelt so tief bedeckt,
       wie sie dick sind. Zwei Beispiele aus dem Text bilden das GENAU ab:
       Salatsamen 0,5 mm dick -> 1 mm Erde (Verhaeltnis 1:2), Bohne 1 cm dick
       -> 2 cm Erde (Verhaeltnis 1:2) — beide Klammern sind bewusst gleich lang
       gezeichnet, weil das VERHAELTNIS gleich ist, nicht die Groesse.
       Unten der haeufigste Fehler laut Text: zu tief gesaet, der Keimling
       kommt nie an. -->
  <rect width="900" height="650" fill="#faf9f6"/>

  <text x="450" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#111">Höchstens doppelt so tief wie dick</text>

  <!-- Panel A: Salatsamen -->
  <text x="240" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#111">Salatsamen</text>
  <text x="58" y="128" font-family="Georgia, serif" font-size="15" fill="#5b7f96">Erdoberfläche</text>
  <rect x="50" y="140" width="380" height="280" fill="#5b7f96" fill-opacity="0.13"/>
  <line x1="50" y1="140" x2="430" y2="140" stroke="#111" stroke-width="5" stroke-linecap="round"/>

  <circle cx="190" cy="180" r="8" fill="#111"/>

  <!-- Tiefe (Erde ueber dem Samen), dicht am Samen, damit der Bezug klar ist -->
  <g stroke="#5b7f96" stroke-width="3" fill="none">
    <line x1="165" y1="140" x2="165" y2="172"/>
    <line x1="160" y1="140" x2="170" y2="140"/>
    <line x1="160" y1="172" x2="170" y2="172"/>
  </g>
  <text x="155" y="161" text-anchor="end" font-family="Georgia, serif" font-size="18" fill="#111">1 mm</text>

  <!-- Dicke des Samens, dicht am Samen -->
  <g stroke="#5b7f96" stroke-width="3" fill="none">
    <line x1="215" y1="172" x2="215" y2="188"/>
    <line x1="210" y1="172" x2="220" y2="172"/>
    <line x1="210" y1="188" x2="220" y2="188"/>
  </g>
  <text x="225" y="185" text-anchor="start" font-family="Georgia, serif" font-size="18" fill="#111">0,5 mm</text>

  <!-- Panel B: Bohne -->
  <text x="660" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#111">Bohne</text>
  <rect x="470" y="140" width="380" height="280" fill="#5b7f96" fill-opacity="0.13"/>
  <line x1="470" y1="140" x2="850" y2="140" stroke="#111" stroke-width="5" stroke-linecap="round"/>

  <circle cx="620" cy="250" r="22" fill="#111"/>

  <!-- Tiefe, dicht am Samen -->
  <g stroke="#5b7f96" stroke-width="3" fill="none">
    <line x1="580" y1="140" x2="580" y2="228"/>
    <line x1="575" y1="140" x2="585" y2="140"/>
    <line x1="575" y1="228" x2="585" y2="228"/>
  </g>
  <text x="568" y="188" text-anchor="end" font-family="Georgia, serif" font-size="18" fill="#111">2 cm</text>

  <!-- Dicke, dicht am Samen -->
  <g stroke="#5b7f96" stroke-width="3" fill="none">
    <line x1="660" y1="228" x2="660" y2="272"/>
    <line x1="655" y1="228" x2="665" y2="228"/>
    <line x1="655" y1="272" x2="665" y2="272"/>
  </g>
  <text x="672" y="254" text-anchor="start" font-family="Georgia, serif" font-size="18" fill="#111">1 cm</text>

  <!-- Unten: der haeufigste Fehler -->
  <text x="450" y="460" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#d65a1a">Der häufigste Fehler: zu tief</text>
  <rect x="50" y="500" width="800" height="130" fill="#5b7f96" fill-opacity="0.13"/>
  <line x1="50" y1="500" x2="850" y2="500" stroke="#111" stroke-width="5" stroke-linecap="round"/>

  <!-- richtig gesaet -->
  <circle cx="250" cy="550" r="10" fill="#111"/>
  <g stroke="#5b7f96" stroke-width="3" fill="none">
    <line x1="215" y1="500" x2="215" y2="540"/>
    <line x1="210" y1="500" x2="220" y2="500"/>
    <line x1="210" y1="540" x2="220" y2="540"/>
  </g>
  <text x="250" y="585" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#111">richtig</text>

  <!-- zu tief gesaet: die eine kritische Stelle -->
  <line x1="590" y1="540" x2="710" y2="540" stroke="#5b7f96" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="584" y="536" text-anchor="end" font-family="Georgia, serif" font-size="13" fill="#5b7f96">Grenze: doppelte Tiefe</text>

  <circle cx="650" cy="610" r="10" fill="#d65a1a"/>
  <g stroke="#d65a1a" stroke-width="4" fill="none">
    <line x1="615" y1="500" x2="615" y2="600"/>
    <line x1="608" y1="500" x2="622" y2="500"/>
    <line x1="608" y1="600" x2="622" y2="600"/>
  </g>
  <text x="672" y="560" text-anchor="start" font-family="Georgia, serif" font-size="20" fill="#d65a1a">ZU TIEF</text>
</svg>
