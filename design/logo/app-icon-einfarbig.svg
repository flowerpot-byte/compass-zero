<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Compass Zero – App-Icon, einfarbige Fassung</title>
  <!-- Android faerbt "Themed Icons" selbst ein und kennt nur eine Farbe. Das
       Motiv muss deshalb allein ueber Form und Aussparungen lesbar bleiben:
       ein einziger Umriss, in den Falz, Kompassring und Nadel als Loecher
       geschnitten sind. Der Kompass liegt hier vollstaendig auf der Buchflaeche —
       ragte er darueber hinaus, kippte die Form ausserhalb des Buches um und der
       Ring wuerde dort massiv statt hohl. -->
